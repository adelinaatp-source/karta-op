<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОП — группы «Север», «ЮГ»</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1c2430; --muted:#6b7787;
    --line:#e3e7ec; --ok:#d92b2b; --pend:#2f6fed; --warn:#b06000;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; height:100vh; overflow:hidden;
  }
  #side{width:400px; flex:0 0 400px; background:var(--panel);
        border-right:1px solid var(--line); display:flex; flex-direction:column}
  #side header{padding:15px 18px 12px; border-bottom:1px solid var(--line)}
  #side h1{margin:0 0 3px; font-size:16px; letter-spacing:-.01em}
  #side .sub{color:var(--muted); font-size:12px}
  #side .sub a{color:var(--muted)}
  #count{margin-top:9px; font-size:12.5px; font-weight:600; color:var(--ok)}
  #count span{font-weight:400; color:var(--muted)}
  .row{display:flex; gap:6px 13px; margin-top:8px; font-size:12px; flex-wrap:wrap;
       align-items:center}
  .row label{display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none}
  .row .lg{display:flex; align-items:center; gap:5px; color:var(--muted)}
  .row .cap{color:var(--muted); font-size:11px; letter-spacing:.05em;
            text-transform:uppercase; font-weight:600; flex:0 0 100%}
  .swv{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--ok)}
  .swp{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--pend)}
  #list{overflow:auto; padding:8px 10px 24px; flex:1}
  .ghdr{margin:16px 8px 2px; font-size:13px; font-weight:700}
  .ghdr small{font-weight:400; color:var(--muted)}
  .grp{margin:11px 8px 5px; font-size:11px; letter-spacing:.06em;
       text-transform:uppercase; color:var(--muted); font-weight:600}
  .item{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
        padding:8px 10px; border:0; background:none; border-radius:8px;
        cursor:pointer; font:inherit; color:inherit}
  .item:hover{background:#f0f4fb}
  .item.on{background:#e6eefc}
  .op{flex:0 0 56px; height:22px; border-radius:11px; color:#fff;
      font:600 11px/22px sans-serif; text-align:center}
  .op.v{box-shadow:0 0 0 2px #fde7e7}
  .item .name{font-weight:600}
  .item .addr{color:var(--muted); font-size:12.5px}
  .item .obs{display:block; margin-top:3px; font-size:12px; color:#8a4b00;
             background:#fff5e6; border-radius:5px; padding:3px 7px}
  .item .note{display:block; margin-top:3px}
  .tag{display:inline-block; font-size:10px; font-weight:600; padding:1px 5px;
       border-radius:4px; background:#eef1f5; color:#4a5666; margin-right:4px;
       margin-bottom:2px}
  .tag.ok{background:#fde7e7; color:#a81f1f}
  .tag.warn{background:#fdf0dd; color:#96601a}
  .tag.rep{background:#e8effc; color:#24509c; cursor:pointer}
  .tag.rep:hover{background:#d7e3fa}

  /* панель отчёта */
  #rp{position:absolute; top:0; right:0; bottom:0; width:min(660px,62%);
      background:#fff; border-left:1px solid var(--line); z-index:1200;
      box-shadow:-6px 0 26px rgba(20,30,45,.16); display:flex; flex-direction:column}
  #rp[hidden]{display:none}
  #rp .rp-head{padding:14px 18px; border-bottom:1px solid var(--line);
       display:flex; gap:12px; align-items:flex-start}
  #rp .rp-head b{display:block; font-size:15px; line-height:1.3}
  #rp .rp-head .m{color:var(--muted); font-size:12px; margin-top:3px}
  #rp .rp-head button{margin-left:auto; border:1px solid var(--line); background:#fff;
       border-radius:7px; width:30px; height:30px; cursor:pointer; font-size:15px;
       color:var(--muted); flex:0 0 auto}
  #rp .rp-head button:hover{background:#f2f5f9}
  #rp .rp-tabs{display:flex; gap:6px; padding:9px 18px 0; flex-wrap:wrap}
  #rp .rp-tabs button{border:1px solid var(--line); background:#fff; border-radius:7px;
       padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
  #rp .rp-tabs button.on{background:#e6eefc; border-color:#c3d5f5; color:#24509c;
       font-weight:600}
  #rp .rp-body{overflow:auto; padding:6px 22px 30px; font-size:13.5px; line-height:1.55}
  #rp .rp-body h2{font-size:15px; margin:20px 0 7px}
  #rp .rp-body h3{font-size:13.5px; margin:16px 0 5px}
  #rp .rp-body h4,#rp .rp-body h5,#rp .rp-body h6{font-size:13px; margin:13px 0 4px}
  #rp .rp-body p{margin:7px 0}
  #rp .rp-body ul,#rp .rp-body ol{margin:7px 0; padding-left:22px}
  #rp .rp-body li{margin:3px 0}
  #rp .rp-body hr{border:0; border-top:1px solid var(--line); margin:16px 0}
  #rp .rp-body code{background:#f2f4f7; border-radius:4px; padding:1px 4px; font-size:12.5px}
  #rp .rp-body table{border-collapse:collapse; width:100%; margin:10px 0; font-size:12.5px;
       display:block; overflow-x:auto}
  #rp .rp-body th,#rp .rp-body td{border:1px solid var(--line); padding:5px 8px;
       text-align:left; vertical-align:top}
  #rp .rp-body th{background:#f6f8fa; font-weight:600}
  #rp .rp-body tr:nth-child(even) td{background:#fbfcfd}
  /* краткая справка */
  #rp .rp-body.brief dl.rs{display:grid; grid-template-columns:auto 1fr; gap:4px 14px;
       margin:14px 0 4px; padding:12px 14px; background:#f7f9fc; border-radius:9px}
  #rp .rp-body.brief dl.rs dt{color:var(--muted); font-size:12px}
  #rp .rp-body.brief dl.rs dd{margin:0; font-size:13px}
  #rp .rp-body.brief ol.rs-obs{list-style:none; padding:0; margin:8px 0 0;
       counter-reset:obs}
  #rp .rp-body.brief ol.rs-obs li{counter-increment:obs; position:relative;
       padding:9px 0 9px 30px; border-top:1px solid var(--line)}
  #rp .rp-body.brief ol.rs-obs li:before{content:counter(obs); position:absolute;
       left:0; top:9px; width:20px; height:20px; border-radius:50%;
       background:var(--ok); color:#fff; font:700 11px/20px sans-serif;
       text-align:center}
  #rp .rp-body.brief ol.rs-obs b{display:block; font-size:13.5px}
  #rp .rp-body.brief ol.rs-obs span{display:block; color:#4a5666; margin-top:2px}
  #rp .rp-body.brief .rs-chk{color:var(--muted)}
  @media (max-width:760px){ #rp{width:100%} }
  #empty{display:none; padding:26px 18px; color:var(--muted); font-size:13px}
  #map{flex:1; height:100%}
  .pin{padding:0 6px; min-width:34px; height:22px; border-radius:11px;
       border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35);
       color:#fff; font:700 11px/18px sans-serif; text-align:center; white-space:nowrap}
  .pin.v{box-shadow:0 0 0 2.5px rgba(217,43,43,.28), 0 2px 7px rgba(0,0,0,.4)}
  .pin.q{border-style:dashed}
  .leaflet-popup-content{font:13.5px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; min-width:230px}
  .leaflet-popup-content b{display:block; font-size:14px; margin-bottom:1px}
  .leaflet-popup-content .a{color:#6b7787; margin-bottom:7px}
  .leaflet-popup-content .visited{background:#fde7e7; color:#a81f1f; border-radius:6px;
       padding:5px 8px; margin-bottom:8px; font-size:12.5px; font-weight:600}
  .leaflet-popup-content .visited i{display:block; font-style:normal; font-weight:400; color:#8c2b2b}
  .leaflet-popup-content dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px}
  .leaflet-popup-content dt{color:#6b7787; font-size:12px}
  .leaflet-popup-content dd{margin:0; font-size:12.5px}
  @media (max-width:760px){
    body{flex-direction:column}
    #side{width:auto;flex:0 0 48%;border-right:0;border-bottom:1px solid var(--line)}
  }
</style>
</head>

var META = {"groups": [{"name": "Север", "sup": "Абдеев А.Р"}, {"name": "ЮГ", "sup": "Камаров А.А."}], "divisions": ["1", "2", "5", "6"]};

var VISITED = "#d92b2b";   // объезд пройден — красный
var PENDING = "#2f6fed";   // ещё не были — синий
function colorOf(p){ return p.visits.length ? VISITED : PENDING; }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

var map = L.map("map", {scrollWheelZoom:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19,
  attribution:'&copy; участники <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

// ─── чекбоксы групп и дивизионов строим по данным ───
function addBox(rowId, attr, value, label){
  var l = document.createElement("label");
  l.innerHTML = '<input type="checkbox" ' + attr + '="' + esc(value) + '" checked>' + esc(label);
  document.getElementById(rowId).appendChild(l);
}
META.groups.forEach(function(g){ addBox("rowGroups", "data-g", g.name, g.name + " — " + g.sup); });
META.divisions.forEach(function(d){ addBox("rowDiv", "data-d", d, d); });

// ─── маркеры ───
POINTS.forEach(function(p){
  var was = p.visits.length > 0;
  var icon = L.divIcon({
    className:"", iconSize:[38,22], iconAnchor:[19,22], popupAnchor:[0,-20],
    html:'<div class="pin' + (was ? " v" : "") + (p.approx ? " q" : "") +
         '" style="background:' + colorOf(p) + '">' + (was ? "✓ " : "") + esc(p.num) + "</div>"
  });
  var m = L.marker([p.lat,p.lon], {icon:icon});
  var visitHtml = p.visits.map(function(v){
    return '<div class="visited">✓ Объезд ' + esc(v.date) + "<i>" + esc(v.by) + "</i></div>";
  }).join("");
  var repHtml = p.reports.length
    ? '<div style="margin:-2px 0 8px">' + p.reports.map(function(r, i){
        return '<span class="tag rep" data-rep="' + esc(p.op) + '" data-i="' + i +
               '">📄 отчёт ' + esc(r.date) + "</span>";
      }).join("") + "</div>"
    : "";
  m.bindPopup(
    "<b>" + esc(p.op) + (p.name ? " «" + esc(p.name) + "»" : "") + "</b>" +
    '<div class="a">' + esc(p.addr) + "</div>" +
    visitHtml + repHtml +
    "<dl>" +
      "<dt>Группа</dt><dd>" + esc(p.g) + (p.sup ? " · " + esc(p.sup) : "") + "</dd>" +
      "<dt>Дивизион</dt><dd>" + esc(p.d) + "</dd>" +
      (p.tv.length ? "<dt>Товароведы</dt><dd>" + p.tv.map(esc).join("<br>") + "</dd>" : "") +
      (p.st ? "<dt>Роль</dt><dd>" + esc(p.st) + "</dd>" : "") +
      (p.flags.length ? "<dt>Отметки</dt><dd>" + p.flags.map(esc).join(", ") + "</dd>" : "") +
      (p.note ? "<dt>Комментарий</dt><dd>" + esc(p.note) + "</dd>" : "") +
      (p.obs ? "<dt>Важное наблюдение</dt><dd><b style='display:inline;font-size:12.5px'>" +
               esc(p.obs) + "</b></dd>" : "") +
      "<dt>Координаты</dt><dd>" + p.lat.toFixed(6) + ", " + p.lon.toFixed(6) +
        (p.approx ? '<br><span style="color:#b06000">⚠ приблизительные' +
          (p.approxNote ? ": " + esc(p.approxNote) : "") + "</span>" : "") + "</dd>" +
    "</dl>"
  );
  p._m = m;
});

// ─── список слева ───
var list = document.getElementById("list");
var lastG = null, lastArea = null;
POINTS.forEach(function(p){
  if (p.g !== lastG){
    var gh = document.createElement("div");
    gh.className = "ghdr"; gh.setAttribute("data-g", p.g);
    gh.innerHTML = "Группа «" + esc(p.g) + "»" + (p.sup ? " <small>· " + esc(p.sup) + "</small>" : "");
    list.appendChild(gh); lastG = p.g; lastArea = null;
  }
  if (p.area !== lastArea){
    var h = document.createElement("div");
    h.className = "grp"; h.textContent = p.area;
    list.appendChild(h); lastArea = p.area;
  }
  var tags = [];
  p.visits.forEach(function(v){
    tags.push('<span class="tag ok">✓ ' + esc(v.date) + " · " + esc(v.by) + "</span>");
  });
  p.reports.forEach(function(r, i){
    tags.push('<span class="tag rep" data-rep="' + esc(p.op) + '" data-i="' + i +
              '">📄 отчёт ' + esc(r.date) + "</span>");
  });
  p.flags.forEach(function(f){ tags.push('<span class="tag">' + esc(f) + "</span>"); });
  if (p.st) tags.push('<span class="tag">ст. товаровед</span>');
  if (p.approx) tags.push('<span class="tag warn">коорд. прибл.</span>');

  var b = document.createElement("button");
  b.className = "item";
  b.setAttribute("data-op", p.op);
  b.innerHTML =
    '<span class="op' + (p.visits.length ? " v" : "") + '" style="background:' +
      colorOf(p) + '">' + esc(p.op) + "</span>" +
    '<span><span class="name">' + esc(p.name) + "</span><br>" +
    '<span class="addr">' + esc(p.addr) + "</span>" +
    (p.obs ? '<span class="obs">❗ ' + esc(p.obs) + "</span>" : "") +
    (tags.length ? '<span class="note">' + tags.join("") + "</span>" : "") +
    "</span>";
  b.onclick = function(){
    document.querySelectorAll(".item").forEach(function(e){ e.classList.remove("on"); });
    b.classList.add("on");
    if (!map.hasLayer(p._m)) return;
    map.flyTo([p.lat,p.lon], 17, {duration:0.6});
    p._m.openPopup();
  };
  list.appendChild(b);
});

// ─── панель отчёта об объезде ───
var rp = document.getElementById("rp");
var rpTitle = document.getElementById("rpTitle");
var rpMeta = document.getElementById("rpMeta");
var rpTabs = document.getElementById("rpTabs");
var rpBody = document.getElementById("rpBody");

// Панель лежит внутри контейнера карты — гасим прокрутку и клики,
// иначе колесо мыши зумит карту вместо прокрутки отчёта.
L.DomEvent.disableScrollPropagation(rp);
L.DomEvent.disableClickPropagation(rp);

function byOp(op){
  for (var i = 0; i < POINTS.length; i++) if (POINTS[i].op === op) return POINTS[i];
  return null;
}

function openReport(op, i, view){
  var p = byOp(op);
  if (!p || !p.reports.length) return;
  i = Math.max(0, Math.min(i | 0, p.reports.length - 1));
  view = view || "brief";                       // по умолчанию — краткая справка
  var r = p.reports[i];
  rpTitle.textContent = p.op + (p.name ? " «" + p.name + "»" : "");
  rpMeta.textContent = "Объезд " + r.date + (r.author ? " · " + r.author : "") +
                       " · " + r.file;

  rpTabs.innerHTML = "";
  [["brief", "Кратко"], ["full", "Полный текст"]].forEach(function(v){
    var b = document.createElement("button");
    b.textContent = v[1];
    if (view === v[0]) b.className = "on";
    b.onclick = function(){ openReport(op, i, v[0]); };
    rpTabs.appendChild(b);
  });
  if (p.reports.length > 1){
    var sep = document.createElement("span");
    sep.style.cssText = "align-self:center;color:#9aa5b1;margin:0 2px";
    sep.textContent = "|";
    rpTabs.appendChild(sep);
    p.reports.forEach(function(rr, j){
      var b = document.createElement("button");
      b.textContent = rr.date;
      if (j === i) b.className = "on";
      b.onclick = function(){ openReport(op, j, view); };
      rpTabs.appendChild(b);
    });
  }

  rpBody.className = "rp-body" + (view === "brief" ? " brief" : "");
  rpBody.innerHTML = view === "brief" ? r.brief : r.html;
  rpBody.scrollTop = 0;
  rp.hidden = false;
}

function closeReport(){ rp.hidden = true; }

document.getElementById("rpClose").onclick = closeReport;
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeReport();
});
// Перехват в фазе погружения: тег отчёта лежит внутри кнопки списка,
// иначе сработал бы её собственный обработчик.
document.addEventListener("click", function(e){
  var t = e.target && e.target.closest ? e.target.closest(".tag.rep") : null;
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  openReport(t.getAttribute("data-rep"), parseInt(t.getAttribute("data-i"), 10));
}, true);

// ─── фильтры ───
function applyFilter(){
  var gOn = {}, dOn = {};
  document.querySelectorAll("input[data-g]").forEach(function(i){ gOn[i.dataset.g] = i.checked; });
  document.querySelectorAll("input[data-d]").forEach(function(i){ dOn[i.dataset.d] = i.checked; });
  var onlyV = document.getElementById("onlyVisited").checked;

  var shown = 0;
  POINTS.forEach(function(p){
    var vis = gOn[p.g] && dOn[p.d] && (!onlyV || p.visits.length > 0);
    if (vis){ shown++; if (!map.hasLayer(p._m)) p._m.addTo(map); }
    else if (map.hasLayer(p._m)) map.removeLayer(p._m);
    var btn = document.querySelector('.item[data-op="' + p.op + '"]');
    if (btn) btn.style.display = vis ? "" : "none";
  });

  document.querySelectorAll(".ghdr").forEach(function(h){
    h.style.display = gOn[h.getAttribute("data-g")] ? "" : "none";
  });
  document.querySelectorAll(".grp").forEach(function(h){
    var any = false, n = h.nextElementSibling;
    while (n && !n.classList.contains("grp") && !n.classList.contains("ghdr")){
      if (n.style.display !== "none") any = true;
      n = n.nextElementSibling;
    }
    h.style.display = any ? "" : "none";
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}
document.querySelectorAll("#side input[type=checkbox]").forEach(function(i){
  i.addEventListener("change", applyFilter);
});

// ─── счётчик ───
function done(a){ return a.filter(function(p){ return p.visits.length; }).length; }
var byGroup = META.groups.map(function(g){
  var a = POINTS.filter(function(p){ return p.g === g.name; });
  return esc(g.name) + " " + done(a) + "/" + a.length;
}).join(" · ");
document.getElementById("count").innerHTML =
  "✓ Объезд пройден: " + done(POINTS) + " из " + POINTS.length +
  " <span>· " + byGroup + "</span>";

applyFilter();
map.fitBounds(L.latLngBounds(POINTS.map(function(p){ return [p.lat,p.lon]; })), {padding:[45,45]});
</script>
