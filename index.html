<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1c2430; --muted:#6b7787;
    --line:#e3e7ec; --ok:#d92b2b; --pend:#2f6fed; --warn:#b06000;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; height:100vh; overflow:hidden;
  }
  #side{width:400px; flex:0 0 400px; background:var(--panel);
        border-right:1px solid var(--line); display:flex; flex-direction:column}
  #side header{padding:15px 18px 12px; border-bottom:1px solid var(--line)}
  #side h1{margin:0 0 3px; font-size:16px; letter-spacing:-.01em}
  #side .sub{color:var(--muted); font-size:12px}
  #side .sub a{color:var(--muted)}
  #count{margin-top:9px; font-size:12.5px; font-weight:600; color:var(--ok)}
  #count span{font-weight:400; color:var(--muted)}
  .row{display:flex; gap:6px 13px; margin-top:8px; font-size:12px; flex-wrap:wrap;
       align-items:center}
  .row label{display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none}
  .row .lg{display:flex; align-items:center; gap:5px; color:var(--muted)}
  .row .cap{color:var(--muted); font-size:11px; letter-spacing:.05em;
            text-transform:uppercase; font-weight:600; flex:0 0 100%}
  .swv{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--ok)}
  .swp{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--pend)}
  #list{overflow:auto; padding:8px 10px 24px; flex:1}
  .ghdr{margin:16px 8px 2px; font-size:13px; font-weight:700}
  .ghdr small{font-weight:400; color:var(--muted)}
  .grp{margin:11px 8px 5px; font-size:11px; letter-spacing:.06em;
       text-transform:uppercase; color:var(--muted); font-weight:600}
  .item{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
        padding:8px 10px; border:0; background:none; border-radius:8px;
        cursor:pointer; font:inherit; color:inherit}
  .item:hover{background:#f0f4fb}
  .item.on{background:#e6eefc}
  .op{flex:0 0 56px; height:22px; border-radius:11px; color:#fff;
      font:600 11px/22px sans-serif; text-align:center}
  .op.v{box-shadow:0 0 0 2px #fde7e7}
  .item .name{font-weight:600}
  .item .addr{color:var(--muted); font-size:12.5px}
  .item .obs{display:block; margin-top:3px; font-size:12px; color:#8a4b00;
             background:#fff5e6; border-radius:5px; padding:3px 7px}
  .item .note{display:block; margin-top:3px}
  .tag{display:inline-block; font-size:10px; font-weight:600; padding:1px 5px;
       border-radius:4px; background:#eef1f5; color:#4a5666; margin-right:4px;
       margin-bottom:2px}
  .tag.ok{background:#fde7e7; color:#a81f1f}
  .tag.warn{background:#fdf0dd; color:#96601a}
  .tag.rep{background:#e8effc; color:#24509c; cursor:pointer}
  .tag.rep:hover{background:#d7e3fa}

  /* панель отчёта */
  #rp{position:absolute; top:0; right:0; bottom:0; width:min(660px,62%);
      background:#fff; border-left:1px solid var(--line); z-index:1200;
      box-shadow:-6px 0 26px rgba(20,30,45,.16); display:flex; flex-direction:column}
  #rp[hidden]{display:none}
  #rp .rp-head{padding:14px 18px; border-bottom:1px solid var(--line);
       display:flex; gap:12px; align-items:flex-start}
  #rp .rp-head b{display:block; font-size:15px; line-height:1.3}
  #rp .rp-head .m{color:var(--muted); font-size:12px; margin-top:3px}
  #rp .rp-head button{margin-left:auto; border:1px solid var(--line); background:#fff;
       border-radius:7px; width:30px; height:30px; cursor:pointer; font-size:15px;
       color:var(--muted); flex:0 0 auto}
  #rp .rp-head button:hover{background:#f2f5f9}
  #rp .rp-tabs{display:flex; gap:6px; padding:9px 18px 0; flex-wrap:wrap}
  #rp .rp-tabs button{border:1px solid var(--line); background:#fff; border-radius:7px;
       padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
  #rp .rp-tabs button.on{background:#e6eefc; border-color:#c3d5f5; color:#24509c;
       font-weight:600}
  #rp .rp-body{overflow:auto; padding:6px 22px 30px; font-size:13.5px; line-height:1.55}
  #rp .rp-body h2{font-size:15px; margin:20px 0 7px}
  #rp .rp-body h3{font-size:13.5px; margin:16px 0 5px}
  #rp .rp-body h4,#rp .rp-body h5,#rp .rp-body h6{font-size:13px; margin:13px 0 4px}
  #rp .rp-body p{margin:7px 0}
  #rp .rp-body ul,#rp .rp-body ol{margin:7px 0; padding-left:22px}
  #rp .rp-body li{margin:3px 0}
  #rp .rp-body hr{border:0; border-top:1px solid var(--line); margin:16px 0}
  #rp .rp-body code{background:#f2f4f7; border-radius:4px; padding:1px 4px; font-size:12.5px}
  #rp .rp-body table{border-collapse:collapse; width:100%; margin:10px 0; font-size:12.5px;
       display:block; overflow-x:auto}
  #rp .rp-body th,#rp .rp-body td{border:1px solid var(--line); padding:5px 8px;
       text-align:left; vertical-align:top}
  #rp .rp-body th{background:#f6f8fa; font-weight:600}
  #rp .rp-body tr:nth-child(even) td{background:#fbfcfd}
  /* краткая справка */
  #rp .rp-body.brief dl.rs{display:grid; grid-template-columns:auto 1fr; gap:4px 14px;
       margin:14px 0 4px; padding:12px 14px; background:#f7f9fc; border-radius:9px}
  #rp .rp-body.brief dl.rs dt{color:var(--muted); font-size:12px}
  #rp .rp-body.brief dl.rs dd{margin:0; font-size:13px}
  #rp .rp-body.brief ol.rs-obs{list-style:none; padding:0; margin:8px 0 0;
       counter-reset:obs}
  #rp .rp-body.brief ol.rs-obs li{counter-increment:obs; position:relative;
       padding:9px 0 9px 30px; border-top:1px solid var(--line)}
  #rp .rp-body.brief ol.rs-obs li:before{content:counter(obs); position:absolute;
       left:0; top:9px; width:20px; height:20px; border-radius:50%;
       background:var(--ok); color:#fff; font:700 11px/20px sans-serif;
       text-align:center}
  #rp .rp-body.brief ol.rs-obs b{display:block; font-size:13.5px}
  #rp .rp-body.brief ol.rs-obs span{display:block; color:#4a5666; margin-top:2px}
  #rp .rp-body.brief .rs-chk{color:var(--muted)}
  @media (max-width:760px){ #rp{width:100%} }
  #empty{display:none; padding:26px 18px; color:var(--muted); font-size:13px}
  #map{flex:1; height:100%}
  .pin{padding:0 6px; min-width:34px; height:22px; border-radius:11px;
       border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35);
       color:#fff; font:700 11px/18px sans-serif; text-align:center; white-space:nowrap}
  .pin.v{box-shadow:0 0 0 2.5px rgba(217,43,43,.28), 0 2px 7px rgba(0,0,0,.4)}
  .pin.q{border-style:dashed}
  .leaflet-popup-content{font:13.5px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; min-width:230px}
  .leaflet-popup-content b{display:block; font-size:14px; margin-bottom:1px}
  .leaflet-popup-content .a{color:#6b7787; margin-bottom:7px}
  .leaflet-popup-content .visited{background:#fde7e7; color:#a81f1f; border-radius:6px;
       padding:5px 8px; margin-bottom:8px; font-size:12.5px; font-weight:600}
  .leaflet-popup-content .visited i{display:block; font-style:normal; font-weight:400; color:#8c2b2b}
  .leaflet-popup-content dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px}
  .leaflet-popup-content dt{color:#6b7787; font-size:12px}
  .leaflet-popup-content dd{margin:0; font-size:12.5px}
  @media (max-width:760px){
    body{flex-direction:column}
    #side{width:auto;flex:0 0 48%;border-right:0;border-bottom:1px solid var(--line)}
  }
</style>
</head>

<script>
var POINTS = [{"op": "ОП-5", "num": "5", "name": "Транспортная", "addr": "г. Уфа, ул. Транспортная, д. 46/1", "g": "Север", "sup": "Абдеев А.Р", "area": "Уфа — Инорс", "d": "1", "lat": 54.7808892, "lon": 56.1210404, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Пронин Артем Вадимович", "date": "08.09.2026"}, {"by": "Хазиев Тимур Ильнурович", "date": "15.09.2026", "src": "отчёт"}, {"by": "Хазиев Тимур Ильнурович", "date": "16.09.2026", "src": "отчёт"}], "reports": [{"date": "08.09.2026", "author": "Пронин Артем Вадимович", "file": "Отчёт — 08.09.2026 — Пронин А.В. — ОП-5.md", "title": "Отчёт об объезде ОП-5 «Транспортная»", "html": "<h2>Отчёт об объезде ОП-5 «Транспортная»</h2>\n<p>Дата подготовки: <strong>08.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании наблюдения за клиентскими операциями в рабочем окне, беседы с товароведом и внешнего осмотра помещения. Записи велись в блокнот.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт зафиксирован по состоянию на 08.09.2026 в том объёме, который получен на визите. Сведения, которые на визите не собирались, отмечены «Уточнить» или «Не замерено» — это отсутствие данных, а не отсутствие операции на ОП. Перечень открытых пунктов — в конце отчёта.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-5 «Транспортная»</td></tr>\n<tr><td>Адрес</td><td>ул. Транспортная, 46/1</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Север», Дивизион 1</td></tr>\n<tr><td>Дата визита</td><td>08.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Пронин Артём Вадимович</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Уточнить</td></tr>\n<tr><td>Продолжительность</td><td>Уточнить</td></tr>\n<tr><td>С кем работали, должности</td><td>[товаровед], товаровед — работала в окне одна. В зоне комиссионного магазина техники — ещё один сотрудник (должность уточнить)</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Осмотрели помещение и торговую зону: планировку, оформление, витрины, информационные стенды, санитарное состояние.</li>\n<li>Наблюдали работу товароведа в клиентском окне: четыре клиента подряд, четыре разные операции — скупка с расчётом наличными, займ с выдачей на карту, выкуп за наличные, оплата процентов картой.</li>\n<li>Фиксировали по каждой операции: где выполняется, какие шаги, что печатается, где возникает ожидание и повторная работа.</li>\n<li>Беседовали с товароведом по §8 чек-листа: что тормозит, к чему приходится обращаться вне системы.</li>\n<li>Зафиксировали проблему мобильной связи, ошибку печати чека по залогам перенесённого ОП и санитарное замечание.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Наблюдение, внешний осмотр</td><td>Помещение чистое и опрятное. При входе — зона комиссионного магазина техники (преимущественно смартфоны и дорогая техника), далее — зона ломбарда (скупка, займы). Два рабочих окна, фактически занято одно: товаровед работала одна, второй сотрудник — в зоне магазина техники. Витрина оформлена аккуратно, информационные стенды размещены по отделению. За время наблюдения — 4 клиента, по одному на каждую операцию; очереди не было</td></tr>\n<tr><td>Скупка, расчёт наличными</td><td>Наблюдение реальной операции</td><td>Разобрана по шагам, см. ниже. Выдача на карту сорвалась на подтверждении номера телефона — перешли на наличные</td></tr>\n<tr><td>Займ, выдача на карту</td><td>Наблюдение реальной операции</td><td>Разобран по шагам. Подтверждение телефона и подписание ПЭП прошли штатно, код клиенту дошёл</td></tr>\n<tr><td>Выкуп, расчёт наличными</td><td>Наблюдение реальной операции</td><td>Разобран по шагам. Залог оформлен на другом ОП; чек по операции не выдан — ошибка печати в АРМ</td></tr>\n<tr><td>Оплата процентов, безналичный расчёт</td><td>Наблюдение реальной операции</td><td>Разобрана по шагам. Тот же случай: залог с перенесённого ОП, чек не вышел, ошибка пропущена</td></tr>\n<tr><td>Рабочее место и техника</td><td>Наблюдение и беседа</td><td>АРМ за время наблюдения не зависал, работа шла быстро. Приклеенных к монитору шпаргалок нет. Со слов товароведа, приходится обращаться к распечатанным приказам — тарифные сетки и бонусная программа: редкие пробы и статусы лояльности</td></tr>\n<tr><td>Связь</td><td>Наблюдение и беседа</td><td>Слабый сигнал мобильной связи в помещении: СМС клиенту доходят не всегда, консультация по телефону затруднена. В одной из четырёх операций из-за этого сменили способ выдачи денег</td></tr>\n<tr><td>Работа с клиентом (скрипты, кросс-продажи)</td><td>Наблюдение</td><td>См. сквозные наблюдения ниже</td></tr>\n</tbody></table>\n<h4>1. Скупка с расчётом наличными: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от обращения клиента «хочу продать изделия» до выдачи наличных и размещения изделия на хранении.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиент.</p>\n<p><strong>Где выполняет:</strong> АРМ, рабочий стол «Скупка»; весы и инструмент для проверки пробы; печать документов; касса.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Обращение и создание документа</td><td>Клиент озвучил намерение продать изделия. Товаровед открывает рабочий стол «Скупка», создаёт новую скупку</td><td>—</td></tr>\n<tr><td>2. Выбор способа выдачи</td><td>Товаровед уточняет: на карту или наличными. Приоритетно предлагается карта. Клиент соглашается на карту</td><td>—</td></tr>\n<tr><td>3. Ввод данных клиента</td><td>Запрашивается паспорт, заполняются ФИО, паспортные данные, номер телефона</td><td>—</td></tr>\n<tr><td>4. Подтверждение номера телефона</td><td>Номер подтверждается кодом: выдача по СБП пойдёт на этот номер. Клиент не смог назвать код, сославшись на отсутствие связи</td><td>Ожидание кода и его недоставка. Способ выдачи меняется на наличные — возврат к уже пройденному шагу</td></tr>\n<tr><td>5. Оценка изделий</td><td>Осмотр, проверка пробы (кольцо и серьга, 585), взвешивание, озвучивание суммы. Клиент согласился</td><td>Не замерено</td></tr>\n<tr><td>6. Оформление и расчёт</td><td>Проведён документ скупочной квитанции, передан клиенту на подпись. Распечатаны договор и согласие на обработку ПДн. Выданы наличные и чек</td><td>—</td></tr>\n<tr><td>7. Размещение на хранении</td><td>По номенклатуре изделия распечатана спецификация, убрана вместе с изделием</td><td>—</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено. Переключений между программами не наблюдалось — работа велась в АРМ.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> скупочная квитанция (подписывает клиент), договор, согласие на обработку ПДн, кассовый чек, спецификация на изделие. Число экземпляров — уточнить. Повторного ввода в тетрадь или таблицы не наблюдалось.</p>\n<h4>2. Займ с выдачей на карту: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от обращения клиента за займом до перечисления суммы на карту и размещения изделия на хранении.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиент.</p>\n<p><strong>Где выполняет:</strong> АРМ, рабочий стол «Ломбард», документ «Залоговый билет»; СМС-код подтверждения телефона; подписание ПЭП по ссылке на стороне клиента.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Выбор способа выдачи</td><td>Предложена выдача на карту, клиент согласился</td><td>—</td></tr>\n<tr><td>2. Создание залогового билета</td><td>В рабочем столе «Ломбард» создаётся залоговый билет</td><td>—</td></tr>\n<tr><td>3. Данные клиента и сверка</td><td>Заполняются ФИО и номер телефона, данные проверяются кнопкой «Сверка», отправляется код подтверждения телефона</td><td>Ожидание СМС клиенту — в этот раз код дошёл</td></tr>\n<tr><td>4. Оценка и номенклатура</td><td>Осмотр изделия, занесение номенклатуры в залоговый билет. Озвучена стоимость 6 800 ₽; клиент согласился на сумму займа 6 000 ₽</td><td>—</td></tr>\n<tr><td>5. Проведение билета</td><td>Сумма займа введена в билет, билет проведён. С клиентом проговорены сумма и подписание ПЭП</td><td>—</td></tr>\n<tr><td>6. Подписание ПЭП</td><td>Клиент получает код подписания и озвучивает его; подписание подтверждается по ссылке кодом от клиента</td><td>Ожидание СМС клиенту</td></tr>\n<tr><td>7. Выдача и хранение</td><td>Сумма перечислена на карту. Изделие со спецификацией убрано на хранение</td><td>—</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> залоговый билет, спецификация на изделие; подписание — ПЭП кодом клиента. Печатные формы по этой операции отдельно не фиксировались — уточнить.</p>\n<h4>3. Выкуп за наличные (залог с перенесённого ОП): последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от обращения клиента за выкупом до передачи изделия и внесения денег в кассу.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиент.</p>\n<p><strong>Где выполняет:</strong> АРМ, поиск залогового билета и операции с договором; сейф хранения; касса.</p>\n<p><strong>Особенность случая:</strong> залог оформлен на ОП «Баландина»; отделение переехало на Транспортную, и обслуживание происходит здесь.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Поиск залога</td><td>Поиск и сверка залогового билета в АРМ по паспорту клиента</td><td>—</td></tr>\n<tr><td>2. Операция с договором</td><td>Выбирается операция выкупа, расчёт — наличными</td><td>—</td></tr>\n<tr><td>3. Расчёт с клиентом</td><td>Клиент передаёт деньги, товаровед пересчитывает</td><td>—</td></tr>\n<tr><td>4. Выдача изделия</td><td>По номеру спецификации изделие изъято из сейфа; перед передачей проведена оплата наличными; изделие передано клиенту, деньги убраны в кассу</td><td>—</td></tr>\n<tr><td>5. Чек</td><td>При печати чека в АРМ возникла ошибка — печать невозможна. Товаровед заранее предупредил клиента, что в связи с переездом ОП чек выдан быть не может, и пропустил действие</td><td>Действие пропущено: чек клиенту не выдан</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> кассовый чек по операции не выдан (ошибка печати). Остальные формы по операции — уточнить.</p>\n<h4>4. Оплата процентов картой (залог с перенесённого ОП): последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от обращения клиента до подтверждения оплаты в АРМ.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиент.</p>\n<p><strong>Где выполняет:</strong> АРМ, поиск залогового билета и операции с договором; платёжный терминал.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Поиск залога</td><td>Поиск залогового билета в АРМ по паспорту клиента</td><td>—</td></tr>\n<tr><td>2. Операция с договором</td><td>Выбирается оплата процентов, способ — безналичный. Клиент подтверждает намерение оплатить</td><td>—</td></tr>\n<tr><td>3. Оплата</td><td>Товаровед нажимает «Провести» — команда появляется на терминале только после проведения в АРМ. Клиент прикладывает карту, в АРМ приходит уведомление о статусе оплаты</td><td>Ожидание ответа терминала — не замерено</td></tr>\n<tr><td>4. Проверка результата</td><td>Товаровед переоткрывает документ залога и убеждается, что процент оплачен: поле «в залоге» отображает 1 день</td><td>Повторная работа: результат проверяется переоткрытием документа</td></tr>\n<tr><td>5. Чек</td><td>Чек в АРМ не вышел, ошибка пропущена. Клиенту озвучено, что залог с другого, переехавшего ОП</td><td>Действие пропущено: чек клиенту не выдан</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> кассовый чек по операции не выдан (ошибка печати).</p>\n<h4>Сквозные наблюдения по работе с клиентом</h4>\n<p>Одинаково во всех четырёх операциях:</p>\n<ul>\n<li>Выдача на карту предлагается как приоритетный способ расчёта.</li>\n<li>Клиенту описывается функционал мобильного приложения: добор, выкуп до рубля, оплата процентов.</li>\n<li>У каждого клиента уточняется наличие автомобиля и источник обращения («откуда узнали о нас»).</li>\n<li>Проговаривается возможность займа под залог автомобиля и ПТС.</li>\n<li>Отношение к клиентам доброжелательное, работа идёт быстро и аккуратно.</li>\n</ul>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Число клиентов за час и распределение по операциям, момент возникновения очереди, поведение при двух и более клиентах на одного сотрудника</td><td>Наблюдение шло по четырём клиентам подряд, замера потока за час не велось</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Состав одновременно открытых программ и окон АРМ, оборудование (принтер, детектор, весы, терминал), тип учётной записи — личная или общая</td><td>Не фиксировалось; уточнить дистанционно или на повторном визите</td></tr>\n<tr><td>Клиентские операции</td><td>Работа комиссионного магазина техники: приём, проверка, продажа, гарантия. Онлайн-площадки (Авито). Продление, невыкуп и передача в реализацию. Возврат товара. Перемещение между ОП</td><td>Наблюдение велось в окне ломбарда; операции магазина не разбирались</td></tr>\n<tr><td>Касса, товар и документы</td><td>Открытие и закрытие смены, инкассация, разнесение наличных и эквайринга, маркировка и поиск вещи на хранении, инвентаризация, полный перечень печатных форм за день</td><td>Визит пришёлся на середину смены; кассовые процедуры не наблюдались</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Что и кому сдаёт товаровед, сколько времени уходит на отчётность, число рабочих чатов, как узнают об изменении цен и правил</td><td>Не разбиралось</td></tr>\n<tr><td>Обходные пути</td><td>Полный перечень; наличие тетрадей и личных таблиц</td><td>Найдено три (см. ниже), целенаправленного поиска артефактов не проводилось</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Подсобные помещения, электрика, кондиционирование, безопасность; фотофиксация дефектов</td><td>Осмотр был визуальный, по клиентской зоне</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Слабая мобильная связь срывает безналичную выдачу</h4>\n<p>В помещении неустойчивый сигнал мобильной связи: СМС клиенту доходят не всегда, консультация по телефону затруднена. Прямое последствие наблюдалось в операции скупки: подтверждение номера телефона обязательно, потому что выдача по СБП идёт на этот номер, — клиент не смог назвать код и сослался на отсутствие связи. Способ выдачи пришлось менять на наличные, часть оформления — переигрывать. Приоритетный для компании безналичный расчёт при этом не состоялся.</p>\n<p>Проблема непостоянная: в операции займа код клиенту дошёл, подтверждение телефона и подписание ПЭП прошли штатно. Частоту недоставки нужно замерять отдельно — по одному случаю из четырёх выводов о масштабе не делаем.</p>\n<h4>2. По залогам перенесённого ОП не печатается чек, ошибка пропускается</h4>\n<p>В двух операциях из четырёх (выкуп за наличные и оплата процентов картой) клиент обслуживался по залогу, оформленному на ОП «Баландина», которое переехало на Транспортную. В обоих случаях при печати чека АРМ выдал ошибку — печать невозможна; товаровед пропустил действие и заранее предупредил клиента, что чек выдан быть не может «в связи с переездом ОП».</p>\n<p>То есть по расчётам с клиентом — и наличным, и безналичным — кассовый чек не выдавался, а обход стал устоявшейся практикой: сотрудник знает о проблеме и заранее её проговаривает. Требует проверки: техническая причина ошибки, охват (все ли залоги перенесённого ОП, все ли операции) и допустимость такого порядка с точки зрения кассовой дисциплины.</p>\n<h4>3. Тарифы и статусы лояльности приходится смотреть в бумажных приказах</h4>\n<p>Приклеенных к монитору шпаргалок нет, но со слов товароведа при редких пробах и при определении статуса лояльности приходится обращаться к распечатанным приказам — тарифным сеткам и бонусной программе. Это работа мимо системы в момент обслуживания клиента: подсказки по редкой пробе и по статусу лояльности в АРМ на месте оценки нет. Кандидат в реестр идей АРМ/CRM.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Пропускают ошибку печати чека и устно предупреждают клиента, что чека не будет</td><td>По залогам перенесённого ОП «Баландина» печать чека в АРМ завершается ошибкой</td><td>Клиент уходит без кассового чека; операция при этом проведена. Наблюдалось дважды за визит</td></tr>\n<tr><td>Меняют способ выдачи с карты (СБП) на наличные</td><td>Клиент не получает код подтверждения телефона из-за отсутствия связи</td><td>Возврат к пройденному шагу оформления; приоритетный безналичный расчёт не состоялся</td></tr>\n<tr><td>Сверяются с распечатанными приказами — тарифные сетки, бонусная программа</td><td>Редкие пробы и статусы лояльности не подсказываются в АРМ на месте оценки</td><td>Обращение к бумаге в присутствии клиента; риск ошибки при редкой пробе</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> описано три случая, все — по наблюдению и словам товароведа в ходе визита. Целенаправленного поиска тетрадей, личных таблиц и самодельных шаблонов (§7 чек-листа) не проводилось; перечень может быть неполным.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Скупка — смена способа выдачи после неудачного подтверждения телефона</td><td>Не замерено</td><td>Недоставка СМС-кода, возврат к выбору способа выдачи</td><td>Длительность ожидания кода и повторного оформления; частоту таких случаев за смену</td></tr>\n<tr><td>Оплата процентов — проверка результата переоткрытием документа залога</td><td>Не замерено</td><td>Статус оплаты проверяется вручную, повторным открытием документа</td><td>Сколько занимает проверка и как часто выполняется</td></tr>\n<tr><td>Выкуп и оплата процентов — попытка печати чека с ошибкой</td><td>Не замерено</td><td>Ошибка печати по залогам перенесённого ОП</td><td>Время на попытку печати и объяснение клиенту; число таких операций за смену</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> замеры времени в ходе визита не проводились. АРМ за время наблюдения не зависал, работа шла быстро — по субъективной оценке аналитика. Выводы о трудоёмкости операций на этом ОП пока не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Один факт зафиксирован как требующий проверки.</p>\n<table><thead><tr><th>Требование и источник</th><th>Что происходит фактически</th><th>Статус проверки</th></tr></thead><tbody>\n<tr><td>Порядок выдачи кассового чека при расчёте с клиентом — документ и пункт уточнить</td><td>По залогам перенесённого ОП «Баландина» чек не печатается: АРМ возвращает ошибку, действие пропускается, клиент предупреждается устно. Наблюдалось в двух операциях из четырёх</td><td>Требует проверки</td></tr>\n</tbody></table>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Насекомые (тараканы) в помещении отделения</td><td>Санитарная обработка — дезинсекция</td><td>Где именно замечены, насколько массово, когда проводилась последняя обработка и кем</td><td>Уточнить</td></tr>\n<tr><td>Устойчивость мобильной связи в помещении</td><td>Решение по связи — оснащение или организационное</td><td>Оператор и уровень сигнала, зоны отсутствия приёма, доходят ли СМС от других отправителей, есть ли проводной интернет и Wi-Fi для клиента</td><td>Уточнить</td></tr>\n</tbody></table>\n<p>Дефектов отделки, мебели, витрин, освещения и входной группы при визуальном осмотре не отмечено: помещение чистое, витрина и информационные стенды оформлены аккуратно.</p>\n<p><strong>Фотофиксация:</strong> Уточнить — делались ли фотографии.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> записи в блокноте по ходу визита.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Пустые бланки печатных форм (скупочная квитанция, договор, согласие на ПДн, спецификация) не забирались — уточнить, нужны ли в базу знаний.</p>\n<h3>Куда это идёт дальше</h3>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Четыре операции по шагам: скупка, займ на карту, выкуп, оплата процентов — фактура для карт процессов</td><td>Замеров времени и числа переключений</td><td>Предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Подсказка по редким пробам и статусу лояльности в АРМ на месте оценки — вместо бумажных приказов</td><td>Формулировка предложения, номер в реестре</td><td>Предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Описание операций на живых примерах: подтверждение телефона для СБП, подписание ПЭП, проверка статуса оплаты</td><td>Проверка формулировок по коду и справке АРМ</td><td>Предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Ошибка печати чека по залогам перенесённого ОП «Баландина» — техническая причина и охват</td><td>Текст ошибки, номер ОП «Баландина», сведения от ИТ</td><td>Предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Недоставка СМС клиентам на ОП-5 — влияние на СБП и ПЭП</td><td>Замер частоты, сведения по связи на отделении</td><td>Предложено</td></tr>\n<tr><td>Ответственный за помещение / оснащение</td><td>Дезинсекция помещения</td><td>Фото, описание мест</td><td>Предложено</td></tr>\n<tr><td>Задача в Битрикс</td><td>Ошибка печати чека — как срочная, ломающая работу (§11 чек-листа)</td><td>Кому адресовать</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Не принято.</p>\n<p><strong>Обоснование:</strong> основные клиентские операции ломбардного окна разобраны на живых примерах — повторного наблюдения по ним не требуется. Открытыми остались касса и смена (открытие, закрытие, инкассация), товарный блок (маркировка, хранение, инвентаризация), отчётность и коммуникации, а также работа комиссионного магазина техники и онлайн-площадок. Большую часть этого можно закрыть дистанционно — запросом у товароведа и супервайзера. Повторный выезд нужен, если потребуются замеры времени по операциям и наблюдение кассовых процедур в начале или в конце смены.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика.</li>\n<li>[ ] Дополнить время пребывания и продолжительность визита.</li>\n<li>[ ] Уточнить должность второго сотрудника (зона магазина техники).</li>\n<li>[x] Описать выполненные действия и способы изучения операций.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии.</li>\n<li>[ ] Указать собранные материалы или их отсутствие (образцы бланков).</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>08.09.2026</dd><dt>Аналитик</dt><dd>Пронин Артём Вадимович</dd><dt>Время приезда и отъезда</dt><dd>Уточнить</dd><dt>Продолжительность</dt><dd>Уточнить</dd><dt>С кем работали, должности</dt><dd>[товаровед], товаровед — работала в окне одна. В зоне комиссионного магазина техники — ещё один сотрудник (должность уточнить)</dd><dt>Супервайзер предупреждён</dt><dd>Да</dd><dt>Группа / дивизион</dt><dd>Группа «Север», Дивизион 1</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Слабая мобильная связь срывает безналичную выдачу</b><span>В помещении неустойчивый сигнал мобильной связи: СМС клиенту доходят не всегда, консультация по телефону затруднена. Прямое последствие наблюдалось в операции скупки: подтверждение номера телефона обязательно, потому…</span></li><li><b>По залогам перенесённого ОП не печатается чек, ошибка пропускается</b><span>В двух операциях из четырёх (выкуп за наличные и оплата процентов картой) клиент обслуживался по залогу, оформленному на ОП «Баландина», которое переехало на Транспортную. В обоих случаях при печати чека АРМ выдал…</span></li><li><b>Тарифы и статусы лояльности приходится смотреть в бумажных приказах</b><span>Приклеенных к монитору шпаргалок нет, но со слов товароведа при редких пробах и при определении статуса лояльности приходится обращаться к распечатанным приказам — тарифным сеткам и бонусной программе. Это работа мимо…</span></li></ol>\n<h2>Потери времени</h2><ul><li>Скупка — смена способа выдачи после неудачного подтверждения телефона</li><li>Оплата процентов — проверка результата переоткрытием документа залога</li><li>Выкуп и оплата процентов — попытка печати чека с ошибкой</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Насекомые (тараканы) в помещении отделения</li><li>Устойчивость мобильной связи в помещении</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>База знаний АРМ</li><li>Бэклог аналитиков / техническая поддержка</li><li>Бэклог аналитиков / техническая поддержка</li><li>Ответственный за помещение / оснащение</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: Не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}, {"date": "15.09.2026", "author": "Хазиев Тимур Ильнурович", "file": "Отчёт — 15.09.2026 — Хазиев Тимур Ильнурович — ОП-5.md", "title": "Отчёт об объезде ОП-5 «Транспортная»", "html": "<h2>Отчёт об объезде ОП-5 «Транспортная»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании краткой записи по итогам визита, переданной руководителем отдела бизнес-анализа Чусовитиной А.Э.: проведено тестирование, «транзитный выкуп работает, ссылка на ПЭП при выкупе не выходит». ОП посетили три проверяющих: Хазиев Т.И., Чусовитина А.Э. и Золотых С.В. Сценарии тестирования, число операций и то, проверяли ли на реальных договорах, в записи не указаны.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записи, переданной 17.09.2026; состав проверяющих — по уточнению того же дня. Реквизиты ОП — по таблице учёта объезда; визиты на ОП-5 15.09.2026 и 16.09.2026 в таблице пока не отмечены ни у одного из трёх проверяющих. Должность Хазиева Т.И. — по профилю в Битрикс24, Золотых С.В. — по её отчётам об объезде. Контекст — по материалам проекта «Вторая касса на ОП» в хранилище (протокол рабочей встречи 02.09.2026, ТЗ ред. 1.2 от 03.09.2026) и отчёту Пронина А.В. об объезде ОП-5 08.09.2026; связь тестирования с проектом установлена по смыслу, уточнить. Цитаты из записи приведены в кавычках.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-5 «Транспортная». По материалам проекта «Вторая касса на ОП», на Транспортной объединены ОП-5 и ОП-164 «Баландина»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Транспортная, д. 46/1</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Север», дивизион 1</td></tr>\n<tr><td>Дата визита</td><td>15.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович, Чусовитина Аделина Эриковна, Золотых Светлана Витальевна — визит втроём</td></tr>\n<tr><td>Должность аналитика</td><td>Хазиев Т.И. — заместитель директора цифрового развития по аналитике и проектам; Чусовитина А.Э. — руководитель отдела бизнес-анализа; Золотых С.В. — бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Абдеев А.Р.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Провели тестирование выкупа через транзитный платёж («транзитный выкуп») — втроём: Хазиев Т.И., Чусовитина А.Э., Золотых С.В.</li>\n<li>Зафиксировали результат: «транзитный выкуп работает».</li>\n<li>Зафиксировали дефект: «ссылка на ПЭП при выкупе не выходит».</li>\n</ol>\n<p>Какие сценарии проверяли — залог какого ОП, на каком окне, наличные или карта, печатался ли чек, — и кто из проверяющих что проверял, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Транзитный выкуп</td><td>Тестирование; сценарии и число операций не указаны</td><td>«Транзитный выкуп работает». По материалам проекта — полный выкуп залога другого ОП этой точки через транзитный платёж; какие договоры проверяли, уточнить</td></tr>\n<tr><td>Подписание ПЭП при выкупе</td><td>Тестирование</td><td>«Ссылка на ПЭП при выкупе не выходит». Только при транзитном выкупе или при любом выкупе, не указано</td></tr>\n</tbody></table>\n<h4>Транзитный выкуп: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> в записи не указаны. Ниже — порядок по материалам проекта «Вторая касса на ОП» с отметкой, что подтверждено тестированием.</p>\n<p><strong>Кто выполняет:</strong> тестирование провели Хазиев Т.И., Чусовитина А.Э. и Золотых С.В.; распределение ролей и участие товароведов не указаны. В работе операцию проводит товаровед окна, где клиент платит.</p>\n<p><strong>Где выполняет:</strong> АРМ — транзитный платёж, распределение платежей, документ выкупа; ККТ окна приёма оплаты; подписание ПЭП.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Транзитный платёж</td><td>По проекту: деньги принимает касса окна, где клиент платит; там же печатается чек</td><td>Печатался ли чек при тестировании, не указано. 08.09.2026 по залогам ОП «Баландина» чек на ОП-5 не печатался (отчёт Пронина А.В.)</td></tr>\n<tr><td>2. Распределение платежей</td><td>По проекту: автоматически переносит сумму на ОП, где оформлен залог, и гасит долг до нуля</td><td>Нет сведений</td></tr>\n<tr><td>3. Выкуп</td><td>По проекту: документ выкупа проводится «в ноль», залоговый билет получает статус «выкуплен». По записи — «транзитный выкуп работает»</td><td>Остаток долга и статус билета в записи не детализированы</td></tr>\n<tr><td>4. Подписание ПЭП</td><td>«Ссылка на ПЭП при выкупе не выходит»</td><td>Подписать документы выкупа по ссылке, вероятно, нельзя; как оформляют выкуп в этом случае, не указано</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> не замерено.</p>\n<p><strong>Время выполнения:</strong> не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> по проекту — три документа в одной транзакции и один чек в окне приёма оплаты; какие формы печатались при тестировании, не указано. Ссылка на ПЭП при выкупе не выходит.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Два окна в одном помещении, очередь, число клиентов</td><td>В записи не отражено; частично описано в отчёте Пронина А.В. от 08.09.2026</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>ККТ на окнах, доставка СМС клиентам</td><td>В записи не отражено. 08.09.2026 на ОП-5 отмечалась недоставка СМС (отчёт Пронина А.В.)</td></tr>\n<tr><td>Клиентские операции</td><td>Сценарии тестирования: договоры с процентами и без, перенесённые с ОП-164, оба направления, наличные и карта</td><td>Уточнить у проверяющих; перечень сценариев — в карточке «Справка по проекту — Вторая касса на ОП — оформление залогов», п. 3.2.3</td></tr>\n<tr><td>Касса, товар и документы</td><td>Печать чека при транзитном выкупе; остаток долга и статус билета после выкупа</td><td>Уточнить по номерам тестовых операций</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Кому передан результат тестирования</td><td>Уточнить</td></tr>\n<tr><td>Обходные пути</td><td>Как подписывают документы выкупа, если ссылка на ПЭП не выходит</td><td>Уточнить у товароведов</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения</td><td>В записи не отражено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Транзитный выкуп работает</h4>\n<p>По итогам тестирования на ОП-5 «транзитный выкуп работает». По материалам проекта «Вторая касса на ОП» это полный выкуп залога другого ОП этой точки через связку «транзитный платёж → распределение платежей → выкуп»; на встрече 02.09.2026 схему согласовали устно, и она ждала проверки.</p>\n<p>Сценарии, число проверенных операций, остаток долга и статус билета в записи не указаны. Для приёмки нужен протокол тестирования по сценариям проекта: договоры с процентами и без, перенесённые с ОП-164, оба направления; итог — нулевой долг, корректный статус, чек без повтора.</p>\n<h4>2. При выкупе не выходит ссылка на ПЭП</h4>\n<p>«Ссылка на ПЭП при выкупе не выходит». Только при транзитном выкупе или при любом выкупе и как в этом случае подписывают документы, в записи не указано.</p>\n<p>Похожий признак отмечен 14.09.2026 на ОП-15 «Гагарина»: при выкупе клиенту пришла только СМС с кодом, без ссылки на документ, а чек вышел до подписи ПЭП (отчёт Чусовитиной А.Э.). Раз это повторяется на двух ОП, дефект, вероятно, не местный. Нужны номера операций, чтобы техническая поддержка отличила ошибку формирования ссылки от недоставки СМС — на ОП-5 недоставка СМС отмечалась 08.09.2026.</p>\n<p>Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>В записи не отмечены. Как оформляют выкуп, когда ссылка на ПЭП не выходит, не указано; на ОП-15 в похожей ситуации переходили на бумажный договор (14.09.2026). 08.09.2026 на ОП-5 по залогам ОП «Баландина» пропускали ошибку печати чека и предупреждали клиента устно (отчёт Пронина А.В.); сохраняется ли это после доработки, не указано.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Выкуп без ссылки на ПЭП</td><td>Не замерено</td><td>Ссылка на ПЭП не выходит; способ подписания в этом случае не указан</td><td>Частоту случаев и время на обход</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился. Время транзитного выкупа в сравнении с обычным выкупом не замерялось.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Один факт требует проверки.</p>\n<table><thead><tr><th>Требование и источник</th><th>Что происходит фактически</th><th>Статус проверки</th></tr></thead><tbody>\n<tr><td>Порядок подписания документов выкупа ПЭП — документ и пункт уточнить</td><td>Ссылка на ПЭП при выкупе не выходит</td><td>Требует проверки</td></tr>\n</tbody></table>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении в записи не отмечены.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда. Контекст — материалы проекта «Вторая касса на ОП» в хранилище (раздел «1. Технические задания»): протокол рабочей встречи 02.09.2026 и карточки ТЗ; отчёт Пронина А.В. об объезде ОП-5 08.09.2026.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Для технической поддержки нужны номера и даты тестовых операций выкупа, экран шага подписания ПЭП и чек.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Все действия пока только предложены; задачи не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Не выходит ссылка на ПЭП при выкупе — ОП-5 (15.09.2026); похожий случай — ОП-15 (14.09.2026)</td><td>Номеров операций, экранов; касается ли это обычного выкупа</td><td>Предложено; в первую очередь</td></tr>\n<tr><td>Проект «Вторая касса на ОП»</td><td>Результат тестирования: транзитный выкуп работает; дефект ПЭП</td><td>Протокола тестирования по сценариям проекта</td><td>Предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Инструкция по транзитному выкупу на ОП-5</td><td>Подтверждённого порядка — см. беседу с товароведами 16.09.2026</td><td>Предложено</td></tr>\n<tr><td>Задача в Битрикс</td><td>Дефект: ссылка на ПЭП при выкупе не выходит</td><td>Номеров операций, адресата</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> 16.09.2026 проверяющие снова были на ОП-5 и провели беседу с товароведами о порядке транзитного выкупа (отдельный отчёт). Дефект ПЭП разбирается дистанционно — по номерам операций в АРМ. Повторное тестирование на ОП нужно после исправления ссылки на ПЭП.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-5 «Транспортная», 15.09.2026; проверяющие — Хазиев Тимур Ильнурович (заместитель директора цифрового развития по аналитике и проектам), Чусовитина Аделина Эриковна (руководитель отдела бизнес-анализа), Золотых Светлана Витальевна (бизнес-аналитик).</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: сценарии тестирования, число операций, реальные или тестовые договоры, кто из проверяющих что проверял.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — в записи не отмечены; уточнить, осматривали ли помещение.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта — визит 15.09.2026 в таблице пока не отмечен ни у одного из трёх проверяющих.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>15.09.2026</dd><dt>Аналитик</dt><dd>Хазиев Тимур Ильнурович, Чусовитина Аделина Эриковна, Золотых Светлана Витальевна — визит втроём</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Продолжительность</dt><dd>Не указано</dd><dt>С кем работали, должности</dt><dd>Не указано</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений; супервайзер ОП — Абдеев А.Р.</dd><dt>Группа / дивизион</dt><dd>Группа «Север», дивизион 1</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Транзитный выкуп работает</b><span>По итогам тестирования на ОП-5 «транзитный выкуп работает». По материалам проекта «Вторая касса на ОП» это полный выкуп залога другого ОП этой точки через связку «транзитный платёж → распределение платежей → выкуп»; на…</span></li><li><b>При выкупе не выходит ссылка на ПЭП</b><span>«Ссылка на ПЭП при выкупе не выходит». Только при транзитном выкупе или при любом выкупе и как в этом случае подписывают документы, в записи не указано.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Выкуп без ссылки на ПЭП</li></ul>\n<h2>Куда передать</h2><ul><li>Бэклог аналитиков / техническая поддержка</li><li>Проект «Вторая касса на ОП»</li><li>База знаний АРМ</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}, {"date": "16.09.2026", "author": "Хазиев Тимур Ильнурович", "file": "Отчёт — 16.09.2026 — Хазиев Тимур Ильнурович — ОП-5.md", "title": "Отчёт об объезде ОП-5 «Транспортная»", "html": "<h2>Отчёт об объезде ОП-5 «Транспортная»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании краткой записи по итогам визита, переданной руководителем отдела бизнес-анализа Чусовитиной А.Э.: проведена беседа с товароведами о том, как правильно проводить транзитный выкуп между ОП «Транспортная» и ОП «Баландина». ОП посетили три проверяющих: Хазиев Т.И., Чусовитина А.Э. и Золотых С.В. Какой порядок разъяснили, сколько было товароведов и какие вопросы возникли, в записи не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записи, переданной 17.09.2026; состав проверяющих — по уточнению того же дня. Реквизиты ОП — по таблице учёта объезда; визит 16.09.2026 в таблице пока не отмечен ни у одного из трёх проверяющих. Должность Хазиева Т.И. — по профилю в Битрикс24, Золотых С.В. — по её отчётам об объезде. ОП «Баландина» — ОП-164, объединённое с ОП-5 на Транспортной; по ТЗ проекта «Вторая касса на ОП» (ред. 1.2 от 03.09.2026) его открытые договоры переносятся на создаваемое ОП-5/1 «Транспортная». Какая конфигурация действовала 16.09.2026, уточнить. Порядок транзитного выкупа в отчёте — по материалам проекта, а не по записи беседы.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-5 «Транспортная»; беседа — о транзитном выкупе между ОП-5 и ОП-164 «Баландина»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Транспортная, д. 46/1</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Север», дивизион 1</td></tr>\n<tr><td>Дата визита</td><td>16.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович, Чусовитина Аделина Эриковна, Золотых Светлана Витальевна — визит втроём</td></tr>\n<tr><td>Должность аналитика</td><td>Хазиев Т.И. — заместитель директора цифрового развития по аналитике и проектам; Чусовитина А.Э. — руководитель отдела бизнес-анализа; Золотых С.В. — бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Товароведы ОП-5; число и ФИО не указаны</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Абдеев А.Р.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Провели беседу с товароведами о том, как правильно проводить транзитный выкуп между ОП «Транспортная» и ОП «Баландина», — втроём: Хазиев Т.И., Чусовитина А.Э., Золотых С.В.</li>\n</ol>\n<p>Беседа прошла на следующий день после тестирования 15.09.2026 (тот же состав проверяющих), по итогам которого «транзитный выкуп работает», а «ссылка на ПЭП при выкупе не выходит» (отдельный отчёт). Кто вёл беседу, показывали ли порядок в АРМ на реальной операции и обсуждали ли дефект ПЭП, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Транзитный выкуп между ОП-5 и ОП-164 «Баландина»</td><td>Беседа с товароведами</td><td>Обсудили правильный порядок проведения. Сам порядок, вопросы и ошибки товароведов в записи не приведены</td></tr>\n</tbody></table>\n<h4>Транзитный выкуп: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от обращения клиента с залогом ОП «Баландина» или ОП «Транспортная» до выкупа. Порядок, который разъяснили товароведам, в записи не приведён; ниже — порядок по материалам проекта «Вторая касса на ОП», его нужно сверить с содержанием беседы.</p>\n<p><strong>Кто выполняет:</strong> товароведы на окнах точки; беседу провели проверяющие — Хазиев Т.И., Чусовитина А.Э., Золотых С.В.; кто её вёл, не указано.</p>\n<p><strong>Где выполняет:</strong> АРМ — транзитный платёж, распределение платежей, документ выкупа; ККТ окна приёма оплаты; подписание ПЭП.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. ОП залога</td><td>Если залог оформлен на ОП окна, где обслуживают клиента, — обычный выкуп без транзита; если на другом ОП этой точки — выкуп через транзитный платёж</td><td>Как товароведы определяют ОП залога, не указано</td></tr>\n<tr><td>2. Транзитный платёж</td><td>Деньги принимает касса окна, где клиент платит; там же печатается чек</td><td>08.09.2026 по залогам ОП «Баландина» чек не печатался (отчёт Пронина А.В.); устранено ли, уточнить</td></tr>\n<tr><td>3. Распределение и выкуп</td><td>Автоматически: сумма переносится на ОП залога, долг гасится до нуля, документ выкупа проводится, билет получает статус «выкуплен»</td><td>Нет сведений</td></tr>\n<tr><td>4. Подписание ПЭП</td><td>По итогам тестирования 15.09.2026 ссылка на ПЭП при выкупе не выходит</td><td>Как подписывать документы выкупа до исправления, не указано</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> не замерено.</p>\n<p><strong>Время выполнения:</strong> не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> по проекту — три документа в одной транзакции и один чек в окне приёма оплаты; какие формы обсуждали с товароведами, не указано.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Клиентские операции</td><td>Какие ошибки товароведы допускали при транзитном выкупе до беседы; показывали ли порядок на реальной операции</td><td>Уточнить у проверяющих</td></tr>\n<tr><td>Касса, товар и документы</td><td>Печать чека при транзитном выкупе; подписание документов, пока ссылка на ПЭП не выходит; перенос договоров ОП-164</td><td>Уточнить у проверяющих и в проекте «Вторая касса на ОП»</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Закреплён ли порядок письменно, получили ли товароведы инструкцию</td><td>Уточнить</td></tr>\n<tr><td>Обходные пути</td><td>Как выкупали залоги ОП «Баландина» до доработки</td><td>Уточнить у товароведов</td></tr>\n<tr><td>Помещение, рабочее место, ремонт</td><td>Осмотр помещения, техника, фотографии</td><td>В записи не отражено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Товароведам разъяснили порядок транзитного выкупа</h4>\n<p>Проведена беседа с товароведами о том, как правильно проводить транзитный выкуп между ОП «Транспортная» и ОП «Баландина». Сам порядок, число товароведов и их вопросы в записи не приведены.</p>\n<p>Беседа прошла на следующий день после тестирования 15.09.2026, по итогам которого транзитный выкуп работает. Итоги беседы — какие вопросы задали, где ошибались — пригодятся проекту «Вторая касса на ОП» и базе знаний.</p>\n<h4>2. Порядок нужно закрепить письменно</h4>\n<p>Письменная инструкция в записи не упомянута. В порядке несколько условий: выбор между обычным и транзитным выкупом по ОП залога, чек в окне приёма оплаты, автоматическое распределение; при этом ссылка на ПЭП при выкупе пока не выходит.</p>\n<p>Чтобы порядок не держался на устной беседе, его стоит оформить в базе знаний АРМ после сверки с ТЗ проекта. Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>В записи не отмечены. Как товароведы выкупали залоги ОП «Баландина» до доработки, не указано; 08.09.2026 на ОП-5 по таким залогам пропускали ошибку печати чека и предупреждали клиента устно (отчёт Пронина А.В.).</p>\n<h3>Потери времени</h3>\n<p>Не замерялись.</p>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился. Для оценки нужен замер времени транзитного выкупа в сравнении с обычным выкупом.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Порядок, разъяснённый товароведам, стоит сверить с ТЗ проекта «Вторая касса на ОП» (ред. 1.2 от 03.09.2026) и с порядком подписания документов ПЭП.</p>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении в записи не отмечены.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда. Контекст — материалы проекта «Вторая касса на ОП» в хранилище (раздел «1. Технические задания»), отчёт о тестировании на ОП-5 15.09.2026, отчёт Пронина А.В. об объезде ОП-5 08.09.2026.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Для инструкции пригодятся тезисы беседы и экраны транзитного выкупа в АРМ.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Все действия пока только предложены; задачи не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>База знаний АРМ</td><td>Инструкция: транзитный выкуп на ОП-5 — как определить ОП залога, какой выкуп выбрать, где печатается чек, как подписать ПЭП</td><td>Тезисов беседы, экранов АРМ, сверки с ТЗ проекта</td><td>Предложено</td></tr>\n<tr><td>Проект «Вторая касса на ОП»</td><td>Итоги беседы: вопросы и ошибки товароведов при транзитном выкупе</td><td>Записи вопросов товароведов</td><td>Предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Ссылка на ПЭП при выкупе не выходит — см. отчёт о тестировании 15.09.2026</td><td>Номеров операций</td><td>Предложено</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> разъяснённый порядок и вопросы товароведов можно записать дистанционно со слов проверяющих. Проверить, как товароведы применяют порядок, стоит после исправления ссылки на ПЭП — на реальной операции транзитного выкупа.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-5 «Транспортная», 16.09.2026; проверяющие — Хазиев Тимур Ильнурович (заместитель директора цифрового развития по аналитике и проектам), Чусовитина Аделина Эриковна (руководитель отдела бизнес-анализа), Золотых Светлана Витальевна (бизнес-аналитик).</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить число товароведов на беседе и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия: кто вёл беседу, какой порядок разъяснили, какие вопросы задали товароведы.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — в записи не отмечены.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта — визит 16.09.2026 в таблице пока не отмечен ни у одного из трёх проверяющих.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>16.09.2026</dd><dt>Аналитик</dt><dd>Хазиев Тимур Ильнурович, Чусовитина Аделина Эриковна, Золотых Светлана Витальевна — визит втроём</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Продолжительность</dt><dd>Не указано</dd><dt>С кем работали, должности</dt><dd>Товароведы ОП-5; число и ФИО не указаны</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений; супервайзер ОП — Абдеев А.Р.</dd><dt>Группа / дивизион</dt><dd>Группа «Север», дивизион 1</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Товароведам разъяснили порядок транзитного выкупа</b><span>Проведена беседа с товароведами о том, как правильно проводить транзитный выкуп между ОП «Транспортная» и ОП «Баландина». Сам порядок, число товароведов и их вопросы в записи не приведены.</span></li><li><b>Порядок нужно закрепить письменно</b><span>Письменная инструкция в записи не упомянута. В порядке несколько условий: выбор между обычным и транзитным выкупом по ОП залога, чек в окне приёма оплаты, автоматическое распределение; при этом ссылка на ПЭП при выкупе…</span></li></ol>\n<h2>Куда передать</h2><ul><li>База знаний АРМ</li><li>Проект «Вторая касса на ОП»</li><li>Бэклог аналитиков / техническая поддержка</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-64", "num": "64", "name": "Ферина", "addr": "г. Уфа, ул. Ферина, д. 8", "g": "Север", "sup": "Абдеев А.Р", "area": "Уфа — Инорс", "d": "1", "lat": 54.7845506, "lon": 56.1305065, "tv": [], "st": "", "flags": ["КМТ"], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Золотых Светлана Витальевна", "date": "08.09.2026"}], "reports": [{"date": "08.09.2026", "author": "Золотых Светлана Витальевна", "file": "Отчёт — 08.09.2026 — Золотых Светлана Витальевна — ОП-64.md", "title": "Отчёт об объезде ОП-64", "html": "<h2>Отчёт об объезде ОП-64</h2>\n<p>Дата подготовки: <strong>08.09.2026</strong>.</p>\n<p>Отчёт подготовлен по результатам визита на ОП на основании беседы с товароведом, наблюдения за обзвоном клиентов и осмотра помещения.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-64</td></tr>\n<tr><td>Адрес</td><td>ул. Феррина, 8</td></tr>\n<tr><td>Группа / дивизион</td><td>Ломбард, КМТ</td></tr>\n<tr><td>Дата визита</td><td>08.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Золотых Светлана Витальевна</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>с 15:45 до 16:33</td></tr>\n<tr><td>Продолжительность</td><td>48 минут</td></tr>\n<tr><td>С кем работали, должности</td><td>Товаровед</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Проведена беседа с товароведом о текущих рабочих процессах.</li>\n<li>Наблюдали процесс обзвона клиентов.</li>\n<li>Обсудили используемые сотрудниками системы и внешние инструменты: АРМ, Битрикс, Excel / Google Таблицы, программу «Печать ценников», Авито.</li>\n<li>Зафиксировали проблемы со связью и получением клиентами СМС для подтверждения операций.</li>\n<li>Обсудили проблемы КМТ, связанные с ПЭП, пополнением, помещением и организацией рабочего пространства.</li>\n<li>Сделаны фотографии общего вида ОП.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Обзвон клиентов</td><td>Наблюдение и беседа</td><td>Обзвон ведётся по отдельной таблице. После звонка сотрудник вручную отмечает факт дозвона или недозвона. Автоматическое обновление отсутствует. В АРМ процесс обзвона не настроен. Товаровед оценивает процесс как длительный.</td></tr>\n<tr><td>Учёт агрегатов по другим металлам</td><td>Беседа</td><td>Передача агрегатов фиксируется под роспись в бумажной тетради. Наличие дополнительного учёта в информационных системах не уточнено.</td></tr>\n<tr><td>График смен</td><td>Демонстрация сотрудником</td><td>В КМТ график смен ведётся в Google Таблице.</td></tr>\n<tr><td>Расчёт заработной платы</td><td>Демонстрация сотрудником</td><td>Расчёт ведётся в Google Таблице. По словам сотрудника, текущий расчёт не работает. Причина не уточнялась.</td></tr>\n<tr><td>Печать ценников</td><td>Беседа</td><td>КМТ использует внутреннюю программу «Печать ценников», разработанную коллегами компании.</td></tr>\n<tr><td>Авито</td><td>Беседа</td><td>Используется КМТ для размещения объявлений, продажи техники и ориентировочной оценки рыночной стоимости товара при скупке.</td></tr>\n<tr><td>Связь и подтверждение операций</td><td>Беседа</td><td>По словам товароведов, сейчас наблюдается постоянная проблема со связью: клиентам не приходят СМС для подтверждения регистрации или операций, в том числе по акции Trade-In. В техническую поддержку уже обращались. Проблема продолжается второй день.</td></tr>\n<tr><td>ПЭП</td><td>Беседа</td><td>По словам товароведов, ПЭП часто зависает. В текущей ситуации проблема длится второй день. Клиенты КМТ из-за ожидания могут уходить, в ломбарде клиентам приходится долго ждать.</td></tr>\n<tr><td>Пополнение КМТ</td><td>Беседа</td><td>Товаровед сообщил о проблеме с накладными на пополнение: они попадают не туда, где их ожидает КМТ, после чего с ними неудобно работать при создании заявки. Точная механика проблемы требует дополнительного уточнения.</td></tr>\n<tr><td>Состояние помещения</td><td>Осмотр и беседа</td><td>На стороне КМТ есть щель, из-за которой в холодную погоду сильно дует. Сотрудники также просят освежить ремонт. На стороне ломбарда не хватает стеллажей для техники, из-за чего пространство захламлено.</td></tr>\n</tbody></table>\n<h4>Обзвон клиентов: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от открытия отдельной таблицы с клиентами до ручной фиксации результата звонка.</p>\n<p><strong>Кто выполняет:</strong> товаровед.</p>\n<p><strong>Где выполняет:</strong> отдельная таблица; звонок клиенту; АРМ в текущем процессе обзвона не задействован как основной инструмент.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Поиск клиента</td><td>Товаровед работает со списком клиентов в отдельной таблице</td><td>Таблица не обновляется автоматически</td></tr>\n<tr><td>2. Звонок</td><td>Товаровед совершает звонок клиенту</td><td>Возможен недозвон</td></tr>\n<tr><td>3. Фиксация результата</td><td>Вручную отмечается дозвон или недозвон</td><td>Результат нужно вносить вручную</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> результат обзвона вручную фиксируется в отдельной таблице. Возможность автоматической синхронизации с АРМ отсутствует или не настроена.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Клиентский поток, очередь, обслуживание реального клиента</td><td>Во время визита клиентов не было</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Детально проверить скорость систем, оборудование и причины сбоев</td><td>Проводилась беседа, техническая диагностика не выполнялась</td></tr>\n<tr><td>Клиентские операции</td><td>Основные клиентские процессы</td><td>Во время визита клиентов не было</td></tr>\n<tr><td>Касса, товар и документы</td><td>Полный цикл кассовых и товарных операций</td><td>Не наблюдались в реальной работе</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Полный перечень отчётов, сроки и трудозатраты</td><td>Не успели подробно разобрать</td></tr>\n<tr><td>Обходные пути</td><td>Полный перечень ручных операций</td><td>Зафиксированы только озвученные сотрудником случаи</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Детальная фиксация дефектов и размеров</td><td>Сделано только общее фото ОП</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Часть рабочих процессов вынесена за пределы АРМ</h4>\n<p>Обзвон клиентов ведётся в отдельной таблице и требует ручной фиксации результата. Также вне АРМ используются Google Таблицы для графика смен и расчёта зарплаты, бумажная тетрадь для фиксации передачи агрегатов, Авито для продаж и оценки рыночной стоимости техники.</p>\n<p>Это увеличивает количество переключений между инструментами и создаёт зависимость от ручного ввода данных.</p>\n<h4>2. Проблемы со связью и ПЭП непосредственно влияют на обслуживание клиентов</h4>\n<p>По словам товароведов, в течение двух дней клиентам не приходят СМС для подтверждения операций, а ПЭП зависает. В техническую поддержку уже направлено обращение.</p>\n<p>Последствия уже проявляются в клиентском опыте: в КМТ часть клиентов уходит из-за ожидания, в ломбарде обслуживание занимает больше времени.</p>\n<h4>3. Есть проблемы с помещением и организацией хранения</h4>\n<p>На стороне КМТ требуется устранить щель, из-за которой в холодную погоду сильно дует, а также освежить ремонт. На стороне ломбарда не хватает стеллажей для техники, из-за чего рабочая зона захламлена.</p>\n<p>Проблемы требуют передачи ответственному за помещение и оснащение.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Ведут обзвон в отдельной таблице</td><td>В АРМ обзвон не настроен</td><td>Ручная фиксация результата, дополнительные переключения</td></tr>\n<tr><td>Отмечают дозвон / недозвон вручную</td><td>Нет автоматического обновления</td><td>Дополнительные трудозатраты и риск неактуальных данных</td></tr>\n<tr><td>Ведут учёт агрегатов в бумажной тетради</td><td>Причина не уточнена</td><td>Бумажный учёт и зависимость от ручной фиксации</td></tr>\n<tr><td>Используют Google Таблицы для графика смен</td><td>Процесс не централизован в одной системе</td><td>Работа распределена между несколькими инструментами</td></tr>\n<tr><td>Используют Google Таблицу для расчёта зарплаты</td><td>Другой рабочий механизм не уточнён</td><td>Текущий расчёт, по словам сотрудника, не работает</td></tr>\n<tr><td>Используют Авито</td><td>Продажа техники и оценка средней рыночной цены при скупке</td><td>Зависимость от внешнего сервиса; одновременно это полезный рабочий инструмент</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> описаны только случаи, которые были показаны или озвучены товароведом во время визита. Полный перечень обходных путей не установлен.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Обзвон клиентов</td><td>Не замерено</td><td>Отдельная таблица и ручная фиксация результата</td><td>Время на одного клиента, число звонков за смену, долю недозвонов, время на внесение результата</td></tr>\n<tr><td>Операции с ПЭП</td><td>Не замерено</td><td>Зависания ПЭП</td><td>Время ожидания, частоту зависаний, число повторных попыток</td></tr>\n<tr><td>Подтверждение по СМС</td><td>Не замерено</td><td>СМС клиентам не приходят</td><td>Среднее время ожидания, число неуспешных подтверждений</td></tr>\n<tr><td>Работа с накладными КМТ</td><td>Не замерено</td><td>Точная причина требует уточнения</td><td>Путь накладной, число ручных действий и время на поиск / обработку</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> замеры времени во время визита не проводились. Вывод о фактических трудозатратах и частоте проблем пока сделать нельзя.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Щель на стороне КМТ</td><td>Ремонт</td><td>Точное расположение, размеры и способ устранения</td><td>Общее фото ОП</td></tr>\n<tr><td>Помещение ОП</td><td>Ремонт</td><td>Объём необходимого косметического ремонта</td><td>Общее фото ОП</td></tr>\n<tr><td>Сторона ломбарда</td><td>Дополнительное оснащение</td><td>Количество, размеры и расположение стеллажей для техники</td><td>Общее фото ОП</td></tr>\n</tbody></table>\n<p><strong>Фотофиксация:</strong> сделано фото общего вида ОП. Детальные фотографии отдельных дефектов не указаны.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> настоящий отчёт и заметки по итогам беседы.</p>\n<p><strong>Полученные на ОП образцы:</strong> фото общего вида ОП. Другие материалы не указаны.</p>\n<h3>Куда это идёт дальше</h3>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Ответственный за помещение / оснащение</td><td>Щель на стороне КМТ, необходимость освежить ремонт, потребность в стеллажах для ломбарда</td><td>Желательны детальные фото, размеры и количество стеллажей</td><td>Уточнить</td></tr>\n<tr><td>Отчёт об объезде</td><td>Проблемы с обзвоном, связью, ПЭП, ручными инструментами и организацией работы</td><td>Часть деталей требует проверки</td><td>Зафиксировано</td></tr>\n<tr><td>Техническая поддержка</td><td>Проблема ПЭП и доставки СМС</td><td>Обращение уже создано сотрудниками</td><td>В работе со слов товароведов</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Нет.</p>\n<p><strong>Обоснование:</strong> повторный визит на текущем этапе не планируется. При необходимости детали по отдельным процессам можно уточнить дистанционно. Основные клиентские процессы во время текущего визита не наблюдались из-за отсутствия клиентов.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика.</li>\n<li>[x] Дополнить адрес, группу / дивизион и время пребывания.</li>\n<li>[x] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[x] Описать выполненные действия и способы изучения операций.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать отсутствие замеров времени.</li>\n<li>[ ] Приложить или указать ссылку на фото общего вида ОП.</li>\n<li>[ ] При необходимости уточнить механизм попадания накладных на пополнение КМТ.</li>\n<li>[ ] При необходимости уточнить причину неработающего расчёта зарплаты в Google Таблице.</li>\n<li>[ ] При необходимости уточнить, существует ли дополнительный электронный учёт агрегатов.</li>\n<li>[ ] Уточнить ответственного за ремонт и оснащение.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>08.09.2026</dd><dt>Аналитик</dt><dd>Золотых Светлана Витальевна</dd><dt>Время приезда и отъезда</dt><dd>с 15:45 до 16:33</dd><dt>Продолжительность</dt><dd>48 минут</dd><dt>С кем работали, должности</dt><dd>Товаровед</dd><dt>Супервайзер предупреждён</dt><dd>Да</dd><dt>Группа / дивизион</dt><dd>Ломбард, КМТ</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Часть рабочих процессов вынесена за пределы АРМ</b><span>Обзвон клиентов ведётся в отдельной таблице и требует ручной фиксации результата. Также вне АРМ используются Google Таблицы для графика смен и расчёта зарплаты, бумажная тетрадь для фиксации передачи агрегатов, Авито…</span></li><li><b>Проблемы со связью и ПЭП непосредственно влияют на обслуживание клиентов</b><span>По словам товароведов, в течение двух дней клиентам не приходят СМС для подтверждения операций, а ПЭП зависает. В техническую поддержку уже направлено обращение.</span></li><li><b>Есть проблемы с помещением и организацией хранения</b><span>На стороне КМТ требуется устранить щель, из-за которой в холодную погоду сильно дует, а также освежить ремонт. На стороне ломбарда не хватает стеллажей для техники, из-за чего рабочая зона захламлена.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Обзвон клиентов</li><li>Операции с ПЭП</li><li>Подтверждение по СМС</li><li>Работа с накладными КМТ</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Щель на стороне КМТ</li><li>Помещение ОП</li><li>Сторона ломбарда</li></ul>\n<h2>Куда передать</h2><ul><li>Ответственный за помещение / оснащение</li><li>Отчёт об объезде</li><li>Техническая поддержка</li></ul>\n<h2>Повторный визит</h2><p>Решение: Нет.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 6 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-169", "num": "169", "name": "Детская Библиотека", "addr": "г. Уфа, ул. Первомайская, д. 26.", "g": "Север", "sup": "Абдеев А.Р", "area": "Уфа — Черниковка", "d": "2", "lat": 54.8171163, "lon": 56.0755031, "tv": [], "st": "", "flags": ["КМЗ"], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Абдуллин Венер Фаритович", "date": "07.09.2026"}], "reports": [{"date": "07.09.2026", "author": "Абдуллин Векнер Фаритович", "file": "Отчет_объезд_ОП_по_методике.md", "title": "Отчёт об объезде ОП 169 «Детская библиотека»", "html": "<h2>Отчёт об объезде ОП 169 «Детская библиотека»</h2>\n<p>Дата подготовки: <strong>08.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП, версия 1.0 от 07.09.2026. ФИО, отделение, дата и примерная продолжительность визита указаны аналитиком. Адрес, группа ОП и фотографии требуют дополнения.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>169 «Детская библиотека»</td></tr>\n<tr><td>Адрес</td><td>Уточнить</td></tr>\n<tr><td>Группа / дивизион</td><td>Уточнить</td></tr>\n<tr><td>Дата визита</td><td>07.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Абдуллин Векнер Фаритович</td></tr>\n<tr><td>Время приезда и отъезда</td><td>С 17:00 примерно до 17:40</td></tr>\n<tr><td>Продолжительность</td><td>Около 40 минут, по оценке аналитика</td></tr>\n<tr><td>С кем работал, должности</td><td>Сотрудник, оформляющий скупку и залоговые операции; официальную должность и состав смены уточнить</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Уточнить</td></tr>\n</tbody></table>\n<h3>Что делал на ОП</h3>\n<ol>\n<li>Изучил вопросы по входу: ступеньки, поручень, крепление резинок и понятность навигации.</li>\n<li>Разобрал обращение по вычету после переоформления изделия. Основание и расчёт вычета требуют проверки по документам.</li>\n<li>Посмотрел порядок открытия смен в АРМ и кассе, связь с явкой в табеле и доступность действий с табелем.</li>\n<li>Разобрал повторное оформление скупки после неудачной выплаты на карту, заполнение изделий и выбор источника обращения клиента.</li>\n<li>Проверил рабочие сценарии ИИ-помощника: вопрос по скупке и поиск правил мотивации.</li>\n<li>Изучил затруднения с проверкой начислений и пониманием оплаты дополнительных смен.</li>\n<li>Разобрал размещение вещей и техники, последствия затопления и обслуживание в обеденное время.</li>\n<li>Проследил оформление одной клиентской операции с выплатой на карту: документы, подтве
