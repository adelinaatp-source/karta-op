езда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании краткой записи по итогам визита, переданной руководителем отдела бизнес-анализа Чусовитиной А.Э.: «на гимназии ничего интересного». Какие операции разбирали и как получены сведения, в записи не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записи, переданной 17.09.2026. Адрес, группа, дивизион и супервайзер ОП — по таблице учёта объезда; визит 17.09.2026 в таблице пока не отмечен. Должность аналитика — по профилю в Битрикс24. В тот же день Хазиев Т.И. посетил также ОП-39, ОП-14 и ОП-162 (отдельные отчёты). «Не указано» — это отсутствие сведений, а не отсутствие операции на ОП.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-161 «Гимназия»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, пр. Октября, д. 23/2</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Центр», дивизион 4</td></tr>\n<tr><td>Дата визита</td><td>17.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович</td></tr>\n<tr><td>Должность аналитика</td><td>Заместитель директора цифрового развития по аналитике и проектам</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Напалкова В.Е.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Посетили ОП-161 «Гимназия» в рамках объезда.</li>\n<li>Примечательного не зафиксировали: «на гимназии ничего интересного».</li>\n</ol>\n<p>Какие операции смотрели и с кем беседовали, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Работа ОП в целом</td><td>Не указано</td><td>«Ничего интересного». Какие операции и участки смотрели, не указано</td></tr>\n</tbody></table>\n<p>Отдельная операция в записи не разобрана: последовательность работы, число действий, время и документы не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает, что операции на ОП нет или что её не смотрели.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Вход, рабочие места, очередь, число клиентов</td><td>В записи не отражено; дополнить со слов Хазиева Т.И.</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, оборудование, скорость АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Залог, выкуп, продление, скупка, продажа</td><td>В записи не отражено</td></tr>\n<tr><td>Касса, товар и документы</td><td>Смена, оплата, хранение, учёт, печатные формы</td><td>В записи не отражено</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Получатели, сроки, каналы</td><td>В записи не отражено</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения, фотографии</td><td>В записи не отражено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Ничего примечательного не выявлено</h4>\n<p>По записи, «на гимназии ничего интересного»: замечаний, проблем и предложений за время визита не зафиксировано. Какие операции и участки смотрели, не указано, поэтому вывод относится к тому, что удалось увидеть и обсудить.</p>\n<p>Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>Не отмечены. Целенаправленный поиск тетрадей, таблиц и работы вне АРМ в записи не отражён, поэтому вывод об их отсутствии не делается.</p>\n<h3>Потери времени</h3>\n<p>Потери времени не отмечены, замеры не проводились.</p>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении в записи не отмечены. Осматривали ли помещение, не указано.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Замечаний, предложений и потребностей по ОП-161 не зафиксировано — передавать пока нечего. Задачи не создавались.</p>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято; по записи оснований для повторного визита нет.</p>\n<p><strong>Обоснование:</strong> примечательного не выявлено. Время визита и перечень обсуждённых операций можно дописать дистанционно со слов Хазиева Т.И.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-161 «Гимназия», 17.09.2026, Хазиев Тимур Ильнурович, заместитель директора цифрового развития по аналитике и проектам.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: какие операции смотрели, с кем говорили.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — в записи не отмечены; уточнить, осматривали ли помещение.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта — визит 17.09.2026 в таблице пока не отмечен.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>17.09.2026</dd><dt>Аналитик</dt><dd>Хазиев Тимур Ильнурович</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Продолжительность</dt><dd>Не указано</dd><dt>С кем работали, должности</dt><dd>Не указано</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений; супервайзер ОП — Напалкова В.Е.</dd><dt>Группа / дивизион</dt><dd>Группа «Центр», дивизион 4</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Ничего примечательного не выявлено</b><span>По записи, «на гимназии ничего интересного»: замечаний, проблем и предложений за время визита не зафиксировано. Какие операции и участки смотрели, не указано, поэтому вывод относится к тому, что удалось увидеть и…</span></li></ol>\n<h2>Повторный визит</h2><p>Решение: не принято; по записи оснований для повторного визита нет.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-39", "num": "39", "name": "Галле", "addr": "г. Уфа, пр. Октября, д. 18/1", "g": "Центр", "sup": "Напалкова В.Е.", "area": "Уфа — пр. Октября", "d": "4", "lat": 54.7462844, "lon": 55.9944819, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Абдуллин Венер Фаритович", "date": "15.09.2026", "src": "отчёт"}, {"by": "Хазиев Тимур Ильнурович", "date": "17.09.2026", "src": "отчёт"}], "reports": [{"date": "15.09.2026", "author": "Абдуллин Венер Фаритович", "file": "Отчёт — объезд ОП 039-Галле (15.09.2026).md", "title": "Отчёт об объезде ОП — 039-Галле (15.09.2026)", "html": "<h2>Отчёт об объезде ОП — 039-Галле (15.09.2026)</h2>\n<p>&gt; [!abstract] Кратко &gt; Короткий визит (40 минут), формат — разговор с товароведом на рабочем месте плюс осмотр помещения. Клиентов в зале за время визита не было, ни одна операция «вживую» не наблюдалась, поэтому §5 методички (прогон по операциям) закрыт только со слов сотрудника. Основной улов визита — <strong>последствия субботнего ремонта</strong> (снесён шкаф для верхней одежды, не установлен обещанный стеллаж, брызги краски, снятые жалюзи), <strong>проблема видимости точки</strong> (порван выносной флаг, вывеску закрывает лестница) и <strong>точечные узкие места в оформлении</strong>: печать трёх экземпляров договора со спецификацией, ожидание СМС по ПЭП, ограничение по количеству изделий в бумажном договоре, немаркированные кабели на месте проверки техники.</p>\n<p>&gt; [!note] Соблюдение красных линий &gt; Персональные данные клиентов не фотографировались и не выписывались. Обслуживание не прерывалось. Оценок сотрудникам не давалось, обещаний по автоматизации не давалось.</p>\n<hr>\n<h3>1. Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП (номер и название)</td><td>039-Галле</td></tr>\n<tr><td>Адрес</td><td>не зафиксирован в ходе визита (ориентир со слов сотрудника — р-н ул. Комсомольской, вход со стороны проспекта закрыт лестницей)</td></tr>\n<tr><td>Группа / дивизион</td><td>не зафиксировано</td></tr>\n<tr><td>Дата визита</td><td>15.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Абдуллин Венер Фаритович</td></tr>\n<tr><td>Время: приехал / уехал</td><td>12:00 / 12:40 (всего 0,7 ч)</td></tr>\n<tr><td>Кто был на смене</td><td>[товаровед] — товаровед</td></tr>\n<tr><td>Супервайзер</td><td>Напалкова Валерия Евгеньевна</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>не зафиксировано</td></tr>\n</tbody></table>\n<hr>\n<h3>2. Что делал на ОП (по порядку)</h3>\n<p>— Осмотрел рабочую зону и подсобные помещения вместе с товароведом; товаровед показала, что изменилось после ремонта в субботу (демонтаж шкафа для верхней одежды, покраска стен, снятые жалюзи). — Осмотрел санузел и место установки насоса; товаровед показала, как подключается насос при поступлении воды и где стоит тройник. — Провёл разговор по блоку §8 методички: обычный день, где теряется время, что ломается, что неудобно в АРМ и Битрикс. — Разобрал со слов товароведа комплект документов по залогу (три экземпляра договора, спецификация по технике, отрывная часть, которая крепится к вещи). — Разобрал жалобы по ПЭП: ожидание СМС, случаи, когда номер на другом телефоне, уход СМС в спам, различие «СМС vs push при установленном мобильном приложении». Объяснил логику (бизнес не дублирует push платными СМС). — Зафиксировал позитивную обратную связь: при невозможности отправки по СБП система теперь предлагает выдачу на карту прямо в процессе сделки. — Осмотрел рабочее место приёма и проверки техники; товаровед показала проблему с неподписанными кабелями и доступом к разъёмам. — Показал товароведу новую AI-систему (два режима: поддержка и личный ассистент), ответил на вопросы о том, как из неё создаются тикеты и увидит ли обращение техподдержка. — Обсудил проблему видимости точки: порванный выносной флаг, вывеска, закрытая лестницей, сравнение с соседней вывеской аптеки. — В ходе визита товаровед приняла входящий звонок клиента с уточнением адреса и режима работы. — Обсудил порядок дальнейших действий: по хозяйственным вопросам выходить на супервайзера и ставить задачи, чтобы вопрос не терялся. — Запросил у товароведа сейф-пакет как образец артефакта.</p>\n<hr>\n<h3>3. Что изучил</h3>\n<p>— <strong>Оформление залога (со слов и по показанным бланкам).</strong> Печатается три экземпляра договора плюс отдельная спецификация по технике. Клиент подписывает, нижняя (отрывная) часть договора отрывается и крепится к вещи. Понял: спецификация по залогу существует как отдельная печатная форма, и она же дублируется в подписанной клиентом части договора — нужен точный перечень форм по операции, у товароведа уверенности в составе комплекта нет. — <strong>Переход с квитанции на договор.</strong> Со слов товароведа, раньше форма была квитанцией, сейчас — договор; пояснено, что договор — юридически корректный инструмент. Вопрос, должна ли при этом оставаться квитанция, остался открытым: точного ответа не дал, требуется сверка с регламентом. — <strong>Ограничение по количеству изделий.</strong> Со слов товароведа, в бумажный договор можно внести не более 4 изделий. Требует проверки по системе и регламенту (расшифровка разговора в этом месте неточная). — <strong>ПЭП и подписание.</strong> Узкое место — ожидание СМС: номер клиента может быть привязан к другому телефону, СМС уходит в спам; при установленном мобильном приложении приходят push, а СМС не дублируются. При невозможности провести по ПЭП операция оформляется на бумаге. Понял: сотруднику не хватает не техники, а объяснимого сценария «что делать, когда код не пришёл» и понимания логики push/СМС. — <strong>Выдача по СБП → выдача на карту.</strong> Разобрал недавнее изменение: если отправка по СБП не проходит, система предлагает выдачу на карту внутри той же сделки, без перезаведения. Товаровед оценивает как улучшение. Это рабочий образец того, как должны выглядеть fallback-сценарии в других местах АРМ. — <strong>Рабочее место приёма/проверки техники.</strong> Чтобы проверить принимаемую технику, оборудование приходится вытаскивать и подключать экран или приносить монитор. Кабели (питание, колонки, картридер) не подписаны, разъёмов и доступа к ним не хватает. Запрос сотрудника: промаркировать кабели на концах и добавить розетки/вынести разъёмы. — <strong>Быстродействие АРМ.</strong> Жалоб на зависания и подвисания в момент визита не прозвучало — по скорости системы претензий нет. — <strong>Поддержка и новая AI-система.</strong> Товаровед не понимает механики: увидит ли обращение техподдержка, где именно создаётся тикет, нужно ли сначала переписываться с ассистентом. Пояснено: сначала попытка решения ассистентом, далее создание тикета; поддерживается приложение скриншота. Понял: при запуске нужна короткая инструкция «куда писать и что будет дальше», иначе сотрудники продолжат работать по-старому. — <strong>Хозяйственный контур после ремонта.</strong> Ремонт делали в субботу, координация шла через АХЧ (звонок, замеры под стеллаж, обсуждение закупки), результат сотрудника не устраивает: шкаф убран, обещанный стеллаж не установлен, второй стеллаж оказался в санузле, обещанные пробковые доски (со слов — от Шашкова) не поставлены, поэтому шпаргалки на стены сейчас не вешают. Понял: заявка-исполнение-приёмка по хозработам не замкнуты, сотрудник не знает, к кому идти с результатом. — <strong>Видимость точки.</strong> Клиенты находят ОП преимущественно не по вывеске; со стороны проспекта вывеску закрывает лестница; выносной флаг был основным ориентиром — сейчас порван, задача заведена, срок «четыре дня» назван, сегодня товаровед повторно написала в задачу. Подтверждение в ходе визита: входящий звонок клиента с вопросом адреса и режима работы.</p>\n<hr>\n<h3>4. Что не успел посмотреть (и почему)</h3>\n<p>— Весь §5 методички вживую: залог, скупка/комиссия, продление и погашение, выкуп, невыкуп и реализация, продажа в зале, Авито и площадки, пункт выдачи, возврат, перемещение между ОП. <strong>Причина:</strong> за 40 минут визита клиентов не было, «покажите, как вы это делаете» по шагам не отрабатывали. — Касса и деньги: открытие/закрытие смены, эквайринг, инкассация, расхождения. Не затрагивалось. — Товар и хранение: маркировка, поиск вещи на хранении, витрины и ценники, инвентаризация, метки КМТ/КМЗ. Не затрагивалось. — Отчётность и коммуникации: что сдаёт сотрудник, кому и в каком виде, сколько рабочих чатов, табель и график. Не затрагивалось. — Рабочее место по §4: сколько программ и окон АРМ держит сотрудник параллельно, под какой учётной записью работают (личная/общая). Не проверялось. — Клиентский поток по §3: количество клиентов за час, структура операций, поведение при двух и более клиентах на одного сотрудника. Наблюдений нет. — Тетради, личные таблицы, самодельные шаблоны (§7 методички, «самое ценное на визите») — целенаправленно не искались.</p>\n<hr>\n<h3>5. Три главных наблюдения</h3>\n<ol>\n<li><strong>Ремонт сделали, рабочее место ухудшили.</strong> Шкаф для верхней одежды демонтирован, взамен ничего не поставлено: верхнюю одежду вешать некуда, вещи со снятых полок стоят «где встали», один стеллаж оказался в санузле, стены после покраски в брызгах, жалюзи сняты и не возвращены. Обещанные пробковые доски не установлены, из-за чего рабочие шпаргалки сейчас вообще не размещены. Заявки закрываются на стороне АХЧ без приёмки со стороны ОП.</li>\n<li><strong>Точку физически не видно, и единственный работающий ориентир сломан.</strong> Вывеску закрывает лестница, со стороны проспекта ОП не просматривается, клиенты (включая звонящих) не могут найти адрес. Выносной флаг, которым точка «обозначалась», порван; задача заведена, срок назван, исполнения нет — сотрудник вынужден напоминать повторно.</li>\n<li><strong>Потери времени сосредоточены не в скорости АРМ, а в бумаге и подтверждениях.</strong> Зависаний нет, но есть печать трёх экземпляров договора со спецификацией и отрывной частью, ожидание СМС по ПЭП с типовыми сбоями (чужой телефон, спам, push вместо СМС) и ограничение по числу изделий в бумажном договоре. При этом уже сделанный fallback «СБП → выдача на карту» сотрудник отмечает как явное улучшение — это готовый шаблон для остальных операций.</li>\n</ol>\n<hr>\n<h3>6. Обходные пути (что делают мимо системы и почему)</h3>\n<p>— <strong>Отрывная часть договора как бирка на вещи.</strong> Нижняя часть подписанного договора отрывается и физически крепится к принятой вещи — идентификация вещи на хранении держится на бумаге. — <strong>Бумажное оформление вместо ПЭП.</strong> Если код по ПЭП не приходит или телефон клиента недоступен, операция (в т.ч. выкуп) оформляется на бумаге. — <strong>Шпаргалки на стенах.</strong> До ремонта у монитора/на стенах висели рабочие «лепестки» и шпаргалки; сейчас не вешают только потому, что стены свежепокрашены и ждут пробковые доски. Содержимое шпаргалок не зафиксировано — <strong>обязательный пункт следующего визита</strong>. — <strong>Тройник для насоса.</strong> Розеток не хватает: насос откачки воды и зарядки конкурируют за розетку, из-за чего насос выключали; решено самостоятельной установкой тройника.</p>\n<p>Найдено обходных путей: <strong>4</strong> (при том, что целенаправленный поиск тетрадей и личных таблиц не проводился).</p>\n<hr>\n<h3>7. Потери времени (операция → сколько → из-за чего)</h3>\n<table><thead><tr><th>Операция</th><th>Потеря</th><th>Из-за чего</th></tr></thead><tbody>\n<tr><td>Оформление залога</td><td>не замерялось</td><td>печать 3 экземпляров договора + отдельная спецификация по технике, подпись клиента, отрыв и крепление части договора к вещи</td></tr>\n<tr><td>Подписание по ПЭП</td><td>ожидание СМС, время не замерялось</td><td>номер привязан к другому телефону, СМС в спаме, при установленном приложении СМС не дублируют push</td></tr>\n<tr><td>Залог нескольких изделий</td><td>доп. оформление</td><td>со слов — не более 4 изделий в один бумажный договор (требует проверки)</td></tr>\n<tr><td>Приём и проверка техники</td><td>не замерялось</td><td>оборудование нужно вытаскивать, подключать монитор/экран; кабели не подписаны, разъёмы труднодоступны</td></tr>\n<tr><td>Обращения в поддержку</td><td>не замерялось</td><td>непонятно, куда писать и кто увидит; ожидание ответа не отслеживается сотрудником</td></tr>\n</tbody></table>\n<p>&gt; Замеров времени на этом визите нет — операции не наблюдались. Все строки требуют хронометража на повторном визите.</p>\n<hr>\n<h3>8. Расхождения с тем, как должно быть по регламенту</h3>\n<p>— <strong>Состав комплекта документов по залогу.</strong> Товаровед не уверена, должна ли при договоре дополнительно оформляться квитанция; на месте вопрос не разрешён. Требуется сверка фактического комплекта с действующим регламентом и фиксация в базе знаний АРМ. — <strong>Доступ к оборудованию для обслуживания.</strong> Со слов, к месту установки насоса/коммуникаций должен сохраняться доступ для обслуживания; фактически зона подтапливается, пол становится мокрым. Требует проверки условий эксплуатации помещения. — Прочие расхождения не проверялись: операции вживую не наблюдались.</p>\n<hr>\n<h3>9. Требует ремонта / замены</h3>\n<p>Перечень составлен по осмотру и разговору. <strong>Фото к отчёту не приложены</strong> — при раскладке папки <code>Объезд по ОП/039-Галле/</code> проставить номера кадров в правой колонке (общий план + крупный кадр дефекта, без клиентов и документов в кадре).</p>\n<table><thead><tr><th>№</th><th>Что и где</th><th>Суть</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>1</td><td>Гардеробная зона (бывший шкаф)</td><td>демонтирован шкаф для верхней одежды со штангой и полками, замена не установлена — вешать одежду некуда</td><td></td></tr>\n<tr><td>2</td><td>Та же зона</td><td>не установлен согласованный стеллаж (замеры делались, закупка обсуждалась с АХЧ)</td><td></td></tr>\n<tr><td>3</td><td>Санузел</td><td>стеллаж, предназначенный для рабочей зоны, размещён в санузле</td><td></td></tr>\n<tr><td>4</td><td>Стены после покраски</td><td>брызги и пятна краски, неаккуратная окраска, следы на шкафу; краски не хватило</td><td></td></tr>\n<tr><td>5</td><td>Окно</td><td>демонтированные жалюзи не возвращены на место</td><td></td></tr>\n<tr><td>6</td><td>Рабочая зона</td><td>не установлены обещанные пробковые доски под рабочие материалы</td><td></td></tr>\n<tr><td>7</td><td>Санузел / подсобное помещение</td><td>подтопление, мокрый пол при поступлении воды</td><td></td></tr>\n<tr><td>8</td><td>Электрика в зоне насоса</td><td>нехватка розеток, насос и зарядные устройства через тройник, риск отключения насоса</td><td></td></tr>\n<tr><td>9</td><td>Канализация</td><td>устойчивый запах (сероводород) в помещении, усиливается весной</td><td></td></tr>\n<tr><td>10</td><td>Санитарное состояние</td><td>тараканы</td><td></td></tr>\n<tr><td>11</td><td>Входная группа / уличная навигация</td><td>выносной флаг порван; задача заведена, срок «4 дня» назван, исполнения нет</td><td></td></tr>\n<tr><td>12</td><td>Вывеска</td><td>вывеска перекрыта лестницей, со стороны проспекта ОП не виден; средств наружной навигации недостаточно</td><td></td></tr>\n<tr><td>13</td><td>Рабочее место приёма техники</td><td>кабели (питание, колонки, картридер) не маркированы, разъёмы труднодоступны — нужна маркировка концов и вынос/добавление разъёмов</td><td></td></tr>\n</tbody></table>\n<hr>\n<h3>10. Артефакты</h3>\n<p>— Сейф-пакет — запрошен у товароведа как образец; на ОП в наличии пакеты другого типа (с красной полосой). Уточнить, какие типы сейф-пакетов используются и для чего. — Пустые бланки договора залога и спецификации по технике — <strong>не взяты</strong>, взять на повторном визите.</p>\n<hr>\n<h3>11. Куда это идёт дальше</h3>\n<ul>\n<li>[x] <strong>реестр процессов</strong> — залог: печатные формы, отрывная часть как бирка, ограничение по числу изделий; ПЭП: сценарий «код не пришёл».</li>\n<li>[x] <strong>реестр идей CRM</strong> — предложение № ___ (fallback-сценарии по образцу «СБП → выдача на карту»); предложение № ___ (сокращение печатного комплекта по залогу); предложение № ___ (подсказка сотруднику при сбое ПЭП: почему не пришла СМС и что делать).</li>\n<li>[x] <strong>база знаний АРМ</strong> — раздел «Залог. Печатные формы и комплект документов»; раздел «ПЭП: типовые сбои и действия».</li>\n<li>[x] <strong>бэклог для аналитиков</strong> — проверить: (1) должна ли оформляться квитанция вместе с договором; (2) действительно ли ограничение 4 изделия на бумажный договор и откуда оно; (3) как считается и контролируется исполнение хозяйственных задач по ОП.</li>\n<li>[x] <strong>задача в Битрикс</strong> — хозяйственный перечень §9 передать супервайзеру (Напалкова В.Е.) единым списком; отдельно эскалировать порванный флаг (п. 11) как срочное — влияет на клиентский поток.</li>\n<li>[x] <strong>коммуникация по AI-системе</strong> — передать в поддержку/владельцу продукта: сотрудники не понимают, где создаётся тикет и кто его увидит; нужна короткая памятка на ОП.</li>\n</ul>\n<hr>\n<h3>12. Нужен повторный визит</h3>\n<p><strong>Да.</strong> Визит длился 40 минут и пришёлся на период без клиентов: ни одна операция не наблюдалась, хронометраж не снимался, касса, товар, витрины, отчётность и тетради не смотрелись. Повторный визит планировать на загруженное время (или по методичке «Фото рабочего дня») с задачами:</p>\n<ol>\n<li>Наблюдать залог, выкуп и продажу от начала до конца с подсчётом шагов и замером времени.</li>\n<li>Снять шпаргалки и рабочие материалы сотрудника (после установки пробковых досок) и задать по каждой вопрос «почему не в программе?».</li>\n<li>Пройти §6 методички: касса, маркировка и поиск вещи на хранении, витрины, инвентаризация.</li>\n<li>Проверить учётные записи (личная/общая) и состав одновременно открытых программ и окон АРМ.</li>\n<li>Взять пустые бланки договора и спецификации.</li>\n<li>Проверить, что из перечня §9 выполнено.</li>\n</ol>\n<hr>\n<h3>Связанные материалы</h3>\n<ul>\n<li>[[Чек-лист — объезд ОП аналитиком (1.0)]] — методика, по которой проведён визит.</li>\n<li>[[Методичка — фото рабочего дня (1.0)]] — формат повторного визита.</li>\n<li>Таблица <code>Объезд ОП — учёт.xlsx</code> — проставить дату посещения по ОП 039-Галле.</li>\n</ul>", "brief": "<p>Краткую справку собрать не удалось — откройте полный текст.</p>"}, {"date": "17.09.2026", "author": "Хазиев Тимур Ильнурович", "file": "Отчёт — 17.09.2026 — Хазиев Тимур Ильнурович — ОП-39.md", "title": "Отчёт об объезде ОП-39 «Галле»", "html": "<h2>Отчёт об объезде ОП-39 «Галле»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании краткой записи по итогам визита, переданной руководителем отдела бизнес-анализа Чусовитиной А.Э.: запах канализации и люк в полу клиентской зоны. Какие операции разбирали и как получены сведения, в записи не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записи, переданной 17.09.2026. Адрес, группа, дивизион и супервайзер ОП — по таблице учёта объезда; визит 17.09.2026 в таблице пока не отмечен. Должность аналитика — по профилю в Битрикс24. В тот же день Хазиев Т.И. посетил также ОП-161, ОП-14 и ОП-162 (отдельные отчёты). Предыдущий визит на ОП-39 — 15.09.2026, Абдуллин В.Ф. (отчёт в папке «15.09»): запах канализации отмечен и там. Цитаты из записи приведены в кавычках.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-39 «Галле»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, пр. Октября, д. 18/1</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Центр», дивизион 4</td></tr>\n<tr><td>Дата визита</td><td>17.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович</td></tr>\n<tr><td>Должность аналитика</td><td>Заместитель директора цифрового развития по аналитике и проектам</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Напалкова В.Е.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Зафиксировали запах канализации в помещении: «воняет канализацией».</li>\n<li>Зафиксировали люк в полу клиентской зоны и записали, как его закрыть: «надо закрыть чем-то по типу ковра». Чьё это предложение — проверяющего или сотрудников ОП, — не указано.</li>\n</ol>\n<p>Какие операции смотрели и с кем беседовали, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Помещение: запах</td><td>Не указано; по смыслу записи — осмотр</td><td>«Воняет канализацией». Где запах сильнее и откуда идёт, не указано</td></tr>\n<tr><td>Клиентская зона: люк в полу</td><td>Не указано; по смыслу записи — осмотр</td><td>В полу клиентской зоны — люк; «надо закрыть чем-то по типу ковра». Назначение и размер люка не указаны</td></tr>\n</tbody></table>\n<p>Клиентские операции в записи не разбирались: последовательность работы, число действий, время и документы не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает, что операции на ОП нет или что её не смотрели.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Источник запаха; назначение и размер люка</td><td>Уточнить у товароведа и супервайзера, запросить фото</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, оборудование, скорость АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Залог, выкуп, продление, скупка, продажа</td><td>В записи не отражено; со слов товароведа частично разобраны 15.09.2026 (Абдуллин В.Ф.)</td></tr>\n<tr><td>Касса, товар и документы</td><td>Смена, оплата, хранение, учёт, печатные формы</td><td>В записи не отражено</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Получатели, сроки, каналы</td><td>В записи не отражено</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Выполнено ли что-то по хозяйственному перечню от 15.09.2026, фотографии</td><td>Уточнить у супервайзера</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. В помещении запах канализации</h4>\n<p>«Воняет канализацией». Запах отмечен повторно: 15.09.2026 Абдуллин В.Ф. записал «устойчивый запах (сероводород) в помещении, усиливается весной», а также подтопление санузла и мокрый пол при поступлении воды.</p>\n<p>Источник запаха не установлен. Покрытие люка, предложенное в записи, улучшит вид клиентской зоны, но запах не уберёт: причину должен установить ответственный за помещение.</p>\n<h4>2. Люк в полу клиентской зоны — предложено закрыть покрытием</h4>\n<p>В полу клиентской зоны — люк. Записано: «надо закрыть чем-то по типу ковра». Назначение люка, его размер и состояние не указаны.</p>\n<p>По отчёту от 15.09.2026, к месту установки насоса и коммуникаций нужен доступ для обслуживания; если это тот же люк, покрытие должно легко сниматься. Для клиентской зоны оно также должно быть нескользким и без перепада высоты, чтобы о него не споткнулись. Проверить, не идёт ли запах через люк.</p>\n<p>Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>Не отмечены. Целенаправленный поиск тетрадей, таблиц и работы вне АРМ в записи не отражён, поэтому вывод об их отсутствии не делается.</p>\n<h3>Потери времени</h3>\n<p>Потери времени не отмечены, замеры не проводились.</p>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Запах канализации в помещении ОП</td><td>Ремонт</td><td>Источник запаха (люк, санузел, сифоны, вентиляция), когда усиливается; тот же пункт — в отчёте от 15.09.2026</td><td>Не приложено</td></tr>\n<tr><td>Люк в полу клиентской зоны</td><td>Дополнительное оснащение — покрытие «по типу ковра»</td><td>Назначение люка и нужен ли к нему доступ; размер; съёмное нескользящее покрытие без перепада высоты; нужна ли герметизация люка</td><td>Не приложено</td></tr>\n</tbody></table>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда. Для сравнения — отчёт Абдуллина В.Ф. об объезде ОП-39 15.09.2026.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Ответственному за помещение нужны фотографии люка и места, где сильнее запах, и размеры люка.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Все действия пока только предложены; задачи не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Ответственный за помещение / оснащение</td><td>Запах канализации; покрытие для люка в клиентской зоне</td><td>Фотографий, размеров люка, источника запаха</td><td>Предложено</td></tr>\n<tr><td>Задача в Битрикс</td><td>Запах канализации и люк — супервайзеру Напалковой В.Е., вместе с хозяйственным перечнем по визиту 15.09.2026</td><td>Проверить, заведена ли задача по визиту 15.09.2026, чтобы не дублировать</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> фотографии, размеры люка и источник запаха можно запросить у товароведа и супервайзера дистанционно. По итогам визита 15.09.2026 повторный визит на ОП-39 уже предлагался — чтобы посмотреть операции в загруженное время; проверку запаха и покрытия люка можно совместить с ним.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-39 «Галле», 17.09.2026, Хазиев Тимур Ильнурович, заместитель директора цифрового развития по аналитике и проектам.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: что осматривали, с кем говорили.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремо Октября", "d": "3", "lat": 54.7545222, "lon": 56.0044946, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Чусовитина Аделина Эриковна", "date": "15.09.2026", "src": "отчёт"}], "reports": [{"date": "15.09.2026", "author": "Чусовитина Аделина Эриковна", "file": "Отчёт — 15.09.2026 — Чусовитина Аделина Эриковна — ОП 2.md", "title": "Отчёт об объезде ОП-2 «Спортивная»", "html": "<h2>Отчёт об объезде ОП-2 «Спортивная»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании краткой записи по итогам визита: «там всё в норме, жалоб нет». ОП посетили три проверяющих: Чусовитина А.Э., Хазиев Т.И. и Золотых С.В. Какие операции разбирали и как получены сведения, в записи не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записи, переданной 17.09.2026; состав проверяющих — по уточнению того же дня. Название, адрес, группа, дивизион и супервайзер ОП — по таблице учёта объезда. В таблице объезд 15.09.2026 пока не отмечен ни у одного из трёх проверяющих. Время визита, состав смены и разобранные операции в записи не указаны. «Не указано» — это отсутствие сведений, а не отсутствие операции на ОП.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-2 «Спортивная»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, пр. Октября, д. 52</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Центр», дивизион 3</td></tr>\n<tr><td>Дата визита</td><td>15.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Чусовитина Аделина Эриковна, Хазиев Тимур Ильнурович, Золотых Светлана Витальевна — визит втроём</td></tr>\n<tr><td>Должность аналитика</td><td>Чусовитина А.Э. — руководитель отдела бизнес-анализа; Хазиев Т.И. — заместитель директора цифрового развития по аналитике и проектам; Золотых С.В. — бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Напалкова В.Е.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Посетили ОП-2 «Спортивная» в рамках объезда втроём: Чусовитина А.Э., Хазиев Т.И., Золотых С.В.</li>\n<li>Замечаний к работе ОП и жалоб не зафиксировали: «там всё в норме, жалоб нет».</li>\n</ol>\n<p>Какие операции смотрели, с кем беседовали и как распределили работу между проверяющими, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Работа ОП в целом</td><td>Не указано</td><td>«Всё в норме, жалоб нет». Какие операции и участки смотрели, не указано</td></tr>\n</tbody></table>\n<p>Отдельная операция в записи не разобрана: последовательность работы, число действий, время и документы не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает, что операции на ОП нет или что её не смотрели.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Вход, рабочие места, очередь, число клиентов</td><td>В записи не отражено; дополнить по памяти</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, оборудование, скорость АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Залог, выкуп, продление, скупка, продажа</td><td>В записи не отражено</td></tr>\n<tr><td>Касса, товар и документы</td><td>Смена, оплата, хранение, учёт, печатные формы</td><td>В записи не отражено</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Получатели, сроки, каналы</td><td>В записи не отражено</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения, фотографии</td><td>По записи — «всё в норме»; фотографии не приложены</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Работа ОП — без замечаний</h4>\n<p>По записи, «там всё в норме»: проблем в работе ОП за время визита не выявлено. Какие операции и участки смотрели, не указано, поэтому вывод относится к тому, что удалось увидеть и обсудить.</p>\n<h4>2. Жалоб нет</h4>\n<p>«Жалоб нет» — от кого (сотрудники ОП или клиенты) и по каким темам спрашивали, не указано. Отсутствие жалоб не исключает обходных путей и потерь времени, о которых сотрудники сами не говорят.</p>\n<p>Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>Не отмечены. Целенаправленный поиск тетрадей, таблиц и работы вне АРМ в записи не отражён, поэтому вывод об их отсутствии не делается.</p>\n<h3>Потери времени</h3>\n<p>Потери времени не отмечены, замеры не проводились.</p>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении не отмечены («всё в норме»).</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Замечаний, предложений и потребностей по ОП-2 не зафиксировано. Задачи не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>ОП-2 как точка сравнения: проверить, повторяется ли здесь проблема с ПЭП при выкупе, отмеченная на ОП-15 14.09.2026 и при тестировании на ОП-5 15.09.2026</td><td>Сведений о выкупе по электронному договору на ОП-2</td><td>Предложено</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято; по записи оснований для повторного визита нет.</p>\n<p><strong>Обоснование:</strong> замечаний и жалоб нет. Время визита и перечень разобранных операций можно дописать дистанционно со слов участников визита. Повторный визит понадобится, только если ОП-2 возьмут для сравнения с ОП, где есть замечания.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-2 «Спортивная», 15.09.2026; проверяющие — Чусовитина Аделина Эриковна (руководитель отдела бизнес-анализа), Хазиев Тимур Ильнурович (заместитель директора цифрового развития по аналитике и проектам), Золотых Светлана Витальевна (бизнес-аналитик).</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: какие операции смотрели, кто из проверяющих что разбирал.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[x] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — потребностей не отмечено, фотографии не приложены.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта — объезд 15.09.2026 в таблице пока не отмечен ни у одного из трёх проверяющих.</li>\n</ul>", "brief":
