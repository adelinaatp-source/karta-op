></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович</td></tr>\n<tr><td>Должность аналитика</td><td>Заместитель директора цифрового развития по аналитике и проектам</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Товаровед; ФИО и состав смены не указаны</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Камаров А.А.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Посетили ОП-159 «Космос» в рамках объезда.</li>\n<li>По итогам общения с товароведом проблем не зафиксировали: «проблем никаких у товароведа нет».</li>\n</ol>\n<p>Какие операции смотрели и какие темы обсуждали, в записи не указано.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Работа товароведа</td><td>Не указано; по смыслу записи — беседа с товароведом</td><td>«Проблем никаких у товароведа нет». Какие операции и темы обсуждали, не указано</td></tr>\n</tbody></table>\n<p>Отдельная операция в записи не разобрана: последовательность работы, число действий, время и документы не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает, что операции на ОП нет или что её не смотрели.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Вход, рабочие места, очередь, число клиентов</td><td>В записи не отражено; дополнить со слов Хазиева Т.И.</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, оборудование, скорость АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Залог, выкуп, продление, скупка, продажа</td><td>В записи не отражено</td></tr>\n<tr><td>Касса, товар и документы</td><td>Смена, оплата, хранение, учёт, печатные формы</td><td>В записи не отражено</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Получатели, сроки, каналы</td><td>В записи не отражено</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне АРМ</td><td>В записи не отражено</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения, фотографии</td><td>В записи не отражено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. У товароведа проблем нет</h4>\n<p>«Проблем никаких у товароведа нет» — затруднений в работе товароведа за время визита не выявлено. Какие операции и темы обсуждали, не указано, поэтому вывод относится к тому, что удалось обсудить.</p>\n<p>Отсутствие проблем со слов товароведа не исключает обходных путей и потерь времени, о которых сотрудники сами не говорят. Других наблюдений в записи нет.</p>\n<h3>Обходные пути</h3>\n<p>Не отмечены. Целенаправленный поиск тетрадей, таблиц и работы вне АРМ в записи не отражён, поэтому вывод об их отсутствии не делается.</p>\n<h3>Потери времени</h3>\n<p>Потери времени не отмечены, замеры не проводились.</p>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении в записи не отмечены. Осматривали ли помещение, не указано.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> запись по итогам визита, передана 17.09.2026; реквизиты ОП — по таблице учёта объезда.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Замечаний, предложений и потребностей по ОП-159 не зафиксировано. Задачи не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>ОП-159 как точка сравнения: проверить подписание ПЭП при выкупе — ссылка на документ не выходила на ОП-15 14.09.2026 и при тестировании на ОП-5 15.09.2026</td><td>Сведений о выкупе с ПЭП на ОП-159</td><td>Предложено</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято; по записи оснований для повторного визита нет.</p>\n<p><strong>Обоснование:</strong> проблем у товароведа нет. Время визита и перечень обсуждённых операций можно дописать дистанционно со слов Хазиева Т.И.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-159 «Космос» (номер по таблице учёта — подтвердить), 14.09.2026, Хазиев Тимур Ильнурович, заместитель директора цифрового развития по аналитике и проектам.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: какие операции смотрели, о чём говорили с товароведом.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — в записи не отмечены; уточнить, осматривали ли помещение.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[x] Внести сведения в таблицу учёта объезда после завершения отчёта — объезд 14.09.2026 в таблице отмечен.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>14.09.2026</dd><dt>Аналитик</dt><dd>Хазиев Тимур Ильнурович</dd><dt>Время приезда и \n<p>&gt; [!info] Как дописать отчёт &gt; Подсказки в квадратных скобках заменить сведениями с визита, строки «Уточнить» — заполнить или оставить с пояснением. Отделять наблюдение за реальной операцией от показа в программе и рассказа сотрудника. Персональные данные клиентов не включать.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-165 «Бакалинская»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Менделеева, д. 137; по карте объездов — здание ТРК «Иремель». Точка — островок в торговом центре</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Юг», дивизион 6</td></tr>\n<tr><td>Дата визита</td><td>09.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Хазиев Тимур Ильнурович</td></tr>\n<tr><td>Должность аналитика</td><td>Уточнить</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Уточнить</td></tr>\n<tr><td>Продолжительность</td><td>Уточнить</td></tr>\n<tr><td>С кем работали, должности</td><td>Уточнить</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Уточнить; супервайзер ОП — Камаров А.А.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<p>Заполняет аналитик: конкретные действия в порядке выполнения.</p>\n<ol>\n<li>[Что наблюдали или разбирали; границы процесса.]</li>\n<li>[Что показал сотрудник; какие вопросы обсудили.]</li>\n<li>[Что проверили и зафиксировали.]</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Помещение: формат точки</td><td>Со слов руководителя отдела; осмотр аналитиком — уточнить</td><td>Точка — островок в торговом центре (по карте объездов — ТРК «Иремель»). Площадь, число рабочих мест, витрины и место ожидания клиента не описаны</td></tr>\n<tr><td>[Название]</td><td>[Наблюдение / показ / беседа / документы]</td><td>[Факты и ограничения]</td></tr>\n<tr><td>[Название]</td><td>[Способ]</td><td>[Результат]</td></tr>\n</tbody></table>\n<h4>[Основная операция]: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> [От какого события до какого результата.]</p>\n<p><strong>Кто выполняет:</strong> [Роли сотрудника, клиента и других участников.]</p>\n<p><strong>Где выполняет:</strong> [Программы, формы, оборудование, действия вне системы.]</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. [Название]</td><td>[Действия]</td><td>[Причина / нет сведений]</td></tr>\n<tr><td>2. [Название]</td><td>[Действия]</td><td>[Причина / нет сведений]</td></tr>\n<tr><td>3. [Название]</td><td>[Результат]</td><td>[Причина / нет сведений]</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> [Замер или «Не замерено». Смысловые этапы не равны кликам.]</p>\n<p><strong>Время выполнения:</strong> [Общее время и замеры по этапам либо «Не замерено».]</p>\n<p><strong>Документы и повторный ввод:</strong> [Что печатают, сколько экземпляров, что подписывают, где дублируют данные.]</p>\n<h3>Что не успели посмотреть</h3>\n<p>Заполняет аналитик. Для точки-островка в торговом центре в каждом разделе стоит отдельно отразить пункты из средней колонки. Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Как клиент находит островок в ТЦ, где ждёт, как соблюдается конфиденциальность при оценке и оформлении, число клиентов и очередь</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Число рабочих мест, программы и окна, оборудование, электропитание и интернет в ТЦ</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Клиентские операции</td><td>Какие операции есть на точке и какие разобраны</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Касса, товар и документы</td><td>Где хранятся залоги и наличные, как устроены витрины, инкассация в ТЦ, открытие и закрытие смены по режиму работы ТЦ</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Получатели, сроки, каналы, затраты времени</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне системы и причины</td><td>Уточнить у аналитика</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Состояние островка и витрин, ограничения арендодателя ТЦ по оснащению, фотографии</td><td>Уточнить у аналитика</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Точка работает островком в торговом центре</h4>\n<p>По предварительным сведениям, ОП-165 размещается островком в торговом центре — по карте объездов это ТРК «Иремель», ул. Менделеева, 137. Для ломбарда и скупки такой формат требует отдельной проверки: где клиент ждёт и как обеспечивается конфиденциальность при оформлении, где хранятся залоги и наличные, как устроены витрины, электропитание и связь, совпадает ли режим работы ТЦ с графиком ОП и как проходит инкассация. Подтвердить и дополнить фактами с визита.</p>\n<h4>2. [Краткая формулировка — заполняет аналитик]</h4>\n<p>[Факт, пример и последствия.]</p>\n<h4>3. [Краткая формулировка — заполняет аналитик]</h4>\n<p>[Факт, пример и последствия.]</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>[Действие вне системы или обход ограничения]</td><td>[Причина со слов сотрудника / по наблюдению]</td><td>[Повторный ввод, ожидание, риск ошибки и др.]</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> сведений пока нет — заполняет аналитик. Если обходных путей не обнаружено, указать это вместо заполнения строки предположениями.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>[Операция]</td><td>[Замер / оценка / не замерено]</td><td>[Причина]</td><td>[Какие действия, период и частота]</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> [Что не измерено; какие выводы пока нельзя сделать.]</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<table><thead><tr><th>Требование и источник</th><th>Что происходит фактически</th><th>Статус проверки</th></tr></thead><tbody>\n<tr><td>[Документ, редакция, пункт]</td><td>[Наблюдение]</td><td>[Подтверждено / требует проверки]</td></tr>\n</tbody></table>\n<h3>Требует ремонта / замены</h3>\n<p>Отдельно обозначить ремонт, замену и дополнительное оснащение. Для островка в ТЦ указать, согласуется ли оснащение с арендодателем.</p>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>[Объект и место]</td><td>[Ремонт / замена / дополнительное оснащение]</td><td>[Дефект, количество, размеры, расположение]</td><td>[Номер / не приложено]</td></tr>\n</tbody></table>\n<p><strong>Фотофиксация:</strong> уточнить — делались ли фотографии островка, витрин и дефектов.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> отметка визита в карте объездов ОП. Записи и заполненный чек-лист аналитика не приложены.</p>\n<p><strong>Полученные на ОП образцы:</strong> уточнить. Пустые бланки, фотографии, обезличенные примеры экранов и таблиц не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Действия определяются после заполнения отчёта; пока ничего не предложено и не выполнено.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>[Процесс]</td><td>[Данные]</td><td>[Заполнить]</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>[Предложение]</td><td>[Данные]</td><td>[Заполнить]</td></tr>\n<tr><td>База знаний АРМ</td><td>[Инструкция / раздел]</td><td>[Данные]</td><td>[Заполнить]</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>[Проблема или проверка]</td><td>[Данные]</td><td>[Заполнить]</td></tr>\n<tr><td>Ответственный за помещение / оснащение</td><td>[Перечень потребностей островка]</td><td>[Фото / параметры]</td><td>[Заполнить]</td></tr>\n<tr><td>Задача в Битрикс</td><td>[Предмет задачи]</td><td>[Данные]</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> решение принимается после того, как аналитик заполнит отчёт по итогам визита 09.09.2026.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-165 «Бакалинская», 09.09.2026, Хазиев Тимур Ильнурович; должность уточнить.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по карте объездов; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций.</li>\n<li>[ ] Зафиксировать основные наблюдения и ограничения сведений — есть одно предварительное наблюдение о формате островка.</li>\n<li>[ ] Указать замеры времени либо их отсутствие.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии.</li>\n<li>[ ] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>09.09.2026</dd><dt>Аналитик</dt><dd>Хазиев Тимур Ильнурович</dd><dt>Время приезда и отъезда</dt><dd>Уточнить</dd><dt>Продолжительность</dt><dd>Уточнить</dd><dt>С кем работали, должности</dt><dd>Уточнить</dd><dt>Супервайзер предупреждён</dt><dd>Уточнить; супервайзер ОП — Камаров А.А.</dd><dt>Группа / дивизион</dt><dd>Группа «Юг», дивизион 6</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Точка работает островком в торговом центре</b><span>По предварительным сведениям, ОП-165 размещается островком в торговом центре — по карте объездов это ТРК «Иремель», ул. Менделеева, 137. Для ломбарда и скупки такой формат требует отдельной проверки: где клиент ждёт и…</span></li><li><b>[Краткая формулировка — заполняет аналитик]</b><span>[Факт, пример и последствия.]</span></li><li><b>[Краткая формулировка — заполняет аналитик]</b><span>[Факт, пример и последствия.]</span></li></ol>\n<h2>Потери времени</h2><ul><li>[Операция]</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>[Объект и место]</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>База знаний АРМ</li><li>Бэклог аналитиков / техническая поддержка</li><li>Ответственный за помещение / оснащение</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 1 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-142", "num": "142", "name": "Иремель", "addr": "г.Уфа, ул. Менделеева, д.141", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — ул. Менделеева", "d": "6", "lat": 54.7140593, "lon": 55.9976403, "tv": [], "st": "", "flags": ["КМТ"], "note": "", "obs": "Нехватка стеллажей для КМТ. Затруднитеьная операция с начислениями бонусов", "approx": false, "approxNote": "Менделеева, 141 — здание в ряду нумерации 139 → 141/2 → 145 (раньше стоял объект «ХБК» с тем же номером)", "visits": [{"by": "Чусовитина Аделина Эриковна", "date": "09.09.2026"}], "reports": [{"date": "09.09.2026", "author": "Чусовитина Аделина Эриковна", "file": "Отчёт — 09.09.2026 — Чусовитина Аделина Эриковна — ОП 142.md", "title": "Отчёт об объезде ОП-142 «Иремель»", "html": "<h2>Отчёт об объезде ОП-142 «Иремель»</h2>\n<p>Дата подготовки: <strong>11.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании записей по ходу визита: скупка техники, работа с оперативной кассой, перевод товара, розничная продажа, оснащение. Как получено каждое сведение (наблюдение, показ в программе или рассказ сотрудника), в записях не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записям, переданным 09.09.2026. Номер ОП и аналитик — по уточнению; название, адрес, группа, дивизион, супервайзер ОП и дата визита — по карте объездов ОП. Время визита в записях не указано. Цитаты из записей приведены в кавычках. «Не указано» — это отсутствие сведений, а не отсутствие операции на ОП.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-142 «Иремель»; в карте объездов отмечен как КМТ — совпадает с записями о скупке техники и рознице</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Менделеева, д. 141</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Юг», дивизион 6</td></tr>\n<tr><td>Дата визита</td><td>09.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Чусовитина Аделина Эриковна</td></tr>\n<tr><td>Должность аналитика</td><td>Руководитель отдела бизнес-анализа</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано. В записях упомянуты скупщики (согласование в Битриксе) и колл-центр (начисление бонусов)</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Камаров А.А.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Разобрали скупку техники: от поиска аналога на Авито и расчёта цены предложения до оформления в АРМ и расчёта с клиентом.</li>\n<li>Разобрали работу с оперативной кассой при расчёте наличными: уход кассы в минус, пополнение, оприходование, вечерняя печать ПКО и РКО.</li>\n<li>Зафиксировали перевод товара «из розницы в Смарт».</li>\n<li>Разобрали розничную продажу: подбор товара в каталогах, корзина, бонусы и дисконтная карта, закрытие чека, печатные и электронные документы.</li>\n<li>Зафиксировали потребность в оснащении — стол для фотосъёмки товара для Авито.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Скупка техники</td><td>Не указано</td><td>Цену предложения определяют по Авито: находят товар и предлагают клиенту 70 %. Сделку согласовывают скупщики в Битриксе, затем в АРМ подтверждается номер телефона клиента. От какой цены считаются 70 % (объявление, средняя по нескольким) — не указано</td></tr>\n<tr><td>Расчёт с клиентом и оперативная касса</td><td>Не указано</td><td>У многих клиентов нет карты (по контексту — для безналичной выплаты), поэтому расчёт наличными с приходным и расходным кассовыми ордерами. Оперативная касса уходит в минус, затем её пополняют и оприходуют. ПКО и РКО печатают вечером. Запись о расхождении: «был минус 40,60 в расходник на 60 коп» — смысл требует уточнения</td></tr>\n<tr><td>Перевод товара</td><td>Не указано</td><td>Записано: «Из розницы переводим в смарт». Основание, кто выполняет и как оформляется перевод, не указано</td></tr>\n<tr><td>Розничная продажа</td><td>Не указано</td><td>Товар ищут в двух каталогах — «Смарт» и «Смарт новый», добавляют в корзину, указывают бонусную карту и ФИО; если карты нет — создают дисконтную. При закрытии чека цена встаёт с учётом скидки. Бонусы начисляет колл-центр по задаче в Битриксе. Клиенту выдают товарный чек в 2 экземплярах, электронный чек приходит по СМС</td></tr>\n<tr><td>Оснащение для Авито</td><td>Не указано</td><td>Нужен стол, чтобы фотографировать товар для объявлений на Авито</td></tr>\n</tbody></table>\n<h4>Скупка техники: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от поиска аналога товара на Авито до расчёта с клиентом и вечерней печати кассовых ордеров.</p>\n<p><strong>Кто выполняет:</strong> сотрудник ОП (должность не указана); скупщики — согласование в Битриксе; клиент.</p>\n<p><strong>Где выполняет:</strong> Авито — поиск аналога и цены; Битрикс — согласование; АРМ — подтверждение номера телефона и оформление; оперативная касса; печатные ПКО и РКО.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Оценка по Авито</td><td>Находят товар на Авито и предлагают клиенту 70 %</td><td>Выход из АРМ во внешний сервис; цена рассчитывается вне системы</td></tr>\n<tr><td>2. Согласование</td><td>Сделку согласовывают скупщики в Битриксе</td><td>Ожидание ответа скупщиков, время не замерено. Сведения о товаре передаются в Битрикс отдельно от АРМ</td></tr>\n<tr><td>3. Оформление в АРМ</td><td>Подтверждение номера телефона клиента</td><td>Длительность и сбои подтверждения не указаны</td></tr>\n<tr><td>4. Расчёт с клиентом</td><td>У многих клиентов нет карты — расчёт наличными через ПКО и РКО</td><td>Оперативная касса уходит в минус; нужны пополнение и оприходование</td></tr>\n<tr><td>5. Закрытие дня</td><td>Вечером печатают РКО и ПКО</td><td>Ордера печатаются не в момент операции, а пакетом в конце дня</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> не замерено. На одну сделку — минимум три системы: Авито, Битрикс, АРМ.</p>\n<p><strong>Время выполнения:</strong> не замерено, в том числе ожидание согласования скупщиков.</p>\n<p><strong>Документы и повторный ввод:</strong> приходный и расходный кассовые ордера, печать вечером. Сведения о товаре, вероятно, вводятся дважды — в Битрикс для согласования и в АРМ для оформления; требует проверки.</p>\n<h4>Розничная продажа: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от подбора товара до выдачи клиенту документов о продаже.</p>\n<p><strong>Кто выполняет:</strong> сотрудник ОП, клиент; колл-центр — начисление бонусов.</p>\n<p><strong>Где выполняет:</strong> АРМ — каталоги «Смарт» и «Смарт новый», корзина, дисконтная карта, чек; Битрикс — задача колл-центру; СМС — электронный чек.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Подбор товара</td><td>Ищут товар в одном из двух каталогов — «Смарт» или «Смарт новый»</td><td>Поиск по двум каталогам; причина разделения не указана</td></tr>\n<tr><td>2. Корзина и клиент</td><td>Добавляют товар в корзину, указывают бонусы (если есть) и ФИО; если бонусной карты нет — создают дисконтную</td><td>Создание карты во время продажи; длительность не замерена</td></tr>\n<tr><td>3. Закрытие чека</td><td>Цена встаёт с учётом скидки; «оплата чека заполняется»</td><td>Записано «заморочки с бонусами» — в чём сложность, не раскрыто</td></tr>\n<tr><td>4. Бонусы</td><td>Сразу создают задачу в Битриксе, чтобы колл-центр начислил клиенту бонусы</td><td>Бонусы начисляются не в момент продажи, а по отдельной задаче</td></tr>\n<tr><td>5. Документы</td><td>Товарный чек в 2 экземплярах; клиенту на номер телефона приходит электронный чек по СМС</td><td>Нет сведений</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> не замерено. Продажа с бонусами — минимум АРМ и Битрикс.</p>\n<p><strong>Время выполнения:</strong> не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> товарный чек — 2 экземпляра, электронный чек по СМС. Данные клиента и покупки повторно вносятся в задачу Битрикса для колл-центра.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Вход, рабочие места, очередь, число клиентов за время визита</td><td>В записях не отражено; дополнить по памяти или на повторном визите</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, оборудование, скорость АРМ, подтверждение номера телефона</td><td>В записях есть только упоминание АРМ, Битрикса и Авито</td></tr>\n<tr><td>Клиентские операции</td><td>Проверка и тестирование техники при скупке, торг, отказ скупщиков, приём на комиссию, гарантия и возврат, публикация и снятие объявлений на Авито</td><td>Уточнить у товароведа</td></tr>\n<tr><td>Касса, товар и документы</td><td>Открытие и закрытие смены, инкассация, причины минуса оперативной кассы, маркировка, хранение, инвентаризация</td><td>Уточнить смысл записи «минус 40,60 / 60 коп» и порядок пополнения кассы</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Что и кому сдают, рабочие чаты, сроки ответа скупщиков и колл-центра</td><td>Уточнить в беседе</td></tr>\n<tr><td>Обходные пути</td><td>Полный перечень работы вне АРМ</td><td>Описано четыре случая (см. ниже); целенаправленный поиск тетрадей и таблиц в записях не отражён</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения, фотографии, параметры стола для съёмки</td><td>Уточнить размер, место и количество</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Скупка техники идёт через три системы</h4>\n<p>Цену предложения ищут на Авито (клиенту предлагают 70 %), сделку согласовывают скупщики в Битриксе, подтверждение номера и оформление — в АРМ. На одну сделку сотрудник переключается минимум между тремя системами, а сведения о товаре, вероятно, вводятся дважды — в Битрикс и в АРМ. Время ожидания согласования не замерено. Кандидат в реестр идей: оценка и согласование скупки внутри АРМ.</p>\n<h4>2. Бонусы при продаже начисляет колл-центр по отдельной задаче</h4>\n<p>При розничной продаже бонусы не начисляются при закрытии чека: сотрудник сразу создаёт задачу в Битриксе, чтобы колл-центр начислил их клиенту. В записях отмечены «заморочки с бонусами» и изменение условий: «10% уже не 5000 а 8000» — вероятно, изменился порог; смысл требует уточнения. Последствия — лишняя задача на каждую продажу с бонусами и отложенное начисление для клиента.</p>\n<h4>3. Оперативная касса уходит в минус, ордера печатают вечером</h4>\n<p>У многих клиентов скупки нет карты, расчёт идёт наличными через ПКО и РКО. Оперативная касса уходит в минус, её пополняют и оприходуют; ПКО и РКО печатают вечером, пакетом. Записано расхождение в копейках: «был минус 40,60 в расходник на 60 коп». Порядок работы с минусовой кассой и допустимость вечерней печати нужно сверить с кассовой дисциплиной.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Ищут цену аналога на Авито и считают 70 % вручную</td><td>Причина не указана; по записям, рыночная оценка техники в АРМ не выполняется</td><td>Работа вне системы; основание цены предложения в АРМ не фиксируется</td></tr>\n<tr><td>Согласовывают скупку со скупщиками в Битриксе</td><td>Согласование не встроено в АРМ (по записям)</td><td>Переключение систем, ожидание ответа, вероятный повторный ввод</td></tr>\n<tr><td>Создают задачу в Битриксе колл-центру на начисление бонусов</td><td>Бонусы не начисляются при закрытии чека в АРМ</td><td>Лишняя задача на продажу, отложенное начисление, риск забыть</td></tr>\n<tr><td>Допускают минус оперативной кассы и пополняют её потом; ордера печатают вечером</td><td>Причина не указана; вероятно, наличных не хватает в момент выплаты</td><td>Риск расхождений (записан пример в копейках); документы оформляются не в момент операции</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> четыре случая по записям визита; со слов сотрудников или по наблюдению — не указано. Целенаправленный поиск тетрадей, таблиц и самодельных шаблонов в записях не отражён.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Скупка техники</td><td>Не замерено</td><td>Поиск на Авито, ожидание согласования скупщиков в Битриксе</td><td>Время от обращения клиента до выплаты, в том числе ожидание согласования</td></tr>\n<tr><td>Розничная продажа с бонусами</td><td>Не замерено</td><td>Создание дисконтной карты, задача колл-центру</td><td>Время на карту и задачу; срок начисления бонусов колл-центром</td></tr>\n<tr><td>Работа с оперативной кассой</td><td>Не замерено</td><td>Минус кассы, пополнение, оприходование, вечерняя печать ПКО и РКО</td><td>Частота минуса за смену, время на пополнение и вечернюю печать</td></tr>\n<tr><td>Перевод товара из розницы в «Смарт»</td><td>Не замерено</td><td>Нет сведений</td><td>Частота и длительность операции</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций пока не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Два факта требуют проверки.</p>\n<table><thead><tr><th>Требование и источник</th><th>Что происходит фактически</th><th>Статус проверки</th></tr></thead><tbody>\n<tr><td>Порядок ведения оперативной кассы и оформления ПКО и РКО — документ и пункт уточнить</td><td>Касса уходит в минус с последующим пополнением; ПКО и РКО печатают вечером, а не в момент операции</td><td>Требует проверки</td></tr>\n<tr><td>Правила бонусной программы — документ, редакция и пункт уточнить</td><td>Бонусы начисляет колл-центр по задаче в Битриксе; записано изменение условий «10% уже не 5000 а 8000»</td><td>Требует проверки</td></tr>\n</tbody></table>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Стол для фотосъёмки товара для Авито; место не указано</td><td>Дополнительное оснащение</td><td>Размеры, место установки, количество; нужны ли фон и освещение</td><td>Не приложено</td></tr>\n</tbody></table>\n<p>Дефекты помещения, мебели и техники в записях не отмечены.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> записи по ходу визита, переданы 09.09.2026; реквизиты ОП — по карте объездов ОП.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Для базы знаний пригодятся обезличенные образцы ПКО и РКО, товарного чека, экраны каталогов «Смарт» и «Смарт новый», пример задачи колл-центру на начисление бонусов.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Все действия пока только предложены; задачи не создавались, в реестры ничего не переносилось.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Скупка техники и розничная продажа — по этапам</td><td>Замеров, должностей, порядка согласования скупщиками</td><td>Предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Оценка и согласование скупки в АРМ; начисление бонусов при закрытии чека без задачи колл-центру; единый каталог вместо «Смарт» и «Смарт новый»</td><td>Подтверждения у сотрудников, частоты, формулировки</td><td>Предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Работа с каталогами «Смарт» и «Смарт новый», создание дисконтной карты, бонусы, перевод из розницы в «Смарт»</td><td>Экранов, пошагового показа</td><td>Предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Минус оперативной кассы и расхождение «40,60 / 60 коп»; изменение условий бонусов «5000 → 8000»</td><td>Смысла записей, примеров операций</td><td>Предложено</td></tr>\n<tr><td>Ответственный за помещение / оснащение</td><td>Стол для фотосъёмки товара для Авито</td><td>Размеров, места, количества</td><td>Предложено</td></tr>\n<tr><td>Задача в Битрикс</td><td>Срочных, ломающих работу сбоев в записях нет</td><td>—</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> большая часть открытых вопросов уточняется дистанционно: время визита, смысл записей о кассе и бонусах, порядок согласования со скупщиками, параметры стола. Повторный визит нужен, если потребуется замерить время скупки и розничной продажи или посмотреть закрытие дня с печатью ПКО и РКО.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-142 «Иремель», 09.09.2026, Чусовитина Аделина Эриковна, руководитель отдела бизнес-анализа.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по карте объездов; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: что наблюдали, что показали, что рассказали.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — уточнить параметры стола.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>09.09.2026</dd><dt>Аналитик</dt><dd>Чусовитина Аделина Эриковна</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Продолжительность</dt><dd>Не указано</dd><dt>С кем работали, должности</dt><dd>Не указано. В записях упомянуты скупщики (согласование в Битриксе) и колл-центр (начисление бонусов)</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений; супервайзер ОП — Камаров А.А.</dd><dt>Группа / дивизион</dt><dd>Группа «Юг», дивизион 6</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Скупка техники идёт через три системы</b><span>Цену предложения ищут на Авито (клиенту предлагают 70 %), сделку согласовывают скупщики в Битриксе, подтверждение номера и оформление — в АРМ. На одну сделку сотрудник переключается минимум между тремя системами, а…</span></li><li><b>Бонусы при продаже начисляет колл-центр по отдельной задаче</b><span>При розничной продаже бонусы не начисляются при закрытии чека: сотрудник сразу создаёт задачу в Битриксе, чтобы колл-центр начислил их клиенту. В записях отмечены «заморочки с бонусами» и изменение условий: «10% уже не…</span></li><li><b>Оперативная касса уходит в минус, ордера печатают вечером</b><span>У многих клиентов скупки нет карты, расчёт идёт наличными через ПКО и РКО. Оперативная касса уходит в минус, её пополняют и оприходуют; ПКО и РКО печатают вечером, пакетом. Записано расхождение в копейках: «был минус…</span></li></ol>\n<h2>Потери времени</h2><ul><li>Скупка техники</li><li>Розничная продажа с бонусами</li><li>Работа с оперативной кассой</li><li>Перевод товара из розницы в «Смарт»</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Стол для фотосъёмки товара для Авито; место не указано</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>База знаний АРМ</li><li>Бэклог аналитиков / техническая поддержка</li><li>Ответственный за помещение / оснащение</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-53", "num": "53", "name": "Г. Горбатова", "addr": "г. Уфа, ул. Менделеева, д. 175/2", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — ул. Менделеева", "d": "6", "lat": 54.7197171, "lon": 56.0065046, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Абдуллин Венер Фаритович", "date": "16.09.2026", "src": "отчёт"}], "reports": [{"date": "16.09.2026", "author": "Абдуллин Венер Фаритович", "file": "Отчёт — объезд ОП 053-Генерала Горбатова (16.09.2026).md", "title": "Отчёт об объезде ОП — 053-Генерала Горбатова (16.09.2026)", "html": "<h2>Отчёт об объезде ОП — 053-Генерала Горбатова (16.09.2026)</h2>\n<p>&gt; [!abstract] Кратко &gt; Визит 40 минут, формат — разговор с товароведом на рабочем месте, осмотр помещения, попутно наблюдалась одна операция (погашение процентов с округлением суммы). Главное по помещению: <strong>ОП, по словам сотрудника, ни разу не ремонтировался</strong> — бетонный пол, отопление почти не греет (зимой смену открывают в куртке, персонал болел всю зиму), окон и вентиляции нет, техника от нехватки места стоит на полу, тараканы. Главное по системе: <strong>сбой ПЭП блокирует выкуп</strong> без возможности перейти на бумажный договор, <strong>ложные срабатывания проверки по «террористическим» спискам</strong> на постоянных клиентах при разрешённом продолжении операции, потеря заполненных данных при прерывании оформления, и отсутствие обучения по оценке техники — товаровед учится «методом тыка» и опирается на чат оценки.</p>\n<p>&gt; [!note] Соблюдение красных линий &gt; Персональные данные клиентов не фотографировались и не выписывались. Обслуживание клиента не прерывалось — во время оплаты процентов наблюдал со стороны. Оценок сотруднику не давалось, обещаний по ремонту и автоматизации не давалось (прямо сказано, что переезд — это сметы и затраты, решение не на уровне аналитика).</p>\n<hr>\n<h3>1. Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП (номер и название)</td><td>053-Генерала Горбатова</td></tr>\n<tr><td>Адрес</td><td>не зафиксирован в ходе визита (ориентир со слов — рядом «Магнит», по соседству освободилось помещение)</td></tr>\n<tr><td>Группа / дивизион</td><td>не зафиксировано</td></tr>\n<tr><td>Дата визита</td><td>16.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Абдуллин Венер Фаритович</td></tr>\n<tr><td>Время: приехал / уехал</td><td>9:00 / 9:40 (всего 0,7 ч)</td></tr>\n<tr><td>Кто был на смене</td><td>[товаровед] — товаровед</td></tr>\n<tr><td>Супервайзер</td><td>[товаровед]</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>не зафиксировано</td></tr>\n</tbody></table>\n<hr>\n<h3>2. Что делал на ОП (по порядку)</h3>\n<p>— Осмотрел помещение вместе с товароведом: пол, отопление, отсутствие окон и вентиляции, состояние стен, зону хранения принятой техники. — Разобрал, что было сделано в субботний выезд хозслужбы: вымыт короб под ногами, заменена перегоревшая лампа, удлинитель поднят с пола (лежал у вёдер). Со слов товароведа — больше ничего. — Провёл разговор по блоку §8 методички: где теряется время, что ломается, что неудобно в АРМ и в поддержке. — Показал новую AI-систему (режим поддержки с созданием тикета и режим личного ассистента с базой знаний СКС-ломбарда), сравнил с текущим Аркадием по жалобе товароведа. — Разобрал проблему сбоя ПЭП при выкупе и запрос на переход с электронного договора на бумажный. — Разобрал ложные срабатывания проверки клиентов по спискам и порядок действий сотрудника в этом случае. — Разобрал лимит позиций в договоре (электронный — 9 позиций) и практику предложения электронного договора клиенту. — Осмотрел зону приёма техники: полки, техника на полу, показанные товароведом примеры принятых вещей (перфораторы, мелкая техника). — Наблюдал обслуживание клиента: погашение процентов, товаровед округляла сумму в пользу клиента, чтобы не работать с копейками. — Обсудил порядок оценки сложной техники: чат оценки, согласование, обращение в ССБ по подозрительной дорогой позиции, роль КМТ-отдела. — Выслушал предложение товароведа о переезде в освободившееся соседнее помещение; пояснил, что это уровень смет и затрат, обещаний не давал.</p>\n<hr>\n<h3>3. Что изучил</h3>\n<p>— <strong>Условия работы на ОП.</strong> Помещение, по словам товароведа, никогда не ремонтировалось. Бетонный/каменный пол, отопительный прибор есть, но греет слабо: при −30 на улице требуется полдня прогрева, смена открывается в верхней одежде, зимой персонал болел циклично. Окон нет, вентиляции нет — летом дверь держат открытой ради воздуха. Кондиционер рабочий, но включают дозированно: сотрудники от него простывают. В стенах дырки, со слов обещали закрыть (источник обещания в разговоре назван неуверенно). Понял: это не «косметика», а фактор здоровья персонала и восприятия точки клиентами — со слов, посетители сравнивают интерьер с больницей из-за голого камня. — <strong>Нехватка места под принятую технику.</strong> Точка маленькая, оборот высокий. Техника стоит на полу, утром приходится идти по проходу «чтобы не уронить»; недавно добавили полки — стало немного легче. Есть постоянный клиент, который разово приносит 10–11 позиций (перфораторы, шуруповёрты, тепловая пушка), после чего полка занята целиком; закладывает и всегда выкупает, от хранения отказывается — ему важен сам процесс. Понял: пиковая загрузка хранения определяется единичными клиентами, а не средним потоком; полок под это нет. — <strong>Сбой ПЭП блокирует выкуп.</strong> Когда ПЭП не работает, клиент не может выкупить вещь, а перейти с электронного договора на бумажный в этот момент нельзя. Со слов, об этом уже писали. Ситуация повторяется, клиенты возмущаются, у сотрудника нет никакого действия в ответ. <strong>Самое острое системное ограничение визита.</strong> — <strong>Ложные срабатывания проверки по спискам.</strong> У постоянных, ранее многократно обслуживавшихся клиентов стал появляться признак причастности к террористической деятельности; частота выросла. Система при этом позволяет продолжить операцию, СБ по запросам подтверждает, что всё чисто. Прямой вопрос сотрудника: «а если он реально террорист, а я продолжу операцию?» Понял: проверка даёт шум, ответственность де-факто переложена на товароведа, регламентного действия при срабатывании сотрудник не знает. — <strong>Потеря введённых данных при прерывании оформления.</strong> Если оформление прервано, приходится заполнять заново; перенести спецификации из предыдущего договора нельзя, копирования состава позиций нет. — <strong>Лимит позиций в договоре.</strong> В электронный договор входит 9 позиций (по памяти сотрудника: было 7, затем увеличили до 9). Практика: если позиций больше четырёх (например, серьги делятся на позиции), товаровед сама предлагает клиенту электронный договор, чтобы не делить сделку на два. Девять позиций считает достаточным. — <strong>Аркадий и новая AI-система.</strong> Аркадий не нравится: чтобы создать задачу, нужно ответить на слишком много вопросов. Новую систему воспринимает с интересом; уточняла, куда именно писать. Понял: ключевой критерий принятия для сотрудника — количество шагов до созданной задачи, а не «умность» ассистента. — <strong>Устойчивость АРМ и периферии.</strong> Оценки в разговоре противоречивы: сначала «программа зависает, бывает очень часто», затем при уточнении — «ничего не зависает, всё работает». Стабильно повторяющаяся жалоба — <strong>периферия</strong>: постоянно отваливается, регулярно приходится ставить задачи. Отдельно: если не вышел чек — ставят задачу; редкие сбои ПК решают ИТ. Требует проверки на повторном визите: что именно и как часто зависает. — <strong>Приёмка и оценка техники.</strong> Технику включают и проверяют. После случая с перфоратором, из которого при включении высыпался цемент, грязную технику товаровед просит включать самого клиента. Незнакомые модели осваивают методом тыка, иногда с подсказками клиента. Обучения по технике не было — «сами учимся». По оценке опираются на чат оценки и согласования; ориентиры известны наизусть: разбитый экран Android — 300–400 ₽, наушники — 200–300 ₽, неоригинальные Apple — 300 ₽. Вещи стоимостью от 50 ₽ обязаны принимать, отказать нельзя. — <strong>Сложная дорогая техника — зона риска.</strong> Пример: фотокамера Canon, на площадке ~100 000 ₽, в скупку предлагалась за 50 000 ₽; клиент по виду не соответствовал владельцу такой вещи. Товаровед созвонилась с ССБ, от сделки отказались — сомнения в оригинальности и невозможность корректно оценить. Понял: по дорогой и редкой технике решение держится на личной осторожности сотрудника и телефонных консультациях; нужен быстрый канал к экспертам КМТ с фиксацией решения. — <strong>Наблюдённая операция.</strong> Погашение процентов: сумма округляется сотрудником в пользу клиента, чтобы избежать копеек. Требует проверки: это личная практика или общепринятая, и как она отражается в системе.</p>\n<hr>\n<h3>4. Что не успел посмотреть (и почему)</h3>\n<p>— Полный прогон §5 методички: залог от оценки до выдачи денег, скупка/комиссия, продление, выкуп, невыкуп и реализация, продажа в зале, Авито и площадки, возврат, перемещение между ОП. <strong>Причина:</strong> 40 минут визита, наблюдалась только одна короткая операция. — Хронометраж операций — не снимался ни по одной операции. — Касса и деньги: открытие/закрытие смены, эквайринг, инкассация, расхождения. Не затрагивалось. — Товар и хранение: маркировка и бирки, поиск конкретной вещи на хранении, витрины и ценники, инвентаризация, метки КМТ/КМЗ. Осмотрена только зона складирования техники. — Отчётность и коммуникации: что сдаёт сотрудник, кому и в каком виде, число рабочих чатов, табель и график. Не затрагивалось (упомянут только чат оценки). — §4 методички: сколько программ и окон АРМ держит сотрудник параллельно, под какой учётной записью работает — не проверялось. — Клиентский поток по §3: количество клиентов за час, структура операций, что происходит при двух и более клиентах — наблюдений недостаточно. — Тетради, личные таблицы, шпаргалки у монитора — целенаправленно не искались.</p>\n<hr>\n<h3>5. Три главных наблюдения</h3>\n<ol>\n<li><strong>Условия помещения — на грани пригодности для круглогодичной работы.</strong> Нет ремонта за всё время существования точки, бетонный пол, неработающее по факту отопление, отсутствие окон и вентиляции, дырки в стенах, тараканы. Зимний сценарий — открытие смены в куртке и полдня прогрева; итог прошлой зимы — циклическая заболеваемость персонала. При этом точка, по словам сотрудника, показывает хорошие результаты и держится на постоянных клиентах, а рядом освободилось помещение — вопрос переезда уже поднимался перед супервайзером.</li>\n<li><strong>Сбой ПЭП полностью блокирует выкуп, обходного пути нет.</strong> Переход с электронного договора на бумажный в момент выкупа не предусмотрен; сотрудник остаётся один на один с клиентом без единого доступного действия. Запрос от ОП уже направлялся ранее — то есть проблема известна и не закрыта.</li>\n<li><strong>Проверка клиентов по спискам генерирует шум и перекладывает риск на товароведа.</strong> Признак причастности к терроризму всплывает у постоянных проверенных клиентов, частота растёт, система разрешает продолжить операцию, а решение фактически принимает сотрудник на ОП. Нужно либо объяснимое правило действий, либо разбор качества источника данных.</li>\n</ol>\n<hr>\n<h3>6. Обходные пути (что делают мимо системы и почему)</h3>\n<p>— <strong>Клиент сам включает грязную технику при приёмке</strong> — личное правило сотрудника после случая с высыпавшимся цементом; в регламенте приёмки такого шага нет. — <strong>Освоение незнакомой техники методом тыка и по подсказкам клиента</strong> — обучения по технике не проводилось, инструкции под рукой нет. — <strong>Оценка по «выученным» суммам</strong> (разбитый экран, наушники, неоригинальные Apple) — ориентиры держатся в голове сотрудника, а не в справочнике системы. — <strong>Оценка дорогой/сомнительной техники по телефону</strong> — звонок в ССБ и обсуждение в чате оценки; решение и его основание нигде не фиксируются как прецедент. — <strong>Округление суммы процентов вручную</strong>, чтобы не иметь дела с копейками. — <strong>Проактивное предложение электронного договора клиенту</strong> при количестве позиций больше четырёх — чтобы не делить сделку на два договора.</p>\n<p>Найдено обходных путей: <strong>6</strong> (целенаправленный поиск тетрадей и личных таблиц не проводился).</p>\n<hr>\n<h3>7. Потери времени (операция → сколько → из-за чего)</h3>\n<table><thead><tr><th>Операция</th><th>Потеря</th><th>Из-за чего</th></tr></thead><tbody>\n<tr><td>Выкуп при недоступном ПЭП</td><td>операция не завершается вовсе</td><td>нет перехода с электронного договора на бумажный; клиент уходит без вещи</td></tr>\n<tr><td>Оформление залога</td><td>повторный ввод с нуля</td><td>при прерывании данные не сохраняются, спецификации из прошлого договора не копируются</td></tr>\n<tr><td>Оформление многопозиционных залогов</td><td>доп. действия</td><td>лимит позиций в договоре; при большом количестве позиций — деление на два договора</td></tr>\n<tr><td>Создание задачи через Аркадия</td><td>не замерялось</td><td>много уточняющих вопросов до момента регистрации задачи</td></tr>\n<tr><td>Работа периферии</td><td>не замерялось, «постоянно»</td><td>периферия отваливается, приходится ставить задачи</td></tr>\n<tr><td>Приём незнакомой техники</td><td>не замерялось</td><td>нет обучения и инструкций, разбор модели на месте</td></tr>\n<tr><td>Оценка дорогой/сложной техники</td><td>не замерялось</td><td>согласование через чат и звонки в ССБ/КМТ</td></tr>\n<tr><td>Зимний запуск смены</td><td>до половины дня дискомфорта</td><td>прогрев помещения, работа в верхней одежде</td></tr>\n</tbody></table>\n<p>&gt; Замеров нет: операции не хронометрировались. Все строки требуют подтверждения на повторном визите.</p>\n<hr>\n<h3>8. Расхождения с тем, как должно быть по регламенту</h3>\n<p>— <strong>Действия при срабатывании проверки по спискам.</strong> Система позволяет продолжить операцию, сотрудник не знает предписанного порядка и принимает решение сам. Требуется свериться с регламентом и довести правило до ОП. — <strong>Обучение по приёму и проверке техники.</strong> Со слов, обучения не было; фактическая практика приёмки (включение техники клиентом, разбор модели на месте) сформирована самостоятельно. Требуется сверка с действующими требованиями к приёмке. — <strong>Округление суммы процентов вручную.</strong> Требует проверки: допускается ли регламентом и как отражается в системе. — Прочие расхождения не проверялись — операции вживую не наблюдались.</p>\n<hr>\n<h3>9. Требует ремонта / замены</h3>\n<p>Перечень составлен по осмотру и разговору. <strong>Фото к отчёту не приложены</strong> — при раскладке папки <code>Объезд по ОП/053-Генерала Горбатова/</code> проставить номера кадров (общий план + крупный кадр дефекта, без клиентов, документов и экранов с ПДн).</p>\n<table><thead><tr><th>№</th><th>Что и где</th><th>Суть</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>1</td><td>Отопление, рабочая зона</td><td>прибор греет слабо, помещение не прогревается, зимой работа в верхней одежде</td><td></td></tr>\n<tr><td>2</td><td>Пол, всё помещение</td><td>голый бетон/камень, холод от пола, восприятие клиентами «как в больнице»</td><td></td></tr>\n<tr><td>3</td><td>Вентиляция</td><td>отсутствует, воздуха нет, летом работают с открытой дверью</td><td></td></tr>\n<tr><td>4</td><td>Стены</td><td>дырки в стенах, ремонт не проводился ни разу</td><td></td></tr>\n<tr><td>5</td><td>Отделка в целом</td><td>отсутствие ремонта за всё время работы ОП</td><td></td></tr>\n<tr><td>6</td><td>Зона хранения техники</td><td>не хватает полок, принятая техника стоит на полу в проходе</td><td></td></tr>\n<tr><td>7</td><td>Санитарное состояние</td><td>тараканы (со слов — приносят с техникой, рядом травят в соседнем магазине)</td><td></td></tr>\n<tr><td>8</td><td>Электрика</td><td>удлинитель лежал на полу у вёдер, поднят в субботний выезд — проверить схему подключения и количество розеток</td><td></td></tr>\n<tr><td>9</td><td>Освещение</td><td>перегоревшая лампа заменена в субботу — проверить остальные светильники</td><td></td></tr>\n<tr><td>10</td><td>Периферийное оборудование</td><td>регулярно отваливается, задачи ставятся постоянно — нужна диагностика подключения/замена</td><td></td></tr>\n</tbody></table>\n<hr>\n<h3>10. Артефакты</h3>\n<p>— Пустые бланки договора и спецификации — <strong>не взяты</strong>, взять на повторном визите. — Список «выученных» ориентиров оценки (разбитый экран, наушники, неоригинальные Apple) — записан со слов, не является документом; сверить с действующими тарифами и мораторием.</p>\n<hr>\n<h3>11. Куда это идёт дальше</h3>\n<ul>\n<li>[x] <strong>реестр процессов</strong> — выкуп при недоступном ПЭП; приёмка и проверка техники; оценка сложной/дорогой техники через чат и ССБ; обработка срабатывания по спискам.</li>\n<li>[x] <strong>реестр идей CRM</strong> — предложение № ___ (переход с электронного договора на бумажный при сбое ПЭП); предложение № ___ (сохранение черновика оформления и копирование спецификаций из предыдущего договора); предложение № ___ (сокращение шагов до создания задачи в поддержке); предложение № ___ (справочник ориентировочных оценок типовых позиций в АРМ вместо памяти сотрудника).</li>\n<li>[x] <strong>база знаний АРМ</strong> — раздел «Проверка клиентов: срабатывания и действия сотрудника»; раздел «Приёмка техники: порядок проверки и типовые случаи».</li>\n<li>[x] <strong>бэклог для аналитиков</strong> — проверить: (1) почему растёт число ложных срабатываний по спискам и каков предписанный порядок действий; (2) фактический лимит позиций в электронном и бумажном договоре; (3) допустимость ручного округления процентов; (4) есть ли программа обучения по технике для товароведов и почему она не дошла до ОП.</li>\n<li>[x] <strong>задача в Битрикс</strong> — хозяйственный перечень §9 передать супервайзеру ([товаровед] А.); отдельно поднять вопрос отопления как влияющий на здоровье персонала, и вопрос полок под хранение техники.</li>\n<li>[x] <strong>на уровень выше аналитика</strong> — предложение ОП о переезде в освободившееся соседнее помещение: точка результативная, но помещение непригодно; решение требует сметы и не принимается на уровне визита.</li>\n</ul>\n<hr>\n<h3>12. Нужен повторный визит</h3>\n<p><strong>Да.</strong> За 40 минут наблюдалась одна операция, хронометража нет, касса, хранение, витрины, отчётность и рабочие артефакты не смотрелись. Задачи повторного визита:</p>\n<ol>\n<li>Наблюдать залог, выкуп и погашение процентов целиком, с подсчётом шагов и замером времени.</li>\n<li>Прояснить противоречие по зависаниям АРМ: что именно, как часто, на каком шаге.</li>\n<li>Зафиксировать реальный случай сбоя ПЭП и действия сотрудника (или собрать по журналу задач).</li>\n<li>Пройти §6 методички: касса, маркировка, поиск вещи на хранении, инвентаризация, метки КМТ/КМЗ.</li>\n<li>Найти и снять шпаргалки, тетради и личные таблицы, по каждой спросить «почему не в программе?».</li>\n<li>Взять пустые бланки договора и спецификации.</li>\n<li>Проверить, что из перечня §9 выполнено после субботнего выезда хозслужбы.</li>\n</ol>\n<hr>\n<h3>Приложение. Что повторяется с ОП 039-Галле (15.09.2026)</h3>\n<p>Два ОП подряд дали одни и те же темы — это уже не единичные жалобы, а кандидаты в системные проблемы:</p>\n<table><thead><tr><th>Тема</th><th>039-Галле</th><th>053-Генерала Горбатова</th></tr></thead><tbody>\n<tr><td>Сбой ПЭП блокирует операцию</td><td>ожидание СМС, чужой телефон, спам; уход на бумагу</td><td>ПЭП не работает → выкуп невозможен, ухода на бумагу нет</td></tr>\n<tr><td>Лимит позиций в договоре</td><td>со слов, 4 позиции в бумажный</td><td>9 позиций в электронный, бумажный меньше; электронный предлагают сами</td></tr>\n<tr><td>Поддержка: Аркадий → AI-система</td><td>непонятно, кто увидит тикет и где он создаётся</td><td>слишком много вопросов до создания задачи</td></tr>\n<tr><td>Ремонт и хозконтур</td><td>ремонт сделан, но заявленное не выполнено; приёмки нет</td><td>ремонта не было никогда; выезд закрыл только мелочи, «что хотите — вам не сделают»</td></tr>\n<tr><td>Тараканы и санитария</td><td>есть</td><td>есть</td></tr>\n<tr><td>Хранение и место</td><td>вещи некуда ставить после демонтажа шкафа</td><td>техника на полу, полок не хватает</td></tr>\n<tr><td>Видимость/размещение точки</td><td>вывеску закрывает лестница, флаг порван</td><td>помещение непригодно, рядом освободилось другое</td></tr>\n</tbody></table>\n<p>Рекомендация: по ПЭП и по лимиту позиций не ждать конца объезда — выносить в реестр идей CRM уже сейчас, с пометкой «подтверждено на 2 из 2 посещённых ОП».</p>\n<hr>\n<h3>Связанные материалы</h3>\n<ul>\n<li>[[Чек-лист — объезд ОП аналитиком (1.0)]] — методика, по которой проведён визит.</li>\n<li>[[Отчёт — объезд ОП 039-Галле (15.09.2026)]] — предыдущий визит, пересечения см. в приложении.</li>\n<li>[[Методичка — фото рабочего дня (1.0)]] — формат повторного визита.</li>\n<li>Таблица <code>Объезд ОП — учёт.xlsx</code> — проставить дату посещения по ОП 053.</li>\n</ul>", "brief": "<p>Краткую справку собрать не удалось — откройте полный текст.</p>"}]}, {"op": "ОП-32", "num": "32", "name": "Новостройка", "addr": "г.Уфа, Менделеева,207", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — ул. Менделеева", "d": "5", "lat": 54.7434831, "lon": 56.0257089, "tv": [], "st": "", "flags": ["КМЗ"], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-157", "num": "157", "name": "Эвридей", "addr": "г.Уфа, ул. Менделеева, 229/1", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — ул. Менделеева", "d": "6", "lat": 54.7532093, "lon": 56.0299325, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-144", "num": "144", "name": "Ай", "addr": "г. Уфа, ул. Айская, д. 70", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — центр", "d": "5", "lat": 54.7323208, "lon": 55.9795912, "tv": [], "st": "", "flags": [], "note": "Увольнение с 01.09", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Пронин Артем Вадимович", "date": "16.09.2026", "src": "отчёт"}], "reports": [{"date": "16.09.2026", "author": "Пронин Артем Вадимович", "file": "Отчёт — 16.09.2026 — Пронин А.В. — ОП-144.md", "title": "Отчёт об объезде ОП-144 «Ай»", "html": "<h2>Отчёт об объезде ОП-144 «Ай»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП аналитиком Чусовитиной А.Э. (версия 1.0 от 07.09.2026) и шаблону «Отчёт об объезде ОП». Основания: наблюдение выдачи займа под залог техники, оплаты процентов по прежнему ЗБ и смены номера телефона, беседа с товароведом. Связанный полевой лист — [[АНКЕТА объезда ОП — одна страница]].</p>\n<p>&gt; [!info] Границы сведений &gt; На визите наблюдались оформление займа под шуруповёрт, оплата процентов по прежнему ЗБ и реальная смена номера телефона. Сначала клиенту выдали всю сумму нового займа наличными, затем приняли от него сумму для погашения процентов. Предложения по интерфейсу описаны отдельно от действующей работы. Продолжительность визита — 40 минут; ожидание оценки — около 3 минут по оценке аналитика, остальные этапы отдельно не измерялись.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-144 «Ай»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Айская, д. 70</td></tr>\n<tr><td>Группа / дивизион</td><td>Не указано</td></tr>\n<tr><td>Дата визита</td><td>16.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Пронин Артём Вадимович</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>С 09:05 до 09:45</td></tr>\n<tr><td>Продолжительность</td><td>40 минут</td></tr>\n<tr><td>С кем работали, должности</td><td>[товаровед], товаровед. На ОП также присутствовал Камаров Антон, супервайзер</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да. Также предупреждены отдел безопасности и видеонаблюдения</td></tr>\n<tr><td>Клиентский поток во время визита</td><td>Не менее трёх посетителей: клиент с шуруповёртом, оплативший проценты по прежнему ЗБ, и ещё два человека, принёсшие бижутерию, которую считали золотом. Наличие очереди не зафиксировано</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Обсудили неудобство расчёта задолженности и переключения между несколькими залоговыми билетами в интерфейсе «Операции по договору». Совместно предложили добавить два столбца задолженности в общую таблицу ЗБ рабочего стола «Ломбард».</li>\n<li>Наблюдали оформление займа под шуруповёрт: приём, проверку и фотоконтроль техники, согласование оценки в Битрикс24, заполнение ЗБ, подписание ПЭП, печать чека и выдачу средств.</li>\n<li>При оформлении нового займа товаровед вручную проверила наличие прежнего ЗБ и предложила клиенту погасить проценты по нему из суммы выдачи. Клиент согласился; после нового займа провели оплату процентов по старому ЗБ. Обсудили предложение показывать состояние займов клиента при оформлении нового билета.</li>\n<li>Наблюдали смену номера телефона через процесс «Оформить соглашение ЭП», включая подтверждение номера, подписание бумажного соглашения ПЭП и загрузку его фотографии с телефона по QR-коду.</li>\n<li>Осмотрели ОП: чисто и опрятно, тараканов не замечено. Зафиксировали потребность в шторке на стеллаж для защиты техники от пыли.</li>\n</ol>\n<p>Также во время визита приходили два человека с бижутерией, которую принимали за золото. Подробности проверки изделий и завершения этих обращений не зафиксированы.</p>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Расчёт по нескольким ЗБ</td><td>Беседа и совместное обсуждение предложения</td><td>Товаровед отмечает неудобство просмотра сумм через отдельные билеты; предложены столбцы общей задолженности и задолженности по процентам в списке ЗБ</td></tr>\n<tr><td>Выдача займа под технику</td><td>Наблюдение реальной операции</td><td>Прослежен путь от обращения с шуруповёртом до ПЭП, чека и выдачи суммы</td></tr>\n<tr><td>Согласование оценки</td><td>Наблюдение работы с телефоном, Битрикс24 и АРМ</td><td>В чат направляют фото, сведения о комплекте, рабочем состоянии и внешнем виде; эти сведения затем повторно вносят в АРМ. Ответ ожидали около 3 минут, продолжая заполнение ЗБ</td></tr>\n<tr><td>Прежние займы клиента</td><td>Наблюдение и предложение товароведа</td><td>Сотрудник вручную проверила наличие прежнего ЗБ и предложила оплатить проценты; клиент согласился. Предложено показывать состояние займов при создании нового ЗБ</td></tr>\n<tr><td>Оплата процентов по старому ЗБ</td><td>Наблюдение продолжения обслуживания</td><td>После выдачи всей суммы нового займа наличными приняли от клиента деньги на проценты. Путь: «Операция с договором» → «Перезалог» → «Наличная оплата» → «Провести» → принятие денег → печать чека</td></tr>\n<tr><td>Смена номера телефона</td><td>Наблюдение реальной операции</td><td>Используют «Оформить соглашение ЭП», ОТП для нового номера, печать и подпись соглашения ПЭП, его фотографирование и загрузку с телефона по QR АРМ</td></tr>\n<tr><td>Дополнительные обращения</td><td>Наблюдение, уточнённое аналитиком</td><td>Два человека принесли бижутерию, считая её золотом. Способ проверки и дальнейшее оформление не описаны</td></tr>\n<tr><td>Товар и помещение</td><td>Наблюдение и визуальный осмотр</td><td>К технике приложили распечатанную из АРМ спецификацию и убрали её на обозначенный стеллаж для техники. В ОП чисто и опрятно; стеллажу нужна шторка от пыли</td></tr>\n</tbody></table>\n<h4>1. Выдача займа под залог техники и оплата процентов по прежнему билету</h4>\n<p><strong>Границы изучения:</strong> обращение клиента с шуруповёртом → оформление и выдача нового займа → оплата процентов по прежнему ЗБ; также наблюдалось размещение принятой техники со спецификацией на стеллаже. Способ упаковки не описан.</p>\n<p><strong>Кто выполняет:</strong> товаровед, клиент и участник чата Битрикс24, подтверждающий оценку; его должность не указана.</p>\n<p><strong>Где выполняет:</strong> АРМ, залоговый билет и «Операции по договору»; телефон для фото и чата Битрикс24; специальное окно приёма техники; место проверки; принтер.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Обращение и паспорт</td><td>Клиент сообщает о желании заложить шуруповёрт. Товаровед запрашивает паспорт и начинает оформление ЗБ в АРМ</td><td>Время поиска и заполнения данных не измерялось</td></tr>\n<tr><td>2. Приём и проверка</td><td>Технику принимают через специальное окно, осматривают, проверяют и выполняют фотоконтроль</td><td>Конкретный состав проверки и комплектность не зафиксированы</td></tr>\n<tr><td>3. Запрос оценки</td><td>С телефона в отдельный чат Битрикс24 направляют фото, сведения о комплекте, подтверждение рабочего состояния и описание внешнего вида</td><td>Ответ ожидали около 3 минут; эти сведения затем повторно вносили в номенклатуру ЗБ</td></tr>\n<tr><td>4. Заполнение во время согласования</td><td>Пока ожидается подтверждение суммы, товаровед продолжает заполнять ЗБ в АРМ</td><td>Часть ожидания совмещается с оформлением; весь интервал нельзя считать простоем</td></tr>\n<tr><td>5. Согласие на сумму</td><td>После ответа в чате товаровед озвучивает сумму займа клиенту; клиент соглашается</td><td>Замеры согласования не проводились</td></tr>\n<tr><td>6. Прежний ЗБ</td><td>Параллельно товаровед вручную проверяет займы клиента, находит прежний ЗБ и предлагает погасить по нему проценты из средств нового займа. Клиент соглашается</td><td>Для проверки состояния прежних займов требуются отдельные действия</td></tr>\n<tr><td>7. Завершение ЗБ</td><td>Заполняют и сверяют данные клиента, включая ФИО и номер; номенклатуру: вид «Ломбард техника», тип «Дрели Шуруповерты» по описанию аналитика; вводят сумму и повторно подтверждают её с клиентом</td><td>Повторно вносят сведения о комплекте, рабочем состоянии и внешнем виде техники</td></tr>\n<tr><td>8. Проведение и ПЭП</td><td>ЗБ проводят. Клиент сообщает код из СМС, товаровед вводит его в АРМ; подписание ПЭП проходит успешно</td><td>Сбоев подписания в этом случае не описано</td></tr>\n<tr><td>9. Чек и выдача</td><td>Печатают чек и передают клиенту всю сумму нового займа наличными</td><td>Время расчёта не измерялось</td></tr>\n<tr><td>10. Проценты по прежнему ЗБ</td><td>«Операция с договором» → «Перезалог» → «Наличная оплата» → «Провести» → принятие денег от клиента → печать чека. Порядок приведён по описанию наблюдения аналитиком</td><td>Отдельная операция по старому билету; клиент возвращает часть полученных средств для оплаты процентов</td></tr>\n<tr><td>11. Размещение техники</td><td>К технике прикладывают спецификацию, распечатанную из АРМ, и убирают её на стеллаж, обозначенный как стеллаж для техники</td><td>Способ упаковки и время размещения не зафиксированы</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> не замерено. Перечислены этапы, а не количество кликов; отмечены переходы между телефоном с Битрикс24, новым ЗБ и прежним ЗБ в АРМ.</p>\n<p><strong>Время выполнения:</strong> ответ по оценке ожидали около 3 минут; в этот период товаровед продолжала заполнять ЗБ. Общая длительность выдачи займа и остальных этапов не измерялась. Общие 40 минут визита включают обсуждение и другие операции.</p>\n<p><strong>Документы и повторный ввод:</strong> новый ЗБ подписан ПЭП; напечатаны чек по выдаче займа, чек по оплате процентов и спецификация из АРМ, приложенная к технике. Другие документы и подписание при перезалоге не описаны. В чат и номенклатуру АРМ повторно вносили сведения о комплекте, рабочем состоянии и внешнем виде техники.</p>\n<h4>2. Смена номера телефона через оформление соглашения ЭП</h4>\n<p><strong>Границы изучения:</strong> реальная смена номера при аналитике, от запуска процесса до загрузки фотографии соглашения ПЭП и выдачи бумажного экземпляра клиенту.</p>\n<p><strong>Кто выполняет:</strong> товаровед и клиент. <strong>Где:</strong> рабочий стол «Ломбард» в АРМ, телефон и печатное соглашение.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Что осталось уточнить</th></tr></thead><tbody>\n<tr><td>1. Запуск</td><td>Рабочий стол «Ломбард» → «Запуск процесса» → «Оформить соглашение ЭП»</td><td>Время запуска не измерялось</td></tr>\n<tr><td>2. Клиент и номер</td><td>Выбирают контрагента по ФИО, как при оформлении ЗБ, вводят новый номер</td><td>Дополнительные проверки не описаны</td></tr>\n<tr><td>3. Подтверждение номера</td><td>Отправляют код ОТП для подтверждения нового номера</td><td>Подробности ввода кода не зафиксированы</td></tr>\n<tr><td>4. Соглашение</td><td>Нажимают «Оформить соглашение ЭП», печатают новое соглашение ПЭП; клиент подписывает бумажный документ</td><td>Количество экземпляров не указано</td></tr>\n<tr><td>5. Фото и загрузка</td><td>Товаровед фотографирует подписанное соглашение ПЭП телефоном. АРМ показывает QR-код, через который с телефона прикладывают фотографию соглашения</td><td>Время фотографирования и загрузки не измерялось</td></tr>\n<tr><td>6. Завершение</td><td>После загрузки бумажный экземпляр отдают клиенту</td><td>Проверка результата смены номера отдельно не описана</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений и время:</strong> не замерены. Зафиксирована работа с АРМ, телефоном и бумажным документом.</p>\n<p><strong>Документы и повторный ввод:</strong> новое соглашение ПЭП печатают, подписывают и загружают в АРМ в виде фотографии. Бумажный экземпляр передают клиенту; другие экземпляры и их хранение не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия функции или операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Точное общее число посетителей, очередь, рабочие места и навигация</td><td>Подтверждены не менее трёх посетителей. Не уточнено, менял ли номер клиент с шуруповёртом или другой человек; отдельный посетитель по этой операции в подсчёт не добавлен</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Число окон, учётная запись, оборудование, скорость и связь</td><td>Известно использование АРМ, телефона, Битрикс24 и принтера; полного обследования нет</td></tr>\n<tr><td>Клиентские операции</td><td>Проверка принесённой бижутерии и результат этих обращений; выкуп, скупка, продажа и другие виды операций</td><td>Подробно описаны выдача займа, оплата процентов и смена номера; по двум обращениям с бижутерией сообщён только повод визита</td></tr>\n<tr><td>Касса, товар и документы</td><td>Дополнительные документы и подписи при перезалоге; упаковка и маркировка техники; открытие и закрытие смены</td><td>Подтверждены наличные расчёты, чеки, спецификация и размещение на стеллаже; остальные детали не зафиксированы</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Кто согласовывает оценку; прочая отчётность и каналы связи</td><td>Канал, состав сведений и примерное ожидание известны; роль согласующего не указана</td></tr>\n<tr><td>Обходные пути</td><td>Доступные способы общего расчёта по ЗБ и сокращения повторного ввода</td><td>Наблюдавшийся порядок описан; другие функции АРМ отдельно не проверялись</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Параметры шторки, фото стеллажа и сведения о заявке</td><td>Назначение шторки — защита от пыли. Тараканов не замечено; фото стеллажа нет, наличие заявки не уточнено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Предложены столбцы задолженности для расчёта по нескольким ЗБ</h4>\n<p>Со слов товароведа, неудобно считать сумму к оплате по нескольким билетам клиента и переключаться между ними в «Операции по договору». Аналитик и товаровед совместно предложили добавить в таблицу всех ЗБ по ОП на рабочем столе «Ломбард» два столбца: <strong>общая задолженность</strong> и <strong>задолженность по процентам</strong>. При фильтрации по клиенту суммы по его билетам будут видны в одном списке.</p>\n<p>Это предложение к рассмотрению. Состав общей задолженности, дата расчёта и поведение показателей при разных операциях ещё не определены; наличие аналогичных функций не проверялось. Автоматическое суммирование выбранных строк и групповое проведение оплаты в рамках этого предложения не описаны.</p>\n<p>Похожее затруднение ранее зафиксировано со слов товароведа в [[Отчёт — 15.09.2026 — Пронин А.В. — ОП-163]].</p>\n<h4>2. Состояние прежних займов проверяют отдельно при оформлении нового</h4>\n<p>При аналитике товаровед вручную проверила наличие другого ЗБ клиента и предложила погасить по нему проценты из средств нового займа. Клиент согласился. Всю сумму займа выдали наличными. Оплату процентов оформили отдельной операцией «Перезалог» по указанному выше пути, с приёмом денег от клиента и печатью чека.</p>\n<p><strong>Предложение товароведа:</strong> при оформлении нового ЗБ показывать текущее состояние клиента по займам — во всплывающем окне либо в самом интерфейсе. Предложение касается отображения сведений; решение об оплате в наблюдавшемся случае согласовали с клиентом.</p>\n<h4>3. Сведения о технике повторно вносят в Битрикс24 и АРМ</h4>\n<p>Для оценки шуруповёрта товаровед отправила с телефона фото, сведения о комплекте, подтверждение рабочего состояния и описание внешнего вида в чат Битрикс24. Затем эти сведения повторно внесла в номенклатуру ЗБ. Аналитик отметил неудобство работы в отдельном чате и повторного ввода. Ответ ожидали около 3 минут; в это время сотрудник продолжала оформление билета.</p>\n<p><strong>Потребность:</strong> сократить повторный ввод и переключения при согласовании оценки. Для проработки нужно сопоставить повторяемые сведения с полями АРМ и определить связь согласованной оценки с конкретным ЗБ. Решение по реализации не определено.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Согласовывают оценку техники через чат Битрикс24 с телефона, затем заполняют номенклатуру в АРМ</td><td>Так организован наблюдавшийся порядок оценки</td><td>Сведения о комплекте, рабочем состоянии и внешнем виде повторно вводят в двух местах; время повторного ввода не измерялось</td></tr>\n</tbody></table>\n<p>Ручная проверка прежних займов и переходы между билетами происходят в АРМ. Загрузка документов с телефона по QR-коду описана как функция АРМ. Использование чата само по себе не устанавливает отсутствие других способов согласования в системе.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Расчёт по нескольким ЗБ</td><td>Не замерено; затруднение со слов товароведа</td><td>Просмотр сумм через отдельные билеты и переключения</td><td>Время расчёта для клиента с несколькими ЗБ</td></tr>\n<tr><td>Проверка прежних займов при новом ЗБ</td><td>Не замерено; действие наблюдалось</td><td>Отдельная ручная проверка</td><td>Число переходов и время поиска сведений</td></tr>\n<tr><td>Заполнение сведений для оценки и номенклатуры</td><td>Время повторного ввода не замерено</td><td>Работа в чате с телефона и повторное внесение сведений в АРМ</td><td>Время ввода и переключений</td></tr>\n</tbody></table>\n<p>Ожидание оценки составило около 3 минут и совмещалось с заполнением ЗБ. Это примерная длительность ответа, а не подтверждённые 3 минуты простоя.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась. В отчёте зафиксированы наблюдавшаяся работа, пояснения сотрудника и предложения по улучшению интерфейса.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Стеллаж с техникой</td><td>Установка шторки для защиты техники от пыли</td><td>Размеры, материал, крепление и наличие заявки</td><td>Фото нет</td></tr>\n</tbody></table>\n<p>ОП чистое и опрятное; по уточнению аналитика, тараканов не было. Фотографии стеллажа нет. Сведения о поданной заявке на шторку не предоставлены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> описание визита аналитиком, пояснения товароведа, чек-лист Чусовитиной А.Э. 1.0 и шаблон отчёта. Связанный полевой лист — [[АНКЕТА объезда ОП — одна страница]].</p>\n<p><strong>Образцы и приложения:</strong> пустые бланки соглашения ЭП и других документов, обезличенные примеры экранов и фото стеллажа не приложены. Фотографии техники и документов в описании относятся к работе товароведа, а не к собранным аналитиком приложениям.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Ниже перечислены предложения для дальнейшей работы. Задачи и записи в целевых реестрах в рамках подготовки отчёта не создавались.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Займ под технику с согласованием оценки; оплата процентов по прежнему ЗБ; смена номера через соглашение ЭП</td><td>Роль согласующего оценку, дополнительные документы и подписи при перезалоге, упаковка техники</td><td>Не назначены; предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Два столбца задолженности в списке ЗБ; состояние займов при оформлении нового ЗБ</td><td>Состав и дата расчёта показателей, расположение и проверка существующих функций</td><td>Не назначены; предложено</td></tr>\n<tr><td>Бэклог аналитиков</td><td>Повторный ввод при оценке техники в Битрикс24 и АРМ</td><td>Сопоставление сведений с полями, участники согласования, замеры и варианты сокращения повторного ввода</td><td>Не назначены; предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Наблюдавшиеся процессы займа под технику, оплаты процентов и смены номера</td><td>Проверка точных названий полей, полного комплекта документов и условий завершения операций</td><td>Не назначены; предложено</td></tr>\n<tr><td>Ответственный за оснащение / задача в Битрикс</td><td>Шторка для защиты техники на стеллаже от пыли</td><td>Параметры и фото; сведения о ранее поданной заявке</td><td>Не назначены; задача при подготовке отчёта не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>
