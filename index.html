Обоснование:</strong> оставшиеся детали можно сначала уточнить дистанционно. Повторное наблюдение может потребоваться для замеров повторного ввода и расчёта по нескольким ЗБ.</p>\n<h3>Открытые вопросы и дальнейшие действия</h3>\n<p>Подготовка отчёта по предоставленным сведениям завершена. Клиентский поток уточнён; тараканов не было, фото стеллажа нет. Неуказанные пункты чек-листа отражены в разделе «Что не успели посмотреть». Следующие пункты относятся к дальнейшей работе по результатам визита.</p>\n<ul>\n<li>[ ] При проработке предложений определить состав и дату расчёта задолженности, способ отображения состояния займов и проверить доступные функции АРМ.</li>\n<li>[ ] Для описания оценки сопоставить повторяемые сведения с полями АРМ, уточнить роль согласующего и замерить время повторного ввода.</li>\n<li>[ ] При детализации процессов уточнить дополнительные документы и подписи при перезалоге, упаковку и маркировку техники.</li>\n<li>[ ] Уточнить параметры шторки, приложить фото стеллажа и определить исполнителя.</li>\n<li>[ ] Определить ответственных и сроки дальнейших действий, необходимость повторного визита и внести сведения в таблицу учёта объезда.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>16.09.2026</dd><dt>Аналитик</dt><dd>Пронин Артём Вадимович</dd><dt>Время приезда и отъезда</dt><dd>С 09:05 до 09:45</dd><dt>Продолжительность</dt><dd>40 минут</dd><dt>С кем работали, должности</dt><dd>[товаровед], товаровед. На ОП также присутствовал Камаров Антон, супервайзер</dd><dt>Супервайзер предупреждён</dt><dd>Да. Также предупреждены отдел безопасности и видеонаблюдения</dd><dt>Группа / дивизион</dt><dd>Не указано</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Предложены столбцы задолженности для расчёта по нескольким ЗБ</b><span>Со слов товароведа, неудобно считать сумму к оплате по нескольким билетам клиента и переключаться между ними в «Операции по договору». Аналитик и товаровед совместно предложили добавить в таблицу всех ЗБ по ОП на…</span></li><li><b>Состояние прежних займов проверяют отдельно при оформлении нового</b><span>При аналитике товаровед вручную проверила наличие другого ЗБ клиента и предложила погасить по нему проценты из средств нового займа. Клиент согласился. Всю сумму займа выдали наличными. Оплату процентов оформили…</span></li><li><b>Сведения о технике повторно вносят в Битрикс24 и АРМ</b><span>Для оценки шуруповёрта товаровед отправила с телефона фото, сведения о комплекте, подтверждение рабочего состояния и описание внешнего вида в чат Битрикс24. Затем эти сведения повторно внесла в номенклатуру ЗБ. Аналитик…</span></li></ol>\n<h2>Потери времени</h2><ul><li>Расчёт по нескольким ЗБ</li><li>Проверка прежних займов при новом ЗБ</li><li>Заполнение сведений для оценки и номенклатуры</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Стеллаж с техникой</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>Бэклог аналитиков</li><li>База знаний АРМ</li><li>Ответственный за оснащение / задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>"}]}, {"op": "ОП-170", "num": "170", "name": "Южный", "addr": "г.Уфа, ул.Степана Кувыкина 1г", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Зелёная Роща", "d": "6", "lat": 54.6983855, "lon": 55.9919153, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Абдуллин Венер Фаритович", "date": "09.09.2026"}], "reports": [{"date": "09.09.2026", "author": "Абдуллин Векнер Фаритович", "file": "01_Отчет_по_методике_170_Южный (1).md", "title": "Отчёт об объезде ОП 170 «Южный»", "html": "<h2>Отчёт об объезде ОП 170 «Южный»</h2>\n<p>Дата подготовки: 11.09.2026. Отчёт составлен по чек-листу объезда ОП, версия 1.0 от 07.09.2026.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП</td><td>170 «Южный»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Кувыкина, д. 1г</td></tr>\n<tr><td>Регион</td><td>ЮГ</td></tr>\n<tr><td>Дата визита</td><td>09.09.2026, среда</td></tr>\n<tr><td>Аналитик</td><td>Абдуллин Векнер Фаритович</td></tr>\n<tr><td>Товаровед</td><td>[товаровед]</td></tr>\n<tr><td>Супервайзер ОП</td><td>Камаров Антон Александрович</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Полная продолжительность визита</td><td>Не указана</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Не уточнено</td></tr>\n</tbody></table>\n<p>Дата, регион и ФИО указаны по сведениям аналитика. Адрес взят из локальной карты ОП за июнь 2026 года; его актуальность отдельно не проверялась. Присутствие супервайзера на визите не установлено.</p>\n<h3>Что делал на ОП</h3>\n<ol>\n<li>Уточнил, какие замечания по помещению уже собраны, и запросил существующий список.</li>\n<li>Разобрал выкуп, при котором клиент меняет способ оплаты после запуска процесса.</li>\n<li>Изучил затруднения с выкупом электронного залогового билета при недоступности ПЭП.</li>\n<li>Уточнил опыт работы с поддержкой и ИИ-помощником.</li>\n<li>Разобрал, как товаровед понимает KPI по QR-оплате и что делает для его выполнения.</li>\n<li>Собрал замечания по рабочему месту, отделке и засору санузла.</li>\n</ol>\n<h3>Что изучил</h3>\n<p>Основу составляют конкретные рабочие случаи и пояснения товароведа. Полный путь по каждому экрану, число кликов и время этапов не замерены. Причины сбоев и действующие правила расчёта отдельно не проверялись.</p>\n<table><thead><tr><th>Участок</th><th>Как разбирал</th><th>Что выяснил</th></tr></thead><tbody>\n<tr><td>Смена способа оплаты при выкупе</td><td>Разбор рабочего случая</td><td>Клиент сначала соглашается на карту или QR, затем выбирает наличные. Уже запущенный процесс приходится отменять через поддержку</td></tr>\n<tr><td>Ожидание поддержки</td><td>Со слов товароведа</td><td>Пока процесс не отменён, завершить оформление другим способом не получается. В одном случае клиент успел уйти за наличными и вернуться, а ожидание ещё продолжалось</td></tr>\n<tr><td>Выкуп электронного билета</td><td>Разбор случаев сбоя ПЭП</td><td>Для билета, оформленного электронно, не найден обычный переход к бумажному оформлению выкупа при сбое подписи</td></tr>\n<tr><td>Исключительный порядок при сбое ПЭП</td><td>Со слов товароведа</td><td>Был случай бумажного оформления через согласование с СБ и последующее завершение электронной части через задачу. Точный порядок и основание не проверены</td></tr>\n<tr><td>Приложение</td><td>Со слов товароведа</td><td>Его считают удобным и стараются переводить клиентов на самостоятельные действия. Сбои вызывают недовольство клиентов</td></tr>\n<tr><td>KPI по QR-оплате</td><td>Разбор показателя и действий сотрудника</td><td>Непонятно, как оплаты в приложении влияют на показатель. Ради KPI приходится отдельно договариваться с клиентом об оплате по QR</td></tr>\n<tr><td>Понятность зарплаты</td><td>Со слов товароведа</td><td>Правила требуют времени на изучение. Сотрудник не уверен, как проверить отдельные показатели и нужно ли самостоятельно записывать все операции за месяц</td></tr>\n<tr><td>Работа АРМ</td><td>Со слов товароведа</td><td>Есть жалобы на зависания. Конкретные ошибки, даты и длительность не собраны</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Разбор уже заявленных замечаний</td><td>Нужны кресло и стационарная лампа; есть замечания к плитке, стенам и санузлу. Список ранее уже собирали</td></tr>\n</tbody></table>\n<h4>Выкуп: клиент решил оплатить иначе</h4>\n<p><strong>Кто выполняет:</strong> товаровед. Для отмены уже запущенного процесса привлекается поддержка.</p>\n<p><strong>Где:</strong> АРМ; обращение в поддержку оформляется отдельно.</p>\n<ol>\n<li>Товаровед уточняет способ оплаты.</li>\n<li>Клиент соглашается на карту или QR, процесс запускается; QR-код может быть уже распечатан.</li>\n<li>Клиент сообщает, что этим способом оплатить не сможет или хочет внести наличные.</li>\n<li>Товаровед обращается в поддержку за отменой процесса.</li>\n<li>После отмены можно продолжить оформление другим способом.</li>\n</ol>\n<p>Главное затруднение возникает на четвёртом шаге. Клиент уже готов рассчитаться, но товаровед зависит от очереди обращений в поддержке. Это случай <strong>выкупа и приёма оплаты от клиента</strong>. Копирование скупки и выдача нового займа здесь не рассматриваются.</p>\n<p>Предложение для проверки: дать понятный способ сменить оплату в текущем выкупе либо быстро отменить только незавершённую попытку. Перед новой оплатой система должна однозначно показывать результат первоначальной. Реализация и условия доступности такой команды пока не определены.</p>\n<h4>Выкуп: не работает ПЭП</h4>\n<p>ПЭП здесь означает простую электронную подпись.</p>\n<p>При выдаче залогового билета, по описанию товароведа, можно выбрать бумажный вариант. Но для последующего выкупа уже электронного билета такой обычной альтернативы не найдено. При сбое подписи клиент ждёт восстановления или отдельного решения.</p>\n<p>Приведены случаи ожидания по три-четыре часа. Это оценка прошлых случаев со слов товароведа, а не замер на этом визите. Один из них удалось провести через согласование с СБ, бумажное оформление и последующую задачу.</p>\n<p>Нужно установить действующий порядок на такой случай: кто принимает решение, какие документы оформляются, как отмечается выдача имущества и кто завершает электронную часть после восстановления. Наличие единичного согласования не означает, что этот способ уже разрешён для всех операций.</p>\n<h4>QR-показатель и приложение</h4>\n<p>Товаровед продвигает приложение как удобный способ самостоятельно оплатить в подходящее время. Одновременно для выполнения QR-показателя приходится звонить клиентам и договариваться об отдельной оплате по QR. Если клиенту неудобно, нужно перезванивать.</p>\n<p>По пониманию товароведа, удобная клиенту оплата в приложении не решает задачу с KPI. Правила зачёта платежей ещё не проверены, поэтому утверждать это как устройство расчёта нельзя.</p>\n<p>Для проверки нужны три вещи: определение показателя, источник его данных и несколько операций с разными каналами оплаты. Тогда станет ясно, нужно менять правило, исправлять расчёт или объяснить сотруднику уже действующий порядок.</p>\n<p>Высказаны варианты: учитывать оплаты из приложения либо пересмотреть сам показатель. Решение об изменении мотивации не принято. Дату введения новых правил также не фиксируем: подтверждённого срока нет.</p>\n<h3>Что не успел посмотреть</h3>\n<p>По этим пунктам пока не хватает сведений. Причины каждого пропуска отдельно не отмечены.</p>\n<ul>\n<li>Полный обычный выкуп без сбоя с подсчётом действий и замером времени.</li>\n<li>Оформление нового залога и скупки, продление, продажа, возврат и передача невыкупа в реализацию.</li>\n<li>Открытие и закрытие смены, инкассация и исправление кассовых расхождений.</li>\n<li>Маркировка, хранение, поиск вещей, инвентаризация и перемещения между ОП.</li>\n<li>Число рабочих мест, очередь, место ожидания и количество клиентов за полный час.</li>\n<li>Полный список программ и оборудования, учётная запись, порядок работы при обрыве связи.</li>\n<li>Комплект печатных форм, число экземпляров, ручные дописки и хранение документов.</li>\n<li>Личные таблицы, тетради, отчёты за день и время на их заполнение.</li>\n<li>Размещение товаров на онлайн-площадках и обслуживание интернет-заказов.</li>\n<li>Полный осмотр помещения и фотографии дефектов.</li>\n</ul>\n<p>Неизученные операции не отмечаются как отсутствующие на ОП.</p>\n<h3>Три главных наблюдения</h3>\n<h4>1. Изменение оплаты превращается в ожидание поддержки</h4>\n<p>Способ оплаты заранее уточняют, но клиент может изменить решение уже после запуска выкупа. Товаровед не нашла самостоятельного способа продолжить операцию и ждёт отмены. Именно этот случай стоит первым воспроизвести на тесте.</p>\n<h4>2. Для сбоя электронной подписи нужен понятный рабочий порядок</h4>\n<p>Когда выкуп электронного билета зависит от недоступной подписи, клиент надолго остаётся на точке. Разовое согласование уже использовалось, но товароведу нужен понятный порядок: куда обратиться, что оформить и кто доведёт операцию до конца.</p>\n<h4>3. QR-показатель может заставлять делать лишние звонки</h4>\n<p>Клиенту предлагают пользоваться приложением, а затем отдельно договариваются с ним об оплате по QR ради показателя. Нужно проверить, действительно ли правила расчёта создают такое противоречие. Сначала на конкретных платежах.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Просят поддержку отменить процесс выкупа</td><td>Клиент меняет оплату после запуска</td><td>Клиент и товаровед ждут освобождения операции</td></tr>\n<tr><td>Отдельно согласовывают бумажное оформление и последующее электронное завершение</td><td>ПЭП недоступна для выкупа электронного билета</td><td>Нужны дополнительные согласования и контроль незавершённых действий</td></tr>\n<tr><td>Звонят клиенту повторно ради QR-оплаты</td><td>Нужно выполнить показатель</td><td>Дополнительные звонки и неудобство для клиента</td></tr>\n<tr><td>Пытаются самостоятельно устранить засор</td><td>Вопрос ещё не решён ответственными</td><td>Затраты времени, при этом проблема сохраняется</td></tr>\n</tbody></table>\n<p>В таблице описаны способы справляться с затруднениями. Их соответствие утверждённым правилам отдельно не проверялось.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Где</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить или найти</th></tr></thead><tbody>\n<tr><td>Выкуп со сменой оплаты</td><td>Точный замер отсутствует</td><td>Ожидание отмены процесса поддержкой</td><td>Время обращения, отмены и завершения выкупа</td></tr>\n<tr><td>Выкуп при сбое ПЭП</td><td>Три-четыре часа в приведённых прошлых случаях</td><td>Недоступна подпись, требуется отдельное решение</td><td>Даты инцидентов и история обработки обращений</td></tr>\n<tr><td>Выполнение QR-показателя</td><td>Не замерено</td><td>Звонки и повторные договорённости</td><td>Число повторных звонков и платежи, ради которых они сделаны</td></tr>\n<tr><td>Работа АРМ</td><td>Не замерено</td><td>Зависания</td><td>Операцию, время, ошибку и продолжительность конкретного сбоя</td></tr>\n<tr><td>Засор санузла</td><td>Срок устранения не подтверждён</td><td>Попытки решить самостоятельно, перенаправление вопроса</td><td>Существующее обращение, ответственного и согласованный срок</td></tr>\n</tbody></table>\n<p>Экономия времени от предложений пока не рассчитана. Оценки прошлых случаев не заменяют замеры обычной работы ОП.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Подтверждённых расхождений нет: действующие документы отдельно не сверялись.</p>\n<p>Проверить нужно правила отмены незавершённого выкупа, действия при сбое ПЭП, зачёт QR-платежей и порядок обработки хозяйственных обращений. Нельзя считать, что сотрудник нарушает порядок, только потому что приходится обращаться за отдельным согласованием.</p>\n<h3>Требует ремонта / замены / обслуживания</h3>\n<p>Замечания по помещению уже собирали до этого выезда. Сначала нужно получить тот список и статусы работ, чтобы не создавать одинаковые обращения повторно.</p>\n<table><thead><tr><th>Что</th><th>Где / зачем</th><th>Следующий шаг</th><th>Фото</th></tr></thead><tbody>\n<tr><td>Кресло</td><td>Рабочее место товароведа</td><td>Уточнить, требуется замена существующего кресла или другое оснащение</td><td>Не приложено</td></tr>\n<tr><td>Стационарная лампа</td><td>Освещение рабочего места</td><td>Подобрать постоянное место и подключение; уточнить потребность с товароведом</td><td>Не приложено</td></tr>\n<tr><td>Плитка</td><td>Место нужно уточнить</td><td>Сверить с ранее собранным списком и осмотреть участок</td><td>Не приложено</td></tr>\n<tr><td>Отделка стен</td><td>Место и объём повреждений нужно уточнить</td><td>Получить фото и определить работы</td><td>Не приложено</td></tr>\n<tr><td>Засор санузла</td><td>Санузел ОП</td><td>Найти существующее обращение, назначенного мастера и срок устранения</td><td>Не приложено</td></tr>\n</tbody></table>\n<p>Засор пытались устранить самостоятельно, но вопрос оставался открытым. Причина со слов сотрудников требует проверки мастером. Способы применения химических средств в перечень работ не включаются: конкретное решение должен выбрать ответственный специалист после осмотра.</p>\n<p>По освещению в других зонах, электрике, отоплению, замкам, камерам и остальным пунктам раздела 9 сведений недостаточно.</p>\n<h3>Артефакты</h3>\n<p>Подготовлены этот отчёт и короткие итоги для себя. Исходный файл сохранён в папке выезда.</p>\n<p>Существующий список замечаний по ремонту запрошен для пересылки. Сам список, фото, номера заявок в поддержку, пустые бланки и примеры расчёта KPI к материалам пока не приложены. Получение и исполнение заявок не подтверждены.</p>\n<p>Данные клиентов, платёжные коды и личные обстоятельства в отчёт не включены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Предлагаю распределить вопросы так. Это подготовка к дальнейшей работе: новые задачи не созданы, изменения не согласованы и не выполнены.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Какой результат нужен</th></tr></thead><tbody>\n<tr><td>Реестр процессов / аналитики АРМ</td><td>Смена оплаты при выкупе</td><td>Проверенный сценарий со всеми состояниями оплаты и способом продолжить операцию</td></tr>\n<tr><td>Владелец процесса выкупа, СБ и поддержка</td><td>Выкуп электронного билета при сбое ПЭП</td><td>Утверждённый порядок исключения с ответственными и завершением электронной части</td></tr>\n<tr><td>Ответственные за мотивацию и расчёт</td><td>QR-показатель и оплаты в приложении</td><td>Проверка нескольких платежей по действующим правилам, затем решение по расхождению</td></tr>\n<tr><td>База знаний / поддержка</td><td>Понятные инструкции по двум случаям выкупа</td><td>Короткая инструкция с контактами и условиями применения</td></tr>\n<tr><td>Супервайзер и хозяйственная служба</td><td>Санузел, кресло, лампа, плитка и стены</td><td>Единый список существующих замечаний с ответственными и статусами</td></tr>\n<tr><td>Техническая поддержка</td><td>Зависания АРМ</td><td>Конкретный воспроизводимый пример или инцидент с временем и ошибкой</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Самостоятельная смена оплаты и понятный статус выкупа</td><td>Предложение после проверки уже имеющихся возможностей</td></tr>\n</tbody></table>\n<p>Камаров Антон Александрович указан как супервайзер ОП. Перечисление вопросов в отчёте не означает, что они уже направлены ему или назначены в работу.</p>\n<h3>Нужен повторный визит</h3>\n<p>Решение не принято. Список ремонта, номера обращений и примеры QR-платежей можно получить дистанционно. Смену оплаты и сбой ПЭП лучше сначала разобрать на тестовом примере с владельцем процесса. Повторное посещение имеет смысл, если останется вопрос, который нельзя проверить иначе.</p>\n<h3>Что осталось для завершения отчёта</h3>\n<ul>\n<li>[x] Указаны ОП, регион, дата и полные ФИО аналитика, товароведа и супервайзера.</li>\n<li>[x] Сохранены два основных документа и исходный файл.</li>\n<li>[ ] Уточнить время визита и актуальность адреса из карты ОП.</li>\n<li>[ ] Получить существующий список замечаний по ремонту, фото и статусы работ.</li>\n<li>[ ] Найти пример выкупа со сменой оплаты и историю отмены через поддержку.</li>\n<li>[ ] Уточнить действующий порядок при сбое ПЭП.</li>\n<li>[ ] Проверить QR-показатель на оплатах через разные каналы.</li>\n<li>[ ] Определить, какие вопросы кому передать, и дополнить таблицу учёта объезда.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>09.09.2026, среда</dd><dt>Аналитик</dt><dd>Абдуллин Векнер Фаритович</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Товаровед</dt><dd>[товаровед]</dd><dt>Супервайзер предупреждён</dt><dd>Не уточнено</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Изменение оплаты превращается в ожидание поддержки</b><span>Способ оплаты заранее уточняют, но клиент может изменить решение уже после запуска выкупа. Товаровед не нашла самостоятельного способа продолжить операцию и ждёт отмены. Именно этот случай стоит первым воспроизвести на…</span></li><li><b>Для сбоя электронной подписи нужен понятный рабочий порядок</b><span>Когда выкуп электронного билета зависит от недоступной подписи, клиент надолго остаётся на точке. Разовое согласование уже использовалось, но товароведу нужен понятный порядок: куда обратиться, что оформить и кто…</span></li><li><b>QR-показатель может заставлять делать лишние звонки</b><span>Клиенту предлагают пользоваться приложением, а затем отдельно договариваются с ним об оплате по QR ради показателя. Нужно проверить, действительно ли правила расчёта создают такое противоречие. Сначала на конкретных…</span></li></ol>\n<h2>Потери времени</h2><ul><li>Выкуп со сменой оплаты</li><li>Выкуп при сбое ПЭП</li><li>Выполнение QR-показателя</li><li>Работа АРМ</li><li>Засор санузла</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Кресло</li><li>Стационарная лампа</li><li>Плитка</li><li>Отделка стен</li><li>Засор санузла</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов / аналитики АРМ</li><li>Владелец процесса выкупа, СБ и поддержка</li><li>Ответственные за мотивацию и расчёт</li><li>База знаний / поддержка</li><li>Супервайзер и хозяйственная служба</li><li>Техническая поддержка</li><li>Реестр идей CRM / АРМ</li></ul>\n<h2>Повторный визит</h2><p>Решение не принято. Список ремонта, номера обращений и примеры QR-платежей можно получить дистанционно. Смену оплаты и сбой ПЭП лучше сначала разобрать на тестовом примере с владельцем процесса. Повторное посещение имеет смысл, если останется вопрос, который нельзя проверить иначе.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 2 из 8 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-143", "num": "143", "name": "Кувыкинский", "addr": "г. Уфа, ул. Степана Кувыкина, д.29", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Зелёная Роща", "d": "6", "lat": 54.7068183, "lon": 55.9974436, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Золотых Светлана Витальевна", "date": "09.09.2026"}], "reports": [{"date": "09.09.2026", "author": "Золотых Светлана Витальевна", "file": "Отчёт — 09.09.2026 — Золотых Светлана Витальевна — ОП-143 Кувыкинский.md", "title": "Отчёт об объезде ОП-143 «Кувыкинский»", "html": "<h2>Отчёт об объезде ОП-143 «Кувыкинский»</h2>\n<p>Дата подготовки: <strong>09.09.2026</strong>.</p>\n<p>Отчёт подготовлен по результатам визита на ОП на основании беседы с товароведом и разбора текущей организации работы. Реальные клиентские операции во время визита не наблюдались.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-143 «Кувыкинский»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Степана Кувыкина, д. 29</td></tr>\n<tr><td>Группа / дивизион</td><td>Дивизион ОП-143</td></tr>\n<tr><td>Дата визита</td><td>09.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Золотых Светлана Витальевна</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>с 14:55 до 15:38</td></tr>\n<tr><td>Продолжительность</td><td>43 минуты</td></tr>\n<tr><td>С кем работали, должности</td><td>Товаровед</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да</td></tr>\n</tbody></table>\n<h3>Цель визита</h3>\n<p>Разобрать, как в целом устроена работа товароведа на ОП: какие действия выполняются в течение дня, какие системы и документы используются, какие есть ручные процессы, где возникают сложности и чего не хватает для работы.</p>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Провели беседу с товароведом о повседневной работе на ОП.</li>\n<li>Разобрали используемые системы и каналы: АРМ, Битрикс, Excel / Google Таблицы, бумажные тетради и листы, MAX.</li>\n<li>Обсудили работу с клиентскими обзвонами, расчётом вала и мотивации.</li>\n<li>Разобрали завершение рабочего дня и печатные отчёты.</li>\n<li>Обсудили организацию замен сотрудников и оформление отпусков.</li>\n<li>Зафиксировали проблемы, связанные с ПЭП и ручными обходными процессами.</li>\n<li>Обсудили текущие потребности по помещению и оснащению.</li>\n<li>Зафиксировали использование ИИ через «Аркадия» для подготовки тикетов в техническую поддержку.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Работа в АРМ</td><td>Беседа</td><td>АРМ используется как основная система, однако периодически зависает ПЭП. Также, по словам товароведа, вал по ОП в АРМ считается неверно, поэтому его пересчитывают вручную.</td></tr>\n<tr><td>Обзвон клиентов</td><td>Беседа</td><td>Список клиентов на обзвон формируется вручную: из АРМ данные переносят в Google Таблицу, в частности по клиентам, у которых заканчивается льготный период.</td></tr>\n<tr><td>Учёт мотивации</td><td>Беседа</td><td>После работы с клиентами сотрудник вручную заносит отдельные данные в собственную Excel / Google Таблицу, чтобы контролировать мотивацию, способ оплаты и выполнение плана. Полный состав полей не уточнён.</td></tr>\n<tr><td>Передача информации сменщице</td><td>Беседа</td><td>Используется бумажная тетрадь. В ней фиксируют итоги предыдущего дня и то, что следующему сотруднику нужно не забыть.</td></tr>\n<tr><td>Лист реализации</td><td>Беседа</td><td>Ведётся бумажный список с датой вывода залогов в реализацию и переводом на склад.</td></tr>\n<tr><td>Передача агрегатов курьеру</td><td>Беседа</td><td>Используется тетрадь, где фиксируются передача агрегатов, дата, количество и подпись курьера.</td></tr>\n<tr><td>MAX</td><td>Беседа</td><td>Используется для связи с клиентами по залогам. По словам товароведа, это удобно, снижает расходы на СМС и позволяет связаться с большинством клиентов.</td></tr>\n<tr><td>Битрикс</td><td>Беседа</td><td>Используется для рабочих коммуникаций, в том числе для поиска замены сотрудника.</td></tr>\n<tr><td>ИИ / «Аркадия»</td><td>Беседа</td><td>ИИ используется для подготовки тикетов в техническую поддержку через «Аркадия».</td></tr>\n<tr><td>Завершение рабочего дня</td><td>Беседа</td><td>В конце дня из АРМ печатают реестр движения ЗБ, кассовый отчёт и сверку итогов. Документы прошиваются и помещаются в папку.</td></tr>\n<tr><td>Замена сотрудника</td><td>Беседа</td><td>Если нужна замена, старшие товароведы ищут её через сообщение в Битриксе или звонок. Обычно сменщица выходит на подмену. В таблице графиков выход другого сотрудника отмечается жёлтым цветом.</td></tr>\n<tr><td>Оформление отпуска</td><td>Беседа</td><td>Сотрудник открывает на рабочем компьютере папку с заявлениями, печатает заявление на отпуск, подписывает, сканирует и отправляет скан в чат старшему товароведу или супервайзеру.</td></tr>\n<tr><td>Поддержка при проблемах</td><td>Беседа</td><td>В первую очередь сотрудник обращается к старшему товароведу или в общий чат товароведов, где коллеги помогают решить проблему.</td></tr>\n<tr><td>Клиентский поток</td><td>Беседа</td><td>По словам товароведа, обычно клиенты приходят по одному. Максимально наблюдавшаяся очередь — около 4 человек. Обычно сотрудники успевают обслуживать поток.</td></tr>\n<tr><td>Помещение и оснащение</td><td>Беседа</td><td>Требуется покрасить лестничный пандус, заменить мусорный бак без дна, установить лампу или фонарь снаружи, расширить уголок клиента. Заявка на стеллажи для техники уже подана.</td></tr>\n</tbody></table>\n<h3>Основной процесс: ежедневная работа товароведа</h3>\n<p><strong>Границы изучения:</strong> от начала рабочей смены до завершения дня и передачи информации следующему сотруднику.</p>\n<p><strong>Кто выполняет:</strong> товаровед; при необходимости участвуют старший товаровед, супервайзер, сменщица, курьер, служба безопасности и техническая поддержка.</p>\n<p><strong>Где выполняет:</strong> АРМ, Битрикс, Excel / Google Таблицы, MAX, бумажные тетради и листы, локальные папки на рабочем компьютере.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Работа в АРМ</td><td>Выполняются основные операции по клиентам и документам</td><td>Возможны зависания ПЭП</td></tr>\n<tr><td>2. Контроль обзвонов</td><td>Из АРМ вручную формируется список клиентов на обзвон</td><td>Ручной перенос данных в Google Таблицу</td></tr>\n<tr><td>3. Контроль показателей</td><td>Сотрудник отслеживает вал, мотивацию и выполнение плана</td><td>Вал пересчитывается вручную; часть данных по клиентам заносится дополнительно</td></tr>\n<tr><td>4. Коммуникация с клиентами</td><td>Используются звонки, СМС и MAX</td><td>При проблемах ПЭП и подтверждениях обслуживание может затягиваться</td></tr>\n<tr><td>5. Передача информации</td><td>В тетради фиксируются итоги дня и важная информация для сменщицы</td><td>Информация хранится вне АРМ</td></tr>\n<tr><td>6. Завершение дня</td><td>Печатаются реестр движения ЗБ, кассовый отчёт и сверка итогов</td><td>Документы дополнительно прошиваются и хранятся в папке</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> часть данных из АРМ вручную переносится в Google Таблицы / Excel. Для отдельных процессов сохраняется бумажный учёт.</p>\n<h3>Что не успели посмотреть</h3>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Фактическое обслуживание очереди и поведение клиентов</td><td>Во время визита клиентов не было</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Фактическое поведение ПЭП при клиентской операции</td><td>Во время визита проблема не воспроизводилась</td></tr>\n<tr><td>Клиентские операции</td><td>Полные сценарии обслуживания клиентов</td><td>Реальных клиентов не было</td></tr>\n<tr><td>Касса, товар и документы</td><td>Фактическое выполнение операций в АРМ</td><td>Обсуждалось со слов товароведа</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Фактические трудозатраты на подготовку отчётов</td><td>Замеры не проводились</td></tr>\n<tr><td>Обходные пути</td><td>Полный перечень ручных операций</td><td>Зафиксированы только озвученные процессы</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Детальные размеры и фото проблемных мест</td><td>Фото не делались</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Повседневная работа распределена между АРМ, таблицами, бумажными носителями и мессенджерами</h4>\n<p>Основная работа ведётся в АРМ, но часть процессов вынесена в Google Таблицы / Excel, бумажные тетради, Битрикс и MAX. Вручную ведутся списки обзвонов, дополнительный контроль мотивации, передача информации сменщице, лист реализации и журнал передачи агрегатов курьеру.</p>\n<p>Это создаёт несколько параллельных источников информации и дополнительный ручной ввод.</p>\n<h4>2. Проблемы ПЭП уже влияли на обслуживание клиентов</h4>\n<p>По словам товароведа, проблема с ПЭП периодически повторяется и встречалась не только на этой ОП. Ранее сотрудник обращался в техническую поддержку, однако проблему устранить не удалось.</p>\n<p>В одном из случаев клиент полностью оплатил товар, но из-за проблемы с системой стандартно завершить операцию не получилось. После согласования со службой безопасности товар выдали клиенту, а затем данные корректировали в системе, чтобы отразить возврат займа.</p>\n<p>Ситуация указывает не только на техническую проблему, но и на наличие вынужденного обходного сценария при сбое ПЭП.</p>\n<h4>3. Сотрудник вынужден вручную контролировать показатели, которые ожидает видеть корректными в системе</h4>\n<p>По словам товароведа, вал по ОП в АРМ рассчитывается неверно, поэтому его пересчитывают вручную. Также после обслуживания клиентов сотрудник ведёт собственную таблицу для контроля мотивации и выполнения плана.</p>\n<p>Это требует отдельной проверки расчётной логики АРМ и сопоставления её с фактической методикой расчёта.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Переносят список клиентов из АРМ в Google Таблицу для обзвона</td><td>В АРМ нет достаточного рабочего механизма обзвона</td><td>Ручной перенос и дополнительное ведение таблицы</td></tr>\n<tr><td>Пересчитывают вал вручную</td><td>По словам сотрудника, вал по ОП в АРМ считается неверно</td><td>Дополнительные трудозатраты и риск расхождения версий показателя</td></tr>\n<tr><td>Ведут собственную таблицу мотивации</td><td>Не хватает уверенности в итоговом расчёте и удобного контроля плана</td><td>Повторный ввод данных после клиентов</td></tr>\n<tr><td>Ведут тетрадь для сменщицы</td><td>Нужно передавать итоги дня и напоминания</td><td>Информация хранится вне системы</td></tr>\n<tr><td>Ведут бумажный лист реализации</td><td>Нужно отслеживать вывод залогов в реализацию и перевод на склад</td><td>Параллельный бумажный учёт</td></tr>\n<tr><td>Ведут журнал передачи агрегатов курьеру</td><td>Требуется фиксировать факт передачи</td><td>Бумажный учёт и подписи</td></tr>\n<tr><td>Используют MAX для связи с клиентами</td><td>Удобнее и дешевле СМС</td><td>Зависимость от внешнего канала связи</td></tr>\n<tr><td>При сбое ПЭП согласуют нестандартное завершение операции со службой безопасности</td><td>Стандартный процесс в системе недоступен</td><td>Операция завершается вне штатного сценария и затем корректируется в системе</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> описаны процессы, которые товаровед озвучил во время визита. Полный перечень обходных путей не установлен.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Формирование списка обзвона</td><td>Не замерено</td><td>Ручной перенос данных из АРМ в Google Таблицу</td><td>Время формирования списка и частоту обновления</td></tr>\n<tr><td>Расчёт вала</td><td>Не замерено</td><td>Ручной пересчёт из-за расхождений с АРМ</td><td>Время на пересчёт и величину расхождений</td></tr>\n<tr><td>Контроль мотивации</td><td>Не замерено</td><td>Ручное внесение данных после клиентов</td><td>Время на одного клиента и перечень дублируемых полей</td></tr>\n<tr><td>Работа при сбое ПЭП</td><td>Не замерено</td><td>Зависание / недоступность ПЭП</td><td>Частоту сбоев, среднее ожидание, число сорванных операций</td></tr>\n<tr><td>Завершение рабочего дня</td><td>Не замерено</td><td>Печать, прошивка и хранение бумажных отчётов</td><td>Время на формирование и обработку отчётов</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> замеры времени не проводились; часть выводов основана на рассказе товароведа, а не на прямом наблюдении.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<p>Отдельно требует проверки корректность обходного сценария при сбое ПЭП, когда завершение клиентской операции согласовывается со службой безопасности, а данные затем корректируются в системе.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Лестничный пандус</td><td>Ремонт</td><td>Объём покраски</td><td>Не приложено</td></tr>\n<tr><td>Мусорный бак</td><td>Замена</td><td>Требуемый тип / объём</td><td>Не приложено</td></tr>\n<tr><td>Уличное освещение</td><td>Дополнительное оснащение</td><td>Место установки лампы или фонаря</td><td>Не приложено</td></tr>\n<tr><td>Уголок клиента</td><td>Дополнительное оснащение / расширение</td><td>Требуемый размер для размещения всех документов</td><td>Не приложено</td></tr>\n<tr><td>Стеллажи для техники</td><td>Дополнительное оснащение</td><td>Количество и параметры</td><td>Заявка уже подана</td></tr>\n</tbody></table>\n<p><strong>Фотофиксация:</strong> фотографии во время визита не делались.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> настоящий отчёт, сведения со слов товароведа.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Ответственный за помещение / оснащение</td><td>Покраска пандуса, замена мусорного бака, наружное освещение, расширение уголка клиента</td><td>Параметры и при необходимости фото</td><td>Уточнить</td></tr>\n<tr><td>Техническая поддержка</td><td>Повторяющиеся сбои ПЭП</td><td>Логи, даты и примеры конкретных операций</td><td>Ранее обращались, проблема периодически повторяется</td></tr>\n<tr><td>Бэклог аналитиков / АРМ</td><td>Проверка расчёта вала по ОП</td><td>Методика расчёта и пример расхождения</td><td>Требует проверки</td></tr>\n<tr><td>Бэклог аналитиков / АРМ</td><td>Автоматизация списка клиентов на обзвон</td><td>Требования к выборке и статусам</td><td>Требует проработки</td></tr>\n<tr><td>Бэклог аналитиков / АРМ</td><td>Проверка возможностей по расчёту мотивации и отображению выполнения плана</td><td>Состав полей текущей таблицы сотрудника</td><td>Требует уточнения</td></tr>\n<tr><td>Отчёт об объезде</td><td>Описание фактической организации работы товароведа</td><td>—</td><td>Зафиксировано</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Нет.</p>\n<p><strong>Обоснование:</strong> на текущем этапе повторный визит не требуется. Основные особенности работы товароведа удалось собрать в ходе беседы. При необходимости технические детали по АРМ, расчёту вала и мотивации целесообразнее уточнять отдельно через данные, примеры расчётов и сотрудников, ответственных за систему.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика.</li>\n<li>[x] Указать адрес и время пребывания.</li>\n<li>[x] Зафиксировать состав смены и предупреждение супервайзера.</li>\n<li>[x] Описать выполненные действия и способы изучения операций.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать отсутствие замеров времени.</li>\n<li>[x] Зафиксировать потребности по ремонту и оснащению.</li>\n<li>[ ] Уточнить методику расчёта вала и получить пример расхождения с АРМ.</li>\n<li>[ ] При необходимости получить пример таблицы мотивации и определить, какие данные в неё дублируются.</li>\n<li>[ ] При необходимости собрать даты / примеры сбоев ПЭП для технического анализа.</li>\n<li>[ ] Уточнить ответственных за ремонт и оснащение.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>09.09.2026</dd><dt>Аналитик</dt><dd>Золотых Светлана Витальевна</dd><dt>Время приезда и отъезда</dt><dd>с 14:55 до 15:38</dd><dt>Продолжительность</dt><dd>43 минуты</dd><dt>С кем работали, должности</dt><dd>Товаровед</dd><dt>Супервайзер предупреждён</dt><dd>Да</dd><dt>Группа / дивизион</dt><dd>Дивизион ОП-143</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Повседневная работа распределена между АРМ, таблицами, бумажными носителями и мессенджерами</b><span>Основная работа ведётся в АРМ, но часть процессов вынесена в Google Таблицы / Excel, бумажные тетради, Битрикс и MAX. Вручную ведутся списки обзвонов, дополнительный контроль мотивации, передача информации сменщице,…</span></li><li><b>Проблемы ПЭП уже влияли на обслуживание клиентов</b><span>По словам товароведа, проблема с ПЭП периодически повторяется и встречалась не только на этой ОП. Ранее сотрудник обращался в техническую поддержку, однако проблему устранить не удалось.</span></li><li><b>Сотрудник вынужден вручную контролировать показатели, которые ожидает видеть корректными в системе</b><span>По словам товароведа, вал по ОП в АРМ рассчитывается неверно, поэтому его пересчитывают вручную. Также после обслуживания клиентов сотрудник ведёт собственную таблицу для контроля мотивации и выполнения плана.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Формирование списка обзвона</li><li>Расчёт вала</li><li>Контроль мотивации</li><li>Работа при сбое ПЭП</li><li>Завершение рабочего дня</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Лестничный пандус</li><li>Мусорный бак</li><li>Уличное освещение</li><li>Уголок клиента</li><li>Стеллажи для техники</li></ul>\n<h2>Куда передать</h2><ul><li>Ответственный за помещение / оснащение</li><li>Техническая поддержка</li><li>Бэклог аналитиков / АРМ</li><li>Бэклог аналитиков / АРМ</li><li>Бэклог аналитиков / АРМ</li><li>Отчёт об объезде</li></ul>\n<h2>Повторный визит</h2><p>Решение: Нет.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 7 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-145", "num": "145", "name": "Софьи Перовской", "addr": "г. Уфа, ул Софьи Перовской, д. 23", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Зелёная Роща", "d": "6", "lat": 54.695807, "lon": 55.9980262, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Пронин Артем Вадимович", "date": "09.09.2026", "src": "отчёт"}], "reports": [{"date": "09.09.2026", "author": "Пронин Артем Вадимович", "file": "Отчёт — 09.09.2026 — Пронин А.В. — ОП-145.md", "title": "Отчёт об объезде ОП-145 «Софьи Перовской»", "html": "<h2>Отчёт об объезде ОП-145 «Софьи Перовской»</h2>\n<p>Дата подготовки: <strong>11.09.2026</strong>.</p>\n<p>Отчёт оформлен по предоставленному шаблону «Отчёт об объезде ОП» на основании описания визита аналитиком: осмотра клиентской зоны, беседы с товароведом, демонстрации возможностей АРМ и разбора порядка безналичной оплаты. Материалы по наблюдению: [[ЧЕК-ЛИСТ наблюдения — товаровед на ОП]] и [[ЭКСПРЕСС-чек-лист — 30 минут на ОП]]. Версия чек-листа, использованная непосредственно на визите, не указана.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт подготовлен по имеющимся сведениям с учётом уточнений аналитика от 11.09.2026. Наблюдения относятся к визиту 09.09.2026 с 18:30 до 19:00. Бумажное подписание при выкупе и немедленный добор обсуждались со слов товароведа; сбой отправки кода ПЭП при аналитике не происходил. Порядок оплаты СБП демонстрировали без клиента. Неизвестные реквизиты отмечены «Не указано»; замеры длительности операций не предоставлены.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-145 «Софьи Перовской»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Софьи Перовской, д. 23</td></tr>\n<tr><td>Группа / дивизион</td><td>Не указано</td></tr>\n<tr><td>Дата визита</td><td>09.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Пронин Артём Вадимович</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>С 18:30 до 19:00</td></tr>\n<tr><td>Продолжительность</td><td>30 минут</td></tr>\n<tr><td>С кем работали, должности</td><td>[товаровед], товаровед. Полный состав смены не указан</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Осмотрели отделение и клиентскую зону: чистоту, аккуратность, размещение табличек и информации.</li>\n<li>Обсудили с товароведом затруднения при выкупе по займу, оформленному с ПЭП: невозможность бумажного подписания и отдельно — ситуацию, когда АРМ не отправляет код подписания.</li>\n<li>Зафиксировали замечание об отсутствии плана Вала: на рабочем столе «Ломбард» справа под открытием смены, во вкладке «Информация», сотруднику доступен только факт.</li>\n<li>Ознакомились с просмотром истории оплат и начислений по залоговому билету, включая расчёт на будущую дату.</li>\n<li>По просьбе аналитика продемонстрировали без клиента порядок оплаты через СБП и картой, зафиксировали последовательность действий в АРМ до этапа ожидания оплаты.</li>\n<li>Обсудили добор через мобильное приложение сразу после оформления залога и пожелание изменить момент его доступности.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентская зона</td><td>Визуальный осмотр</td><td>Отделение аккуратное, клиентская зона чистая. Тараканов при осмотре не замечено. Таблички и информация оформлены аккуратно и находятся на своих местах</td></tr>\n<tr><td>Выкуп по займу с ПЭП: бумажное подписание</td><td>Беседа с товароведом</td><td>Со слов сотрудника, если исходный займ оформлен с ПЭП, при выкупе нельзя распечатать документ, подписать его на бумаге и завершить операцию, когда электронное подписание недоступно</td></tr>\n<tr><td>Отправка кода подписания ПЭП</td><td>Беседа с товароведом</td><td>Отдельно сообщено о ситуации, когда АРМ не отправляет код подписания. При аналитике сбой не происходил; техническая причина и частота не установлены</td></tr>\n<tr><td>План и факт Вала</td><td>Замечание по просмотру информации об ОП</td><td>На рабочем столе «Ломбард», справа под открытием смены, во вкладке «Информация» виден только факт Вала. План не отображается, сотруднику непонятно текущее выполнение плана</td></tr>\n<tr><td>Оплаты и начисления по залоговому билету</td><td>Демонстрация функции АРМ</td><td>Через контекстное меню можно вывести информацию по займам и задать будущую дату. Задолженность по процентам определяют по полю «Сумма процентов»</td></tr>\n<tr><td>Безналичная оплата по договору</td><td>Демонстрация порядка без клиента</td><td>Зафиксирован путь через «Платежная карта» к выбору СБП или карты. Реальная оплата клиента на демонстрации не наблюдалась</td></tr>\n<tr><td>Добор через мобильное приложение</td><td>Беседа</td><td>Описана ситуация: клиент оформляет залог и сразу делает добор в приложении, заранее не запрашивая согласование повышенной оценки. Озвучено пожелание открывать добор после первой оплаты процентов либо по истечении определённого срока</td></tr>\n<tr><td>Работа программ</td><td>Наблюдение и беседа в пределах визита</td><td>Зависаний не выявлено. Других жалоб на работу программы, помимо перечисленных замечаний, не зафиксировано</td></tr>\n</tbody></table>\n<h4>1. Просмотр оплат и начислений по залоговому билету: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от выбора залогового билета до просмотра таблицы с историей оплат, начислениями и расчётом на выбранную будущую дату.</p>\n<p><strong>Кто выполняет:</strong> сотрудник ОП в АРМ; аналитик знакомится с функцией. Кто непосредственно управлял программой при показе — не указано.</p>\n<p><strong>Где выполняет:</strong> АРМ, контекстное меню залогового билета, команда «Вывести информацию по займам».</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Выбор залогового билета</td><td>На нужном залоговом билете нажимают правую кнопку мыши</td><td>Не зафиксировано</td></tr>\n<tr><td>2. Вызов информации</td><td>Выбирают «Вывести информацию по займам»</td><td>Не зафиксировано</td></tr>\n<tr><td>3. Дата расчёта</td><td>Устанавливают нужную дату, в том числе будущую</td><td>Не зафиксировано</td></tr>\n<tr><td>4. Просмотр таблицы</td><td>Просматривают оплаты и начисления по залоговому билету, историю расчётов и данные на выбранную дату. Задолженность по процентам определяют по полю «Сумма процентов»</td><td>Не зафиксировано</td></tr>\n</tbody></table>\n<p><strong>Практическое применение:</strong> посмотреть, когда и сколько клиент платил; предварительно сообщить задолженность по процентам на выбранную дату. По уточнению аналитика, ориентиром служит поле «Сумма процентов». Полный расчёт суммы выкупа, включая основной долг, отдельно не описан.</p>\n<p>&gt; [!tip] Что зафиксировано для дальнейшей работы &gt; Путь: <strong>правая кнопка мыши на залоговом билете → «Вывести информацию по займам» → нужная дата</strong>. Значения на будущую дату используются для предварительного расчёта; они не подтверждают совершение будущих платежей. Сведения об отдельной проверке алгоритма расчёта не предоставлены.</p>\n<p><strong>Число действий / переключений:</strong> Не указано; замеры не предоставлены; перечислены смысловые этапы, а не количество кликов.</p>\n<p><strong>Время выполнения:</strong> Не указано; замеры не предоставлены.</p>\n<p><strong>Документы и повторный ввод:</strong> зафиксирован просмотр информации на экране. Сведения о печати, выгрузке и дублировании данных в другие системы не предоставлены.</p>\n<h4>2. Оплата по договору через СБП или картой: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> демонстрация порядка без клиента — от входа в операции по договору до выбора способа оплаты и этапа ожидания платежа. Успешное завершение реальной оплаты не наблюдалось.</p>\n<p><strong>Кто выполняет:</strong> товаровед демонстрирует действия в АРМ аналитику. В реальной операции клиент оплачивает выбранным способом; на демонстрации клиента не было.</p>\n<p><strong>Где выполняет:</strong> АРМ, «Операции по договору» → «Платежная карта»; окно выбора способа оплаты; платёжный терминал при оплате картой либо отображение СБП при выборе этого способа.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Вход в оплату</td><td>Открывают «Операции по договору», выбирают «Платежная карта»</td><td>Не зафиксировано</td></tr>\n<tr><td>2. Сумма и назначение</td><td>Вводят сумму и выбирают нужный вариант: погасить проценты — перезалог, оплатить 50% задолженности по процентам, «Выкуп» или «Выкуп до рубля»</td><td>Уточнено: вариант «50% от процента» означает оплату половины задолженности по процентам. Это описание назначения; точные подписи всех вариантов отдельно не сверялись</td></tr>\n<tr><td>3. Проведение документа</td><td>Проводят документ</td><td>Замеры не предоставлены</td></tr>\n<tr><td>4. Выбор способа оплаты</td><td>Появляется окно с вариантами «Оплата СБП», «Карта» и «Отмена»; выбирают нужный способ</td><td>Порядок действий при отмене не описан</td></tr>\n<tr><td>5. Передача на оплату</td><td>При выборе карты команда поступает на платёжный терминал; при выборе СБП выводится СБП</td><td>Конкретный вид отображения СБП не описан</td></tr>\n<tr><td>6. Ожидание</td><td>По показанному порядку далее ожидается оплата клиента</td><td>Демонстрация проходила без клиента; длительность реального ожидания и последующие статусы не наблюдались</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не указано; замеры не предоставлены.</p>\n<p><strong>Время выполнения:</strong> Не указано; замеры не предоставлены.</p>\n<p><strong>Документы и повторный ввод:</strong> документ оплаты проводится до появления окна выбора СБП или карты. Печать чека, подписание документов, повторный ввод и проверка окончательного результата в исходном описании не отражены.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Число клиентов, состав смены, рабочие места и очереди</td><td>В исходном описании нет данных о потоке и полной смене; уточнить у аналитика или сотрудника</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Оборудование, настройки доступа, качество связи на ОП; обстоятельства сбоя отправки кода ПЭП</td><td>Полного обследования не описано. Отсутствие связи у клиента в озвученном сценарии не подтверждает проблему связи именно в помещении ОП</td></tr>\n<tr><td>Клиентские операции</td><td>Проверка ограничения бумажного подписания и печати при выкупе по займу с ПЭП; завершение оплаты СБП, чек и конечный статус; пример немедленного добора</td><td>Бумажный выкуп и добор обсуждались, сбой кода при аналитике не происходил; порядок СБП демонстрировали без клиента</td></tr>\n<tr><td>Касса, товар и документы</td><td>Открытие и закрытие смены, инкассация, хранение, полный комплект печатных форм</td><td>Сведения не приведены в описании визита</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Период показателя Вала, источник плана, права на его просмотр; прочая отчётность</td><td>Место просмотра установлено: рабочий стол «Ломбард», вкладка «Информация» справа под открытием смены. Источник плана и настройки не описаны</td></tr>\n<tr><td>Обходные пути</td><td>Как фактически завершают выкуп при недоступности ПЭП; используют ли другие рабочие способы</td><td>Сообщено о невозможности бумажного варианта, но успешный обход и исход таких случаев не описаны</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Подсобные помещения, состояние оборудования и наличие фотографий</td><td>Описан визуальный осмотр клиентской зоны; полный технический осмотр не зафиксирован</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. При выкупе по займу с ПЭП недоступно бумажное подписание</h4>\n<p>Со слов товароведа, если займ первоначально оформлен с электронным подписанием ПЭП, при выкупе недоступны выбор бумажного подписания и распечатка документов для него. Это затрудняет обслуживание, когда у клиента нет связи и он хочет подписать бумажный документ. Та же потребность возникает при сбое отправки кода подписания в АРМ. По уточнению аналитика, ограничение обсуждалось; его действие на реальной операции при аналитике не проверялось.</p>\n<p><strong>Последствие по описанному сценарию:</strong> клиент готов подписать документы на бумаге, но сотрудник не может завершить выкуп этим способом. Как в итоге разрешаются такие случаи и сколько времени это занимает, не указано.</p>\n<p><strong>Что проверить:</strong> воспроизвести сценарий по займу с ПЭП; установить, на каком шаге недоступны печать и бумажное подписание; уточнить предусмотренный порядок завершения выкупа. Наличие ограничения, его причина и возможность изменения требуют отдельной проверки.</p>\n<h4>2. АРМ не отправляет код подписания ПЭП</h4>\n<p><strong>Отдельная проблема, озвученная товароведом:</strong> при выкупе возникает ситуация, когда АРМ не отправляет код подписания ПЭП. Она зафиксирована отдельно от отсутствия связи у клиента и от невозможности бумажного подписания. По уточнению аналитика, при нём этот сбой не происходил.</p>\n<p><strong>Последствие по описанному сценарию:</strong> электронное подписание недоступно, а попытка перейти на бумажное оформление упирается в ограничение из предыдущего пункта.</p>\n<p><strong>Что проверить:</strong> конкретный случай, время попытки, сообщение АРМ, наличие события отправки и статус доставки. На визите технически не установлено, не инициируется ли отправка в АРМ либо код отправляется, но не доставляется. Частота и охват сбоя не определены; успешное воспроизведение не зафиксировано.</p>\n<h4>3. В информации по ОП виден факт Вала, но не план</h4>\n<p>Зафиксировано замечание: на рабочем столе <strong>«Ломбард»</strong>, справа под открытием смены, во вкладке <strong>«Информация»</strong> сотрудники видят только факт Вала. План не отображается, поэтому нет понимания текущего выполнения плана.</p>\n<p><strong>Потребность:</strong> видеть план рядом с фактом и понимать степень его выполнения. Место просмотра уточнено; период показателя и источник планового значения не указаны.</p>\n<p><strong>Что проверить:</strong> где хранится и как доводится план, должен ли он отображаться в используемой форме, есть ли ограничения доступа. После проверки определить, требуется ли настройка, пояснение пользователю или доработка отображения.</p>\n<h3>Предложение по добору через мобильное приложение</h3>\n<p>Со слов товароведа, клиент заранее знает о возможности добора в мобильном приложении, поэтому не просит согласовать повышенную оценку при оформлении: оформляет залог и сразу увеличивает сумму займа через приложение. Аналитик уточнил, что это рассказ сотрудника; непосредственное наблюдение такого клиентского случая на визите не проводилось.</p>\n<p><strong>Озвученное пожелание:</strong> показывать возможность добора после первой оплаты процентов либо по истечении некоторого срока после оформления займа.</p>\n<p><strong>Статус:</strong> предложение для обсуждения. Конкретный срок и правило доступности не определены и не утверждены. Данные о частоте таких случаев, суммах и влиянии на показатели не предоставлены. Нарушение клиентом действующих правил не установлено.</p>\n<p><strong>Что уточнить:</strong> текущие условия добора, цель предполагаемого ограничения и желаемое правило — после первой оплаты процентов, после заданного срока или при ином согласованном условии. Отдельно определить, речь идёт о показе функции в приложении или об изменении самой возможности добора.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>При недоступном электронном подписании хотят распечатать документ и подписать выкуп на бумаге; со слов товароведа, этот вариант недоступен</td><td>У клиента нет связи либо АРМ не отправляет код ПЭП</td><td>Рабочий способ завершения выкупа в этих обстоятельствах не описан</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> описана потребность в альтернативном способе подписания, но успешный обход не подтверждён. Сведения об использовании тетрадей, личных таблиц, двойного ввода и иных способов работы вне системы не предоставлены. Добор в мобильном приложении отражён отдельно как описанная возможность с предложением изменить условия её доступности.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Выкуп при недоступном ПЭП и невозможности бумажного подписания</td><td>Замеры не предоставлены</td><td>Нет описанного способа завершения операции при отсутствии связи у клиента или сбое отправки кода</td><td>Число случаев, время до завершения выкупа, обращения за помощью и итог</td></tr>\n<tr><td>Отправка кода подписания ПЭП</td><td>Замеры не предоставлены</td><td>Со слов сотрудника, код не отправляется; техническая причина не установлена</td><td>Время попытки, ожидание кода, число повторов при их наличии, статус отправки и доставки</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> замеры длительности отдельных операций не предоставлены. Ожидание оплаты СБП отмечено как этап процесса, но его избыточность не установлена. За 30 минут визита зависаний программ не выявлено; это не отменяет озвученные проблемы и не характеризует работу за весь день.</p>\n<h3>Расхождения с регламентом</h3>\n<p>При подготовке этого отчёта сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Сведения о такой сверке на визите не предоставлены.</p>\n<table><thead><tr><th>Требование и источник</th><th>Что происходит фактически</th><th>Статус проверки</th></tr></thead><tbody>\n<tr><td>Порядок подписания при выкупе по займу с ПЭП — документ, редакцию и пункт уточнить</td><td>Со слов товароведа, перейти на бумажное подписание при недоступности ПЭП нельзя</td><td>Требует проверки; расхождение с регламентом не установлено</td></tr>\n<tr><td>Условия добора через мобильное приложение — документ, редакцию и пункт уточнить</td><td>Со слов сотрудника, клиент может сделать добор сразу после оформления залога</td><td>Требует проверки действующих условий; пожелание об ограничении не является установленным правилом</td></tr>\n</tbody></table>\n<h3>Требует ремонта / замены</h3>\n<p>При визуальном осмотре клиентской зоны потребности в ремонте, замене или дополнительном оснащении не зафиксированы. Отделение аккуратное, клиентская зона чистая, таблички и информация на месте и оформлены аккуратно. Тараканов при осмотре не замечено.</p>\n<p>Полный осмотр подсобных помещений и проверка исправности оборудования не описаны.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены; сведения о наличии фотографий — уточнить.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> описание визита, переданное аналитиком при подготовке отчёта; предоставленный Markdown-шаблон. Материалы по наблюдению — [[ЧЕК-ЛИСТ наблюдения — товаровед на ОП]] и [[ЭКСПРЕСС-чек-лист — 30 минут на ОП]]. Заполненный полевой лист не приложен.</p>\n<p><strong>Полученные на ОП образцы:</strong> бланки, фотографии, обезличенные примеры экранов и тексты ошибок не приложены. Их наличие — уточнить.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Ниже перечислены предлагаемые действия. Передача материалов, назначение исполнителей и создание задач в рамках подготовки отчёта не выполнялись.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Последовательность оплаты по договору через СБП или картой</td><td>Завершение оплаты, окончательные статусы, печатные формы и замеры</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Путь к истории оплат и начислений: залоговый билет → «Вывести информацию по займам» → нужная дата; задолженность по процентам — поле «Сумма процентов». Демонстрация выбора СБП или карты; вариант 50% означает половину задолженности по процентам</td><td>Проверка точных подписей, расчёта на будущую дату и оставшихся шагов реальной оплаты</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td><strong>Отдельная проблема: невозможность бумажного подписания при выкупе по займу с ПЭП</strong></td><td>Пример, недоступный шаг, действующий порядок и проверка воспроизведения</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td><strong>Отдельная проблема: АРМ не отправляет код подписания ПЭП</strong></td><td>Время попытки, сообщение АРМ, статус отправки и доставки, частота</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Отображение плана Вала вместе с фактом во вкладке «Информация» рабочего стола «Ломбард», справа под открытием смены</td><td>Период, источник плана и настройки доступа</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Пожелание открывать добор в приложении после первой оплаты процентов либо по истечении срока</td><td>Цель изменения, действующие условия, конкретный срок и согласованное правило</td><td>Ответственный и срок не назначены; предложено</td></tr>\n<tr><td>Ответственный за помещение / оснащение</td><td>По осмотренной клиентской зоне потребности не зафиксированы</td><td>Сведения о полном осмотре и наличии фотографий</td><td>Передача не выполнялась</td></tr>\n<tr><td>Задача в Битрикс</td><td>Отдельные обращения по бумажному выкупу и сбою кода ПЭП; после уточнения — по плану Вала и добору</td><td>Исполнители, проверяемые примеры и согласованные формулировки</td><td>В рамках подготовки отчёта задачи не созданы; сведения о ранее созданных задачах не предоставлены</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Не принято.</p>\n<p><strong>Обоснование:</strong> адрес и место просмотра Вала установлены. Группу / дивизион, состав смены, источник плана, примеры проблем ПЭП и параметры предложения по добору можно уточнить дистанционно. Повторный выезд может понадобиться для наблюдения полного выкупа при недоступности ПЭП, завершения реальной оплаты СБП и замеров времени, если дистанционно получить эти сведения не удастся.</p>\n<h3>Открытые вопросы и дальнейшие действия</h3>\n<p>Отчёт подготовлен по доступным сведениям. Следующие пункты относятся к дальнейшему уточнению и работе с выявленными проблемами.</p>\n<ul>\n<li>[ ] Дополнить группу / дивизион, состав смены и сведения о предупреждении супервайзера.</li>\n<li>[ ] Получить конкретные примеры ограничения бумажного выкупа и сбоя отправки кода ПЭП; проверить причины и предусмотренный порядок действий.</li>\n<li>[ ] Установить период показателя Вала, источник плана и настройки его отображения.</li>\n<li>[ ] При отдельной проверке зафиксировать завершение реальной оплаты СБП, конечный статус, печатные формы и точные подписи вариантов оплаты.</li>\n<li>[ ] Уточнить цель и параметры предложения по сроку доступности добора через приложение.</li>\n<li>[ ] При наличии дополнить отчёт фотографиями и обезличенными материалами.</li>\n<li>[ ] Назначить ответственных и сроки дальнейших действий; определить необходимость повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>09.09.2026</dd><dt>Аналитик</dt><dd>Пронин Артём Вадимович</dd><dt>Время приезда и отъезда</dt><dd>С 18:30 до 19:00</dd><dt>Продолжительность</dt><dd>30 минут</dd><dt>С кем работали, должности</dt><dd>[товаровед], товаровед. Полный состав смены не указан</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений</dd><dt>Группа / дивизион</dt><dd>Не указано</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>При выкупе по займу с ПЭП недоступно бумажное подписание</b><span>Со слов товароведа, если займ первоначально оформлен с электронным подписанием ПЭП, при выкупе недоступны выбор бумажного подписания и распечатка документов для него. Это затрудняет обслуживание, когда у клиента нет…</span></li><li><b>АРМ не отправляет код подписания ПЭП</b><span>Отдельная проблема, озвученная товароведом: при выкупе возникает ситуация, когда АРМ не отправляет код подписания ПЭП. Она зафиксирована отдельно от отсутствия связи у клиента и от невозможности бумажного подписания. По…</span></li><li><b>В информации по ОП виден факт Вала, но не план</b><span>Зафиксировано замечание: на рабочем столе «Ломбард», справа под открытием смены, во вкладке «Информация» сотрудники видят только факт Вала. План не отображается, поэтому нет понимания текущего выполнения плана.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Выкуп при недоступном ПЭП и невозможности бумажного подписания</li><li>Отправка кода подписания ПЭП</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>База знаний АРМ</li><li>Бэклог аналитиков / техническая поддержка</li><li>Бэклог аналитиков / техническая поддержка</li><li>Реестр идей CRM / АРМ</li><li>Реестр идей CRM / АРМ</li><li>Ответственный за помещение / оснащение</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: Не принято.</p>"}]}, {"op": "ОП-24", "num": "24", "name": "Демский", "addr": "г. Уфа, Ухтомского, д.16", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Дёма", "d": "5", "lat": 54.7060432, "lon": 55.8293813, "tv": [], "st": "", "flags": ["КМТ"], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-17", "num": "17", "name": "Ухтомского", "addr": "г.Уфа, ул.Правды 20", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Дёма", "d": "5", "lat": 54.7031071, "lon": 55.8322671, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-127", "num": "127", "name": "Правды", "addr": "г. Уфа, ул. Правды, д.12", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Дёма", "d": "5", "lat": 54.7037474, "lon": 55.8368823, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-134", "num": "134", "name": "Яркий", "addr": "г. Уфа, ул. Е.Столярова, д.2", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфа — Дёма", "d": "5", "lat": 54.6986524, "lon": 55.858021, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-153", "num": "153", "name": "Зубово", "addr": "Уфимский район, с. Зубово, ул. Серебряная, д.91", "g": "ЮГ", "sup": "Камаров А.А.", "area": "Уфимский район", "d": "5", "lat": 54.6325474, "lon": 55.9195705, "tv
