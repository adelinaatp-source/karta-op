"name": "Российская", "addr": "г.Уфа, Пр. Октября 134\\1", "g": "Центр", "sup": "Напалкова В.Е.", "area": "Уфа — пр. Октября", "d": "4", "lat": 54.7774037, "lon": 56.0317553, "tv": [], "st": "", "flags": [], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Чусовитина Аделина Эриковна", "date": "16.09.2026", "src": "отчёт"}], "reports": [{"date": "16.09.2026", "author": "Чусовитина Аделина Эриковна", "file": "Отчёт — 16.09.2026 — Чусовитина Аделина Эриковна — ОП 7.md", "title": "Отчёт об объезде ОП-7 «Российская»", "html": "<h2>Отчёт об объезде ОП-7 «Российская»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт подготовлен по чек-листу объезда ОП (версия 1.0 от 07.09.2026, автор — Чусовитина А.Э.) на основании записей по итогам визита: отправка ценностей из ОП «ценной посылкой» — документ перемещения, печатные формы, маршрут в депозитарий или на склад. Как получено каждое сведение (наблюдение, показ в программе или рассказ сотрудника), в записях не указано.</p>\n<p>&gt; [!info] Статус сведений &gt; Отчёт составлен по записям, переданным 17.09.2026. В записях ОП назван «ОП на Юрюзани»; номер ОП-7 — по уточнению, название, адрес, группа, дивизион и супервайзер — по таблице учёта объезда. В таблице объезд 16.09.2026 пока не отмечен. Время визита и состав смены в записях не указаны. Цитаты из записей приведены в кавычках. «Не указано» — это отсутствие сведений, а не отсутствие операции на ОП.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-7 «Российская»; в записях — «ОП на Юрюзани»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, пр. Октября, д. 134/1</td></tr>\n<tr><td>Группа / дивизион</td><td>Группа «Центр», дивизион 4</td></tr>\n<tr><td>Дата визита</td><td>16.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Чусовитина Аделина Эриковна</td></tr>\n<tr><td>Должность аналитика</td><td>Руководитель отдела бизнес-анализа</td></tr>\n<tr><td>Время приезда и отъезда</td><td>Не указано</td></tr>\n<tr><td>Продолжительность</td><td>Не указано</td></tr>\n<tr><td>С кем работали, должности</td><td>Не указано</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Нет сведений; супервайзер ОП — Напалкова В.Е.</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Разобрали отправку ценностей из ОП «ценной посылкой»: от оформления посылки и документа перемещения на её основе до печати спецификации.</li>\n<li>Зафиксировали печатные формы на одну посылку: накладная в 2 экземплярах, адресный ярлык, спецификация.</li>\n<li>Зафиксировали маршрут: золото отправляют в депозитарий, технику — на склад.</li>\n<li>Записали, что для выкупа порядок тот же: «На выкуп точно также».</li>\n</ol>\n<h3>Что изучили</h3>\n<p>Способ разбора в записях не указан; замеры времени не проводились. Другие операции ОП в записях не отражены.</p>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Оформление ценной посылки</td><td>Не указано</td><td>Оформляют «ценную посылку», на её основе — документ перемещения. Документ на перемещение — накладная, печатают 2 экземпляра</td></tr>\n<tr><td>Сейф и пакет</td><td>Не указано</td><td>Записано: «накладная 2 экземпляра в сейфа пакет ценная посылка (реестр перемещения)». Вероятно, один экземпляр остаётся в сейфе, второй вкладывают в пакет «ценная посылка»; уточнить. «Реестр перемещения» — другое название посылки или отдельная форма, уточнить</td></tr>\n<tr><td>Маршрут и маркировка</td><td>Не указано</td><td>Печатают адресный ярлык. Золото отправляют в депозитарий, технику — на склад. «Куар сканирует» — кто, что и на каком этапе сканирует, не указано</td></tr>\n<tr><td>Выкуп</td><td>Не указано</td><td>«На выкуп точно также». Относится ли это ко всему порядку (предмет возвращают на ОП для выкупа той же ценной посылкой) или только к сканированию QR-кода, уточнить</td></tr>\n<tr><td>Завершение оформления</td><td>Не указано</td><td>«Потом печатаем спецификацию и всё»</td></tr>\n</tbody></table>\n<h4>Отправка ценной посылкой: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от оформления «ценной посылки» до печати спецификации.</p>\n<p><strong>Кто выполняет:</strong> сотрудник ОП (должность не указана). Кто сканирует QR-код — сотрудник ОП, курьер или получатель, — не указано. Получатель — депозитарий (золото) или склад (техника).</p>\n<p><strong>Где выполняет:</strong> документы «ценная посылка» и перемещение — по контексту, в АРМ; принтер — накладная, адресный ярлык, спецификация; сейф; сканирование QR-кода.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Ценная посылка</td><td>Оформляют «ценную посылку», на её основе — документ перемещения</td><td>Нет сведений</td></tr>\n<tr><td>2. Накладная</td><td>Документ на перемещение — накладная, печатают 2 экземпляра</td><td>Печать двух экземпляров; кто подписывает — уточнить</td></tr>\n<tr><td>3. Сейф и пакет</td><td>Вероятно, один экземпляр накладной остаётся в сейфе, второй вкладывают в пакет «ценная посылка» (реестр перемещения)</td><td>Смысл записи и роль «реестра перемещения» — уточнить; сколько посылка ждёт отправки, не указано</td></tr>\n<tr><td>4. Адресный ярлык</td><td>Печатают адресный ярлык: золото — в депозитарий, техника — на склад</td><td>Выбирает ли адресата сотрудник или АРМ — уточнить</td></tr>\n<tr><td>5. QR-код</td><td>«Куар сканирует»</td><td>Кто, что и на каком этапе сканирует — уточнить</td></tr>\n<tr><td>6. Спецификация</td><td>«Потом печатаем спецификацию и всё»</td><td>Ещё одна печатная форма; не дублирует ли она накладную — проверить по образцам</td></tr>\n</tbody></table>\n<p>Порядок этапов — по записям; его стоит подтвердить в АРМ или у товароведа.</p>\n<p><strong>Число действий / переключений:</strong> не замерено.</p>\n<p><strong>Время выполнения:</strong> не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> на одну посылку — накладная на перемещение (2 экземпляра), адресный ярлык, спецификация; печатается ли реестр перемещения, уточнить. Документ перемещения создаётся на основании «ценной посылки», поэтому повторного ввода на этом шаге, по записям, нет. Не дублируется ли перечень предметов в накладной и спецификации, нужно проверить.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Вход, рабочие места, очередь, число клиентов</td><td>В записях не отражено</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Программы и окна, принтер, сканер QR-кода, скорость АРМ</td><td>В записях не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Залог, продление, скупка, продажа; выкуп предмета, который уже отправлен в депозитарий или на склад, — срок возврата и ожидание клиента</td><td>Уточнить у товароведа</td></tr>\n<tr><td>Касса, товар и документы</td><td>Как часто отправляют посылки, кто их забирает, кто подписывает накладную, где хранится второй экземпляр</td><td>Уточнить у товароведа, в депозитарии и на складе</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Как согласуют отправку с депозитарием и складом, кто подтверждает получение</td><td>В записях не отражено</td></tr>\n<tr><td>Обходные пути</td><td>Работа вне АРМ при отправке посылок</td><td>В записях не отражено</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Осмотр помещения, сейф, принтер, фотографии</td><td>В записях не отражено</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Ценности отправляют «ценной посылкой» с документом перемещения на её основе</h4>\n<p>Оформляют «ценную посылку», на её основе — документ перемещения; накладную печатают в 2 экземплярах. Вероятно, один экземпляр остаётся в сейфе, второй уходит в пакет.</p>\n<p>Рядом в записях упомянут «реестр перемещения» — другое название того же документа или отдельная форма, уточнить. После сверки с АРМ описание пригодно для базы знаний.</p>\n<h4>2. На одну посылку — несколько печатных форм</h4>\n<p>Кроме накладной в 2 экземплярах печатают адресный ярлык и спецификацию: «Потом печатаем спецификацию и всё».</p>\n<p>Если накладная и спецификация содержат один и тот же перечень предметов, печать можно сократить. Чтобы это проверить, нужны образцы форм. Сколько посылок отправляют за день и сколько времени уходит на оформление, не замерено.</p>\n<h4>3. Маршрут зависит от вида ценностей, при выкупе порядок тот же</h4>\n<p>«Если золото — то в депозитарий, если техника — то на склад». QR-код сканируют («Куар сканирует»), но кто и на каком этапе, не указано.</p>\n<p>«На выкуп точно также» — вероятно, предмет для выкупа возвращают на ОП тем же порядком; тогда выкуп зависит от срока перемещения. Уточнить, сколько ждёт клиент, если предмет уже отправлен.</p>\n<h3>Обходные пути</h3>\n<p>В записях работа вне системы и обходные пути не отмечены. Целенаправленный поиск тетрадей, таблиц и самодельных шаблонов в записях не отражён, поэтому вывод об их отсутствии не делается.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Оформление ценной посылки</td><td>Не замерено</td><td>Цепочка документов и печать: накладная (2 экз.), адресный ярлык, спецификация</td><td>Время от создания посылки до закладки в сейф; число посылок за день</td></tr>\n<tr><td>Выкуп предмета из депозитария или со склада</td><td>Не замерено</td><td>Предмет возвращают на ОП перемещением («На выкуп точно также») — требует уточнения</td><td>Срок от запроса до поступления предмета на ОП; ждёт ли клиент</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> хронометраж не проводился; выводы о трудоёмкости операций пока не делаются.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Для сверки понадобится порядок перемещения ценностей между ОП, депозитарием и складом.</p>\n<h3>Требует ремонта / замены</h3>\n<p>Потребности в ремонте, замене и оснащении в записях не отмечены. Осматривали ли помещение, не указано.</p>\n<p><strong>Фотофиксация:</strong> фотографии не приложены.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> записи по итогам визита, переданы 17.09.2026; номер ОП — по уточнению, реквизиты — по таблице учёта объезда.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены. Для базы знаний пригодятся обезличенные образцы накладной на перемещение, адресного ярлыка, спецификации, реестра перемещения и экраны «ценной посылки» и документа перемещения в АРМ.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Все действия пока только предложены; задачи не создавались, в реестры ничего не переносилось.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Отправка ценностей из ОП «ценной посылкой» в депозитарий или на склад; возврат предмета для выкупа</td><td>Ролей, кто сканирует QR-код, сроков, частоты</td><td>Предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Сократить печать на посылку: проверить, можно ли объединить накладную и спецификацию</td><td>Образцов форм, подтверждения дублирования</td><td>Предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Инструкция: ценная посылка, документ перемещения, печатные формы, маршрут «золото — депозитарий, техника — склад»</td><td>Экранов АРМ, образцов форм, подтверждённого порядка</td><td>Предложено</td></tr>\n<tr><td>Бэклог аналитиков / техническая поддержка</td><td>Сопоставить термины из записей («ценная посылка», «реестр перемещения», «спецификация») с документами АРМ</td><td>Доступа к АРМ или показа товароведом</td><td>Предложено</td></tr>\n<tr><td>Задача в Битрикс</td><td>Срочных сбоев в записях нет</td><td>—</td><td>Не создана</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> не принято.</p>\n<p><strong>Обоснование:</strong> термины, роли и порядок сканирования QR-кода можно уточнить дистанционно — в АРМ и у товароведа; образцы форм можно запросить у ОП. Повторный визит нужен, если потребуется замерить оформление посылки или посмотреть передачу посылки и выкуп предмета, возвращённого из депозитария.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика — ОП-7 «Российская» («ОП на Юрюзани»), 16.09.2026, Чусовитина Аделина Эриковна, руководитель отдела бизнес-анализа.</li>\n<li>[ ] Дополнить адрес, группу / дивизион и время пребывания — адрес, группа и дивизион внесены по таблице учёта; осталось время пребывания.</li>\n<li>[ ] Уточнить состав смены и предупреждение супервайзера.</li>\n<li>[ ] Описать выполненные действия и способы изучения операций: что наблюдали, что показали, что рассказали.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать замеры времени либо их отсутствие — замеры не проводились.</li>\n<li>[ ] Дополнить потребности в ремонте и оснащении, приложить имеющиеся фотографии — в записях не отмечены; уточнить, осматривали ли помещение.</li>\n<li>[x] Указать собранные материалы или их отсутствие.</li>\n<li>[ ] Определить, какие вопросы можно закрыть дистанционно.</li>\n<li>[ ] Назначить дальнейшие действия и ответственных.</li>\n<li>[ ] Принять решение о необходимости повторного визита.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта — объезд 16.09.2026 в таблице пока не отмечен.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>16.09.2026</dd><dt>Аналитик</dt><dd>Чусовитина Аделина Эриковна</dd><dt>Время приезда и отъезда</dt><dd>Не указано</dd><dt>Продолжительность</dt><dd>Не указано</dd><dt>С кем работали, должности</dt><dd>Не указано</dd><dt>Супервайзер предупреждён</dt><dd>Нет сведений; супервайзер ОП — Напалкова В.Е.</dd><dt>Группа / дивизион</dt><dd>Группа «Центр», дивизион 4</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Ценности отправляют «ценной посылкой» с документом перемещения на её основе</b><span>Оформляют «ценную посылку», на её основе — документ перемещения; накладную печатают в 2 экземплярах. Вероятно, один экземпляр остаётся в сейфе, второй уходит в пакет.</span></li><li><b>На одну посылку — несколько печатных форм</b><span>Кроме накладной в 2 экземплярах печатают адресный ярлык и спецификацию: «Потом печатаем спецификацию и всё».</span></li><li><b>Маршрут зависит от вида ценностей, при выкупе порядок тот же</b><span>«Если золото — то в депозитарий, если техника — то на склад». QR-код сканируют («Куар сканирует»), но кто и на каком этапе, не указано.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Оформление ценной посылки</li><li>Выкуп предмета из депозитария или со склада</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>База знаний АРМ</li><li>Бэклог аналитиков / техническая поддержка</li><li>Задача в Битрикс</li></ul>\n<h2>Повторный визит</h2><p>Решение: не принято.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 4 из 12 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-46", "num": "46", "name": "Бульвар Славы", "addr": "г.Уфа, проспект Октября, 123", "g": "Центр", "sup": "Напалкова В.Е.", "area": "Уфа — пр. Октября", "d": "4", "lat": 54.7899, "lon": 56.0351, "tv": [], "st": "", "flags": ["КМТ"], "note": "", "obs": "", "approx": true, "approxNote": "д. 123 не размечен — точка по нумерации нечётной стороны после д. 121", "visits": [{"by": "Золотых Светлана Витальевна", "date": "16.09.2026"}], "reports": [{"date": "16.09.2026", "author": "Золотых Светлана Витальевна", "file": "Отчёт — 16.09.2026 — Золотых Светлана Витальевна — ОП-46 Бульвар Славы.md", "title": "Отчёт об объезде ОП-46 «Бульвар Славы»", "html": "<h2>Отчёт об объезде ОП-46 «Бульвар Славы»</h2>\n<p>Дата подготовки: <strong>16.09.2026</strong>.</p>\n<p>Отчёт подготовлен по результатам визита на ОП на основании беседы с товароведом. Реальные клиентские операции во время визита не наблюдались.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-46 «Бульвар Славы»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, проспект Октября, 123</td></tr>\n<tr><td>Группа / дивизион</td><td>4</td></tr>\n<tr><td>Дата визита</td><td>16.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Золотых Светлана Витальевна</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>с 09:00 до 09:32</td></tr>\n<tr><td>Продолжительность</td><td>32 минуты</td></tr>\n<tr><td>С кем работали, должности</td><td>Товаровед</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да</td></tr>\n</tbody></table>\n<h3>Цель визита</h3>\n<p>Разобрать, как в целом устроена повседневная работа товароведа на ОП, какие системы и формы используются, какие проблемы возникают в работе и какие процессы требуют дополнительного внимания.</p>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Провели беседу с товароведом о повседневной работе на ОП.</li>\n<li>Обсудили отдельные случаи из практики, связанные с проведением сделок и работой мобильного приложения.</li>\n<li>Разобрали используемые системы и каналы: АРМ, Битрикс, чаты, Google Таблицы.</li>\n<li>Обсудили ежедневную отчётность и отдельные рабочие таблицы.</li>\n<li>Зафиксировали регулярные контрольные действия в течение дня.</li>\n<li>Обсудили состояние помещения и текущий ремонт.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Проведение сделки</td><td>Беседа</td><td>По словам товароведа, накануне не пришло сообщение / код, необходимый для завершения проведения сделки. Сделку пришлось заводить повторно. Существует риск появления дубля. Точный механизм уведомления пока не установлен: это может быть СМС или код внутри мобильного приложения.</td></tr>\n<tr><td>ПЭП</td><td>Беседа</td><td>По словам товароведа, текущая работа ПЭП нормальная. Отдельных проблем во время последнего выкупа не было.</td></tr>\n<tr><td>Добор в мобильном приложении</td><td>Беседа</td><td>Клиент пытался увеличить сумму займа по действующему договору. СМС с кодом подтверждения не пришло, поэтому операцию завершить не удалось. Дополнительного соглашения для сравнения не было.</td></tr>\n<tr><td>Клиентский опыт</td><td>Беседа</td><td>По словам товароведа, случаев ухода клиентов из-за описанных проблем не было.</td></tr>\n<tr><td>Ежедневная отчётность</td><td>Беседа</td><td>В Google Таблице заполняется ежедневная форма отчёта: актив, вал, скупка, продажи, оплата QR-кодом, скупка техники.</td></tr>\n<tr><td>Дополнительные таблицы</td><td>Беседа</td><td>Отдельно ведутся таблицы: должники на обзвон, табель, реализация золота, отсрочка по золоту, реализация техники, отсрочка по технике.</td></tr>\n<tr><td>Битрикс</td><td>Беседа</td><td>Используется в работе ОП. В CRM ОП поступают заявки из кол-центра. Также используются отдельные формы «Опрос по посещению» и «Доступ посторонних лиц на ОП».</td></tr>\n<tr><td>Рабочий чат</td><td>Беседа</td><td>Утром сотрудник сообщает в чат, что товаровед на месте, ОП открыто, магазины КМТ открыты.</td></tr>\n<tr><td>Проверка охраны</td><td>Беседа</td><td>В 09:30 товаровед звонит в охрану для проверки тревожной кнопки.</td></tr>\n<tr><td>Помещение</td><td>Беседа</td><td>Стойка слишком высокая, внутри рабочей зоны мало места. Вопрос уже передан в ремонт и находится в работе.</td></tr>\n</tbody></table>\n<h3>Основной процесс: повседневная работа товароведа</h3>\n<p><strong>Границы изучения:</strong> от открытия ОП утром до выполнения ежедневной отчётности и контрольных действий в течение рабочего дня.</p>\n<p><strong>Кто выполняет:</strong> товаровед; взаимодействует с клиентами, кол-центром, охраной и другими подразделениями через корпоративные системы и чаты.</p>\n<p><strong>Где выполняет:</strong> АРМ, Битрикс, Google Таблицы, рабочие чаты, мобильное приложение.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Открытие ОП</td><td>В чат отправляется сообщение, что товаровед на месте, ОП и магазины КМТ открыты</td><td>Не выявлено</td></tr>\n<tr><td>2. Проверка охраны</td><td>В 09:30 выполняется звонок в охрану для проверки кнопки</td><td>Не выявлено</td></tr>\n<tr><td>3. Работа с клиентскими операциями</td><td>Сделки проводятся через АРМ и связанные инструменты</td><td>Возможны проблемы с получением кода / СМС</td></tr>\n<tr><td>4. Работа с мобильным приложением</td><td>Клиентские операции, в том числе добор по займу</td><td>При отсутствии СМС с кодом операция не завершается</td></tr>\n<tr><td>5. Работа с Битрикс</td><td>Работа с CRM ОП и отдельными формами</td><td>Детальная механика не разбиралась</td></tr>\n<tr><td>6. Заполнение отчётности</td><td>Ведётся ежедневная форма отчёта и отдельные рабочие таблицы</td><td>Работа распределена между несколькими таблицами</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений:</strong> Не замерено.</p>\n<p><strong>Время выполнения:</strong> Не замерено.</p>\n<p><strong>Документы и повторный ввод:</strong> наличие повторного ввода специально не проверялось.</p>\n<h3>Что не успели посмотреть</h3>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Реальное обслуживание клиентов и очередь</td><td>Во время визита клиентов не было</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Состояние оборудования, интернета, принтера, сканера и связи</td><td>Не успели уточнить</td></tr>\n<tr><td>Клиентские операции</td><td>Полные сценарии займа, выкупа, перезалога, добора и других операций</td><td>Реальных клиентов не было, времени визита не хватило</td></tr>\n<tr><td>Касса, товар и документы</td><td>Полный цикл кассовых и товарных операций</td><td>Не разбирался</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Фактические трудозатраты по каждой таблице и форме</td><td>Замеры не проводились</td></tr>\n<tr><td>Обходные пути</td><td>Наличие бумажных журналов и дополнительных ручных процессов</td><td>Не уточнялось</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Детальные параметры ремонта</td><td>Вопрос уже передан в работу</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Есть риск незавершённых или дублирующихся операций при сбое подтверждения</h4>\n<p>По словам товароведа, при одной из недавних операций не пришло сообщение / код, необходимый для проведения сделки. Сделку пришлось заводить повторно, из-за чего потенциально может появиться дубль.</p>\n<p>Точный механизм подтверждения пока не установлен и требует отдельного уточнения.</p>\n<h4>2. В мобильном приложении есть сценарий, который блокируется из-за отсутствия СМС-кода</h4>\n<p>При попытке оформить добор по действующему займу клиент не получил СМС с кодом подтверждения. Операцию завершить не удалось.</p>\n<p>Это требует отдельной проверки сценария добора в мобильном приложении и механизма доставки кода подтверждения.</p>\n<h4>3. Работа товароведа распределена между АРМ, Битрикс и несколькими Google Таблицами</h4>\n<p>Помимо основной системы используются CRM ОП, отдельные формы Битрикс и несколько Google Таблиц для ежедневной отчётности, обзвонов, табеля, реализации и отсрочек по золоту и технике.</p>\n<p>Полный объём ручной работы и дублирования данных пока не оценён.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Повторно заводят сделку</td><td>Не пришёл код / сообщение для завершения предыдущей операции</td><td>Потенциальный риск дубля</td></tr>\n<tr><td>Используют отдельные Google Таблицы</td><td>Для ежедневной отчётности и отдельных рабочих процессов</td><td>Работа распределена между несколькими источниками</td></tr>\n<tr><td>Используют отдельные формы в Битриксе</td><td>Для отдельных контрольных процессов</td><td>Требуется отдельно оценить удобство и объём ручного ввода</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> полный перечень обходных путей не установлен.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Повторное заведение сделки</td><td>Не замерено</td><td>Не пришёл код / сообщение для проведения</td><td>Частоту случаев, время повторного ввода, число дублей</td></tr>\n<tr><td>Добор через мобильное приложение</td><td>Не замерено</td><td>Не приходит СМС-код подтверждения</td><td>Частоту сбоев, время ожидания, долю незавершённых операций</td></tr>\n<tr><td>Заполнение ежедневной отчётности</td><td>Не замерено</td><td>Несколько отдельных Google Таблиц</td><td>Время на каждую форму и число дублируемых показателей</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> замеры времени не проводились; выводы основаны преимущественно на рассказе товароведа.</p>\n<h3>Расхождения с регламентом</h3>\n<p>Сверка с действующими регламентами не проводилась; вывод о соответствии не сделан.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Стойка</td><td>Переработка / ремонт</td><td>Стойка слишком высокая</td><td>Не приложено</td></tr>\n<tr><td>Рабочая зона</td><td>Переработка / организация пространства</td><td>Внутри рабочей зоны мало места</td><td>Не приложено</td></tr>\n</tbody></table>\n<p><strong>Статус:</strong> вопрос уже передан в ремонт и находится в работе.</p>\n<p><strong>Фотофиксация:</strong> фотографии во время визита не делались.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> настоящий отчёт, сведения со слов товароведа.</p>\n<p><strong>Полученные на ОП образцы:</strong> не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Техническая поддержка / команда мобильного приложения</td><td>Проверить сценарий добора и доставку СМС-кода</td><td>Пример операции, дата, клиентский сценарий, логи</td><td>Требует проверки</td></tr>\n<tr><td>Бэклог аналитиков / АРМ</td><td>Проверить сценарий повторного заведения сделки и риск дублей</td><td>Точный механизм сообщения / кода и пример случая</td><td>Требует уточнения</td></tr>\n<tr><td>Аналитика процессов</td><td>Оценить объём ручной отчётности в Google Таблицах</td><td>Состав полей, частота обновления, трудозатраты</td><td>Требует отдельной проработки</td></tr>\n<tr><td>Ответственный за помещение / ремонт</td><td>Стойка и рабочая зона</td><td>—</td><td>Уже в работе</td></tr>\n<tr><td>Отчёт об объезде</td><td>Зафиксировать используемые системы, формы и проблемные сценарии</td><td>—</td><td>Зафиксировано</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Нет.</p>\n<p><strong>Обоснование:</strong> повторный визит не требуется. Неуточнённые вопросы по мобильному приложению, кодам подтверждения, возможным дублям и отчётности целесообразнее разбирать отдельно через технические данные, примеры операций и ответственных за системы.</p>\n<h3>Что дописать, чтобы завершить отчёт</h3>\n<ul>\n<li>[x] Указать номер и название ОП, дату визита, ФИО и должность аналитика.</li>\n<li>[x] Указать адрес, дивизион и время пребывания.</li>\n<li>[x] Зафиксировать состав смены и предупреждение супервайзера.</li>\n<li>[x] Описать выполненные действия и способы изучения операций.</li>\n<li>[x] Зафиксировать основные наблюдения и ограничения сведений.</li>\n<li>[x] Указать отсутствие замеров времени.</li>\n<li>[x] Зафиксировать статус ремонта.</li>\n<li>[ ] Уточнить, где именно формируется код / сообщение для проведения сделки.</li>\n<li>[ ] Проверить наличие фактических дублей после повторного заведения сделки.</li>\n<li>[ ] Разобрать сценарий добора в мобильном приложении и причины недоставки СМС.</li>\n<li>[ ] При необходимости получить структуру ежедневной отчётной Google Таблицы.</li>\n<li>[ ] Уточнить состав и назначение CRM ОП в Битриксе.</li>\n<li>[ ] Внести сведения в таблицу учёта объезда после завершения отчёта.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>16.09.2026</dd><dt>Аналитик</dt><dd>Золотых Светлана Витальевна</dd><dt>Время приезда и отъезда</dt><dd>с 09:00 до 09:32</dd><dt>Продолжительность</dt><dd>32 минуты</dd><dt>С кем работали, должности</dt><dd>Товаровед</dd><dt>Супервайзер предупреждён</dt><dd>Да</dd><dt>Группа / дивизион</dt><dd>4</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Есть риск незавершённых или дублирующихся операций при сбое подтверждения</b><span>По словам товароведа, при одной из недавних операций не пришло сообщение / код, необходимый для проведения сделки. Сделку пришлось заводить повторно, из-за чего потенциально может появиться дубль.</span></li><li><b>В мобильном приложении есть сценарий, который блокируется из-за отсутствия СМС-кода</b><span>При попытке оформить добор по действующему займу клиент не получил СМС с кодом подтверждения. Операцию завершить не удалось.</span></li><li><b>Работа товароведа распределена между АРМ, Битрикс и несколькими Google Таблицами</b><span>Помимо основной системы используются CRM ОП, отдельные формы Битрикс и несколько Google Таблиц для ежедневной отчётности, обзвонов, табеля, реализации и отсрочек по золоту и технике.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Повторное заведение сделки</li><li>Добор через мобильное приложение</li><li>Заполнение ежедневной отчётности</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Стойка</li><li>Рабочая зона</li></ul>\n<h2>Куда передать</h2><ul><li>Техническая поддержка / команда мобильного приложения</li><li>Бэклог аналитиков / АРМ</li><li>Аналитика процессов</li><li>Ответственный за помещение / ремонт</li><li>Отчёт об объезде</li></ul>\n<h2>Повторный визит</h2><p>Решение: Нет.</p>\n<h2>Готовность отчёта</h2><p class='rs-chk'>Заполнено 7 из 13 пунктов чек-листа завершения, остальное помечено как «уточнить»</p>"}]}, {"op": "ОП-155", "num": "155", "name": "80летие Победы", "addr": "г.Уфа, Пр.Октября , 160", "g": "Центр", "sup": "Напалкова В.Е.", "area": "Уфа — пр. Октября", "d": "4", "lat": 54.7881613, "lon": 56.0359037, "tv": [], "st": "", "flags": ["КМТ", "КМЗ"], "note": "", "obs": "", "approx": false, "approxNote": "", "visits": [], "reports": []}, {"op": "ОП-163", "num": "163", "name": "Автовокзал", "addr": "г. Уфа, ул. Рихарда Зорге, д.18", "g": "Центр", "sup": "Напалкова В.Е.", "area": "Уфа — ул. Рихарда Зорге", "d": "4", "lat": 54.7509975, "lon": 55.9882149, "tv": [], "st": "", "flags": [], "note": "перевод на ОП-138 с 01.09", "obs": "", "approx": false, "approxNote": "", "visits": [{"by": "Пронин Артем Вадимович", "date": "15.09.2026", "src": "отчёт"}], "reports": [{"date": "15.09.2026", "author": "Пронин Артем Вадимович", "file": "Отчёт — 15.09.2026 — Пронин А.В. — ОП-163.md", "title": "Отчёт об объезде ОП-163 «Автовокзал»", "html": "<h2>Отчёт об объезде ОП-163 «Автовокзал»</h2>\n<p>Дата подготовки: <strong>17.09.2026</strong>.</p>\n<p>Отчёт составлен по чек-листу объезда ОП аналитиком Чусовитиной А.Э. (версия 1.0 от 07.09.2026) и шаблону «Отчёт об объезде ОП». Основания: описание визита аналитиком, наблюдение подготовки техники к реализации и пояснения товароведа. Форма для сбора сведений по этому чек-листу — [[АНКЕТА объезда ОП — одна страница]].</p>\n<p>&gt; [!info] Границы сведений &gt; Аналитик наблюдал подготовку техники к реализации и обзвон клиентов. Проблема расчёта и оплаты по нескольким залоговым билетам зафиксирована со слов товароведа ОП-163. Последовательную оплату по двум билетам аналитик видел ранее на другом ОП; к наблюдениям этого визита она не относится. Подписание ТОРГ-13 и передачу техники курьеру аналитик не застал. Продолжительность визита — 40 минут; время отдельных операций не измерялось.</p>\n<h3>Шапка визита</h3>\n<table><thead><tr><th>Поле</th><th>Значение</th></tr></thead><tbody>\n<tr><td>ОП: номер и название</td><td>ОП-163 «Автовокзал»</td></tr>\n<tr><td>Адрес</td><td>г. Уфа, ул. Рихарда Зорге, д. 18</td></tr>\n<tr><td>Группа / дивизион</td><td>Не указано</td></tr>\n<tr><td>Дата визита</td><td>15.09.2026</td></tr>\n<tr><td>Аналитик</td><td>Пронин Артём Вадимович</td></tr>\n<tr><td>Должность аналитика</td><td>Бизнес-аналитик</td></tr>\n<tr><td>Время приезда и отъезда</td><td>С 11:40 до 12:20</td></tr>\n<tr><td>Продолжительность</td><td>40 минут</td></tr>\n<tr><td>С кем работали, должности</td><td>Белозерова Светлана, товаровед; работала одна</td></tr>\n<tr><td>Супервайзер предупреждён</td><td>Да. Также предупреждены отдел безопасности и видеонаблюдения</td></tr>\n</tbody></table>\n<h3>Что делали на ОП</h3>\n<ol>\n<li>Застали подготовку техники к реализации и разобрали путь в АРМ: рабочий стол «Ломбард» → «Операции с имуществом» → «Перемещение в Центр», выбор склада и вида залога.</li>\n<li>Наблюдали обзвон клиентов и разобрали работу со списком имущества для вывода на торги: сохранение отметок по неоплаченным позициям, проведение документа и запуск процесса «Вывод невостребованного имущества на торги».</li>\n<li>Зафиксировали печать ТОРГ-13 в трёх экземплярах и последующую подготовку техники по списку: проверку, включение и упаковку со спецификацией. Уточнили, что ожидание курьера отслеживается в чате Битрикс.</li>\n<li>Обсудили с товароведом трудности общего расчёта и отдельного проведения операций по нескольким залоговым билетам одного клиента.</li>\n<li>Осмотрели ОП: внутри чисто и опрятно, тараканов не замечено; справа от крыльца отмечено повреждённое или отсутствующее оформление фасада.</li>\n</ol>\n<h3>Что изучили</h3>\n<table><thead><tr><th>Операция / участок</th><th>Как разбирали</th><th>Что удалось выяснить</th></tr></thead><tbody>\n<tr><td>Формирование списка имущества</td><td>Работа товароведа в АРМ, описанная аналитиком</td><td>В рабочем столе «Ломбард» через «Операции с имуществом» → «Перемещение в Центр» выбирают склад и вид залога, после чего получают список имущества для вывода на торги. На визите разбиралась техника</td></tr>\n<tr><td>Предупреждение клиентов и запуск процесса</td><td>Наблюдение обзвона и разбор последовательности работы</td><td>Если клиент не оплачивает в момент обзвона, имущество оставляют для отправки на реализацию; обещание оплатить позже, по описанному порядку работы ОП, не служит основанием для отсрочки. По неоплаченным позициям оставляют отметки, проводят документ и запускают процесс «Вывод невостребованного имущества на торги»</td></tr>\n<tr><td>Документы и подготовка техники</td><td>Наблюдение подготовки и пояснения о документах</td><td>ТОРГ-13 печатают в трёх экземплярах: для ОП, курьера и Центрального склада. Технику по списку проверяют, включают и упаковывают со спецификацией. Количество единиц и результаты проверок не указаны; передачу курьеру аналитик не застал</td></tr>\n<tr><td>Ожидание курьера</td><td>Сведения о рабочем канале связи</td><td>Ожидание курьера отслеживают в чате Битрикс. Название чата и порядок фиксации передачи не приведены</td></tr>\n<tr><td>Оплата нескольких залоговых билетов</td><td>Рассказ товароведа ОП-163</td><td>Общий расчёт требует ручного сложения, операции по билетам проводят отдельно. Со слов товароведа, затруднение касается любых операций по билетам; клиенты с 10–20 залогами приведены как пример. На этом визите такой случай не наблюдался</td></tr>\n<tr><td>Помещение и фасад</td><td>Визуальный осмотр</td><td>Внутри чисто и опрятно, тараканов не замечено. Справа от крыльца — оборванный баннер либо место снятой вывески; точный вид дефекта требует уточнения</td></tr>\n</tbody></table>\n<h4>1. Подготовка техники к реализации: последовательность работы</h4>\n<p><strong>Границы изучения:</strong> от формирования списка в АРМ до подготовки упакованной техники и ожидания курьера. Фактическую передачу курьеру аналитик не застал; приёмка на Центральном складе и дальнейшие торги не наблюдались.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиенты при предупреждении и возможной оплате. На следующем этапе технику и документы передают курьеру.</p>\n<p><strong>Где выполняет:</strong> АРМ, рабочий стол «Ломбард»; телефонный обзвон клиентов; печать ТОРГ-13; место проверки и упаковки техники; чат Битрикс для отслеживания курьера.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит</th><th>Где возникает ожидание или повторная работа</th></tr></thead><tbody>\n<tr><td>1. Вход в операцию</td><td>Рабочий стол «Ломбард» → «Операции с имуществом» → «Перемещение в Центр»</td><td>Время и число переключений не указаны</td></tr>\n<tr><td>2. Параметры отбора</td><td>Выбирают склад и вид залога. При аналитике выбран вид залога «Ломбард.Техника»; название склада не зафиксировано</td><td>Поведение формы и сохранение параметров не описаны</td></tr>\n<tr><td>3. Список имущества</td><td>Появляется список невостребованного имущества для вывода на торги; аналитик описывает его как имущество по залогам с просрочками оплаты</td><td>Точные критерии отбора и сроки отдельно не проверялись</td></tr>\n<tr><td>4. Предупреждение клиентов</td><td>При аналитике товаровед обзванивала клиентов. По описанному порядку работы ОП, если клиент не оплачивает в момент обзвона, имущество отправляют на реализацию; обещание оплатить позже не принимается как основание для отсрочки</td><td>Длительность звонков и число клиентов не зафиксированы</td></tr>\n<tr><td>5. Проведение</td><td>Если оплаты нет, по соответствующим позициям оставляют галочки и проводят документ; запускается процесс «Вывод невостребованного имущества на торги»</td><td>Как проверяют поступление оплаты и меняют отбор при оплате клиента, не описано</td></tr>\n<tr><td>6. Печать</td><td>Печатают ТОРГ-13 в трёх экземплярах: один остаётся в ОП, один курьер оставляет себе, третий передаёт с техникой на Центральный склад</td><td>Подписание аналитик не наблюдал; подписанты не установлены</td></tr>\n<tr><td>7. Проверка техники</td><td>По списку товаровед проверяет технику, в том числе включает её</td><td>Состав проверки, выявленные неисправности и время на единицу не указаны</td></tr>\n<tr><td>8. Упаковка</td><td>Технику упаковывают вместе со спецификацией</td><td>Печатается ли спецификация заново или используется имеющаяся, не указано</td></tr>\n<tr><td>9. Ожидание курьера</td><td>Ожидание и сведения о курьере отслеживают в чате Битрикс</td><td>Время ожидания не измерялось; передачу курьеру аналитик не застал</td></tr>\n</tbody></table>\n<p>Зафиксирован порядок подготовки и запуска процесса. Критерии отбора имущества и описанная практика работы с обещаниями оплаты отдельно с регламентом не сверялись.</p>\n<p><strong>Число действий / переключений:</strong> Не указано; в таблице перечислены смысловые этапы, а не клики.</p>\n<p><strong>Время выполнения:</strong> Не указано. Общая продолжительность визита — 40 минут; длительность подготовки партии и число единиц техники не приведены.</p>\n<p><strong>Документы и повторный ввод:</strong> ТОРГ-13 — три экземпляра для ОП, курьера и Центрального склада; технику упаковывают со спецификацией. Подписание не наблюдалось. Способ получения спецификации и повторный ввод данных на этом участке не зафиксированы.</p>\n<h4>2. Оплата нескольких залоговых билетов одного клиента</h4>\n<p><strong>Границы изучения:</strong> сценарий описан со слов товароведа ОП-163. По её словам, проблема касается любых операций по билетам. Последовательную оплату сначала одного, затем другого билета аналитик видел давно на другом ОП; этот эпизод не относится к визиту 15.09.2026 и не подтверждает детали работы на ОП-163.</p>\n<p><strong>Кто выполняет:</strong> товаровед; клиент согласовывает оплату и передаёт деньги согласно описанному сценарию.</p>\n<p><strong>Где выполняет:</strong> АРМ, «Операции с договором» по отдельному залоговому билету; ручное суммирование, инструмент которого не указан.</p>\n<table><thead><tr><th>Этап</th><th>Что происходит и источник сведений</th><th>Где возникает повторная работа</th></tr></thead><tbody>\n<tr><td>1. Сумма по билету</td><td>По описанию товароведа, открывают «Операции с договором» по одному билету, смотрят сумму процентов и другие необходимые показатели</td><td>Сведения получают отдельно по каждому билету</td></tr>\n<tr><td>2. Общая сумма</td><td>Со слов товароведа, последовательно открывают остальные билеты и вручную складывают суммы</td><td>При 10–20 залогах одного клиента, приведённых как пример, приходится просматривать каждый билет</td></tr>\n<tr><td>3. Согласие и деньги</td><td>По описанному сценарию получают согласие клиента на оплату и деньги</td><td>Конкретный вид операции и способ оплаты не уточнены</td></tr>\n<tr><td>4. Проведение</td><td>Со слов товароведа, каждую операцию проводят по своему билету отдельно и повторно пересчитывают суммы</td><td>Повторяются открытия билетов, расчёты и проведение отдельных операций</td></tr>\n</tbody></table>\n<p><strong>Число действий / переключений и время:</strong> Замеры не предоставлены. Число 10–20 — пример нагрузки со слов товароведа, а не количество билетов, обработанных при аналитике.</p>\n<p><strong>Документы и повторный ввод:</strong> индивидуальные операции по билетам; печатные формы, число чеков, распределение общей оплаты и проверка итогового результата не описаны.</p>\n<h3>Что не успели посмотреть</h3>\n<p>Отсутствие сведений не означает отсутствия операции или функции на ОП.</p>\n<table><thead><tr><th>Раздел методики</th><th>Что осталось</th><th>Почему / как уточнить</th></tr></thead><tbody>\n<tr><td>Помещение и клиентский поток</td><td>Число рабочих мест, поток клиентов и наличие очереди</td><td>Товаровед работала одна; сведения о числе посетителей не зафиксированы</td></tr>\n<tr><td>Рабочее место, техника и связь</td><td>Открытые программы и окна, учётная запись, оборудование, скорость и связь</td><td>Наличие АРМ и чата Битрикс описано в процессах, полное обследование рабочего места не отражено</td></tr>\n<tr><td>Клиентские операции</td><td>Проверка поступления оплаты после обзвона; расчёт и оплата нескольких билетов, итоговая сверка</td><td>Оплата нескольких билетов на этом визите не наблюдалась. Ручное суммирование и повторный пересчёт описаны товароведом; инструмент и состав расчёта не зафиксированы</td></tr>\n<tr><td>Касса, товар и документы</td><td>Название склада, подписи ТОРГ-13, получение спецификации, передача курьеру и приёмка на Центральном складе</td><td>Вид залога и получатели трёх экземпляров уточнены; передачу аналитик не застал</td></tr>\n<tr><td>Отчётность и коммуникации</td><td>Название чата, способ получения сведений о курьере и фиксации передачи, прочая отчётность</td><td>Известен канал связи, но не весь порядок взаимодействия</td></tr>\n<tr><td>Обходные пути</td><td>Инструмент суммирования, другие ручные записи и доступность общего расчёта в АРМ</td><td>Ручное сложение описано товароведом; функции системы отдельно не проверялись</td></tr>\n<tr><td>Ремонт и оснащение</td><td>Точный характер дефекта справа от крыльца; изучение фото</td><td>Фото у аналитика есть, но к отчёту не приложено. Заявки на восстановление нет. Не установлено, оборван ли баннер или снята вывеска</td></tr>\n</tbody></table>\n<h3>Три главных наблюдения</h3>\n<h4>1. Подготовка техники сочетает действия в АРМ, предупреждение клиентов и физическую проверку</h4>\n<p>Последовательность включает отбор имущества через «Перемещение в Центр», дополнительный обзвон клиентов, проведение документа и запуск процесса «Вывод невостребованного имущества на торги». Затем печатают ТОРГ-13 в трёх экземплярах, проверяют и включают технику, упаковывают её со спецификацией. Ожидание курьера отслеживают в чате Битрикс.</p>\n<p><strong>Значение для описания процесса:</strong> необходимо учитывать не только проведение документа, но и работу с клиентами, проверку товара, документы и передачу. Применение чата само по себе не подтверждает отсутствие статусов или иной функции в АРМ.</p>\n<h4>2. По нескольким билетам клиента суммы складывают вручную, операции проводят отдельно</h4>\n<p>Со слов товароведа ОП-163, в «Операции с договором» видны показатели одного билета, поэтому для общего расчёта приходится открывать каждый билет и вручную складывать суммы. После согласия клиента и получения денег операции проводят отдельно, повторяя расчёты. По её словам, затруднение касается любых операций по билетам и особенно заметно при 10–20 залогах; это число приведено как пример. На визите такой случай не наблюдался.</p>\n<p><strong>Потребность:</strong> видеть общий расчёт по выбранным билетам клиента и сократить повторяющиеся действия при оплате. Доступность других способов расчёта и проведения в АРМ отдельно не проверялась; при проработке потребности необходимо разобрать конкретные сценарии операций.</p>\n<p>Похожее затруднение обсуждалось в [[Отчёт — 16.09.2026 — Пронин А.В. — ОП-144]], где предложены столбцы общей задолженности и задолженности по процентам в списке ЗБ. Это дополняет предложение по отображению сумм; вопрос отдельного проведения каждой оплаты остаётся для проработки.</p>\n<h4>3. Справа от крыльца требуется восстановление оформления фасада</h4>\n<p>Внутри ОП чисто и опрятно, тараканов при осмотре не замечено. Снаружи справа от крыльца отмечено непрезентабельное оформление: по описанию аналитика, оборван баннер либо снята вывеска.</p>\n<p><strong>Потребность:</strong> уточнить объект и состояние, определить восстановление или замену после осмотра и фотофиксации. Вид работ пока не определён; ремонт конструкций здания этим наблюдением не подтверждён.</p>\n<h3>Обходные пути</h3>\n<table><thead><tr><th>Что делают</th><th>Почему</th><th>Последствие</th></tr></thead><tbody>\n<tr><td>Вручную складывают суммы по нескольким залоговым билетам</td><td>По используемому порядку показатели просматривают в АРМ отдельно по каждому билету</td><td>Повторное открытие билетов и ручная арифметика; конкретные ошибки и затраты времени не зафиксированы</td></tr>\n</tbody></table>\n<p><strong>Полнота сведений:</strong> один способ ручной работы описан со слов товароведа. Инструмент расчёта не указан. Чат Битрикс отмечен как канал отслеживания курьера; оснований считать его нештатным обходом по предоставленным данным нет.</p>\n<h3>Потери времени</h3>\n<table><thead><tr><th>Операция</th><th>Сколько</th><th>Из-за чего</th><th>Что замерить</th></tr></thead><tbody>\n<tr><td>Расчёт оплаты по нескольким билетам</td><td>Замеры не предоставлены</td><td>Открытие каждого билета и ручное суммирование</td><td>Число билетов, время поиска сумм и расчёта итога</td></tr>\n<tr><td>Проведение оплаты по нескольким билетам</td><td>Замеры не предоставлены</td><td>Отдельное проведение и повторная проверка сумм</td><td>Количество действий и длительность по каждому билету и всей оплате</td></tr>\n</tbody></table>\n<p><strong>Ограничения оценки:</strong> сведения о ручном суммировании, пересчёте и отдельном проведении операций получены от товароведа; на ОП-163 этот сценарий не наблюдался. Время не измерялось. Обзвон, проверка и упаковка техники зафиксированы как этапы подготовки. Время ожидания курьера также не измерялось.</p>\n<h3>Расхождения с регламентом</h3>\n<p>При подготовке отчёта сверка с действующими регламентами не проводилась; вывод о соответствии не сделан. Описанные последовательности и замечание о нескольких билетах сами по себе не доказывают нарушение установленного порядка.</p>\n<h3>Требует ремонта / замены</h3>\n<table><thead><tr><th>Что и где</th><th>Вид потребности</th><th>Что требуется уточнить</th><th>№ фото</th></tr></thead><tbody>\n<tr><td>Оформление фасада справа от крыльца: оборванный баннер либо место снятой вывески</td><td>Осмотр с определением восстановления или замены; заявки нет</td><td>Что именно повреждено или отсутствует, размеры и способ крепления; изучить имеющееся фото</td><td>Фото есть у аналитика, к отчёту не приложено</td></tr>\n</tbody></table>\n<p>Внутри чисто и опрятно, тараканов не замечено. Другие потребности в ремонте в описании визита не приведены.</p>\n<p><strong>Фотофиксация:</strong> по уточнению аналитика, фотография фасада есть; к отчёту она пока не приложена. Её содержание при подготовке отчёта не проверялось.</p>\n<h3>Артефакты</h3>\n<p><strong>Материалы для работы:</strong> описание визита аналитиком и сведения товароведа; чек-лист Чусовитиной А.Э. 1.0 и шаблон отчёта. Связанный полевой лист — [[АНКЕТА объезда ОП — одна страница]].</p>\n<p><strong>Полученные на ОП образцы:</strong> пустой бланк ТОРГ-13, спецификация, обезличенные примеры экранов и фото фасада не приложены.</p>\n<h3>Куда это идёт дальше</h3>\n<p>Действия ниже предложены для дальнейшей работы. Создание задач и передача материалов в рамках подготовки отчёта не выполнялись.</p>\n<table><thead><tr><th>Куда</th><th>Что передать</th><th>Чего не хватает</th><th>Ответственный / срок / статус</th></tr></thead><tbody>\n<tr><td>Реестр процессов</td><td>Подготовка техники к реализации: АРМ, обзвон, документы, проверка, упаковка, ожидание курьера</td><td>Проверка поступления оплаты, подписи и завершение передачи</td><td>Не назначены; предложено</td></tr>\n<tr><td>Реестр идей CRM / АРМ</td><td>Общий расчёт и сокращение действий при оплате выбранных залоговых билетов одного клиента</td><td>Полные сценарии отдельных видов операций и проверка существующих функций</td><td>Не назначены; предложено</td></tr>\n<tr><td>База знаний АРМ</td><td>Путь через «Перемещение в Центр» и подготовка ТОРГ-13; связь с процессом «Вывод невостребованного имущества на торги»</td><td>Точные параметры, условия отбора, подписи и конечные статусы</td><td>Не назначены; предложено</td></tr>\n<tr><td>Бэклог аналитиков</td><td>Проверить доступные способы расчёта и проведения оплаты по нескольким билетам</td><td>Детали общего расчёта, число действий и длительность полного сценария</td><td>Не назначены; предложено</td></tr>\n<tr><td>Ответственный за помещение / оснащение</td><td>Оформление фасада справа от крыльца</td><td>Приложить и изучить имеющееся фото, определить точный объект и вид работ</td><td>Не назначены; предложено; заявки нет</td></tr>\n<tr><td>Задача в Битрикс</td><td>Обращение по фасаду и проверке сценария оплаты нескольких билетов</td><td>Исполнители, описание дефекта, имеющееся фото и проверяемый сценарий</td><td>Заявки по фасаду нет; сведения о задачах по АРМ не предоставлены. При подготовке отчёта задачи не создавались</td></tr>\n</tbody></table>\n<h3>Нужен повторный визит</h3>\n<p><strong>Решение:</strong> Не принято.</p>\n<p><strong>Обоснование:</strong> подписи ТОРГ-13, получение спецификации, порядок передачи курьеру и сведения по фасаду можно уточнить дистанционно. Повторное наблюдение может понадобиться для замеров полного расчёта и оплаты нескольких билетов, если дистанционно получить эти сведения не удастся.</p>\n<h3>Открытые вопросы и дальнейшие действия</h3>\n<p>Подготовка отчёта по предоставленным сведениям завершена. Наличие фотографии фасада и отсутствие заявки уточнены. Незаполненные пункты чек-листа обозначены в разделе «Что не успели посмотреть». Следующие пункты относятся к дальнейшей работе, а не к повторному опросу о ненаблюдавшихся действиях.</p>\n<ul>\n<li>[ ] Для описания процесса уточнить подписантов ТОРГ-13, получение спецификации и порядок передачи техники курьеру и Центральному складу.</li>\n<li>[ ] При разборе оплаты нескольких билетов зафиксировать инструмент и состав ручного расчёта, проверяемые примеры отдельных операций, действия и время; проверить доступные функции АРМ. По словам товароведа, затруднение касается любых операций по ЗБ.</li>\n<li>[ ] Приложить и изучить имеющееся фото фасада справа от крыльца, определить необходимые работы и оформить заявку.</li>\n<li>[ ] Определить ответственных и сроки дальнейших действий, необходимость повторного визита и внести сведения в таблицу учёта объезда.</li>\n</ul>", "brief": "<dl class='rs'><dt>Дата визита</dt><dd>15.09.2026</dd><dt>Аналитик</dt><dd>Пронин Артём Вадимович</dd><dt>Время приезда и отъезда</dt><dd>С 11:40 до 12:20</dd><dt>Продолжительность</dt><dd>40 минут</dd><dt>С кем работали, должности</dt><dd>Белозерова Светлана, товаровед; работала одна</dd><dt>Супервайзер предупреждён</dt><dd>Да. Также предупреждены отдел безопасности и видеонаблюдения</dd><dt>Группа / дивизион</dt><dd>Не указано</dd></dl>\n<h2>Главные наблюдения</h2><ol class='rs-obs'><li><b>Подготовка техники сочетает действия в АРМ, предупреждение клиентов и физическую проверку</b><span>Последовательность включает отбор имущества через «Перемещение в Центр», дополнительный обзвон клиентов, проведение документа и запуск процесса «Вывод невостребованного имущества на торги». Затем печатают ТОРГ-13 в трёх…</span></li><li><b>По нескольким билетам клиента суммы складывают вручную, операции проводят отдельно</b><span>Со слов товароведа ОП-163, в «Операции с договором» видны показатели одного билета, поэтому для общего расчёта приходится открывать каждый билет и вручную складывать суммы. После согласия клиента и получения денег…</span></li><li><b>Справа от крыльца требуется восстановление оформления фасада</b><span>Внутри ОП чисто и опрятно, тараканов при осмотре не замечено. Снаружи справа от крыльца отмечено непрезентабельное оформление: по описанию аналитика, оборван баннер либо снята вывеска.</span></li></ol>\n<h2>Потери времени</h2><ul><li>Расчёт оплаты по нескольким билетам</li><li>Проведение оплаты по нескольким билетам</li></ul>\n<h2>Требует ремонта / замены</h2><ul><li>Оформление фасада справа от крыльца: оборванный баннер либо место снятой вывески</li></ul>\n<h2>Куда передать</h2><ul><li>Реестр процессов</li><li>Реестр идей CRM / АРМ</li><li>База знаний АРМ</li><li>Бэклог аналитиков</li><li>Ответственный за помещение / оснащение</li><li>Зада       (p.obs ? "<dt>Важное наблюдение</dt><dd><b style='display:inline;font-size:12.5px'>" +
               esc(p.obs) + "</b></dd>" : "") +
      "<dt>Координаты</dt><dd>" + p.lat.toFixed(6) + ", " + p.lon.toFixed(6) +
        (p.approx ? '<br><span style="color:#b06000">⚠ приблизительные' +
          (p.approxNote ? ": " + esc(p.approxNote) : "") + "</span>" : "") + "</dd>" +
    "</dl>"
  );
  p._m = m;
});

// ─── список слева ───
var list = document.getElementById("list");
var lastG = null, lastArea = null;
POINTS.forEach(function(p){
  if (p.g !== lastG){
    var gh = document.createElement("div");
    gh.className = "ghdr"; gh.setAttribute("data-g", p.g);
    gh.innerHTML = "Группа «" + esc(p.g) + "»" + (p.sup ? " <small>· " + esc(p.sup) + "</small>" : "");
    list.appendChild(gh); lastG = p.g; lastArea = null;
  }
  if (p.area !== lastArea){
    var h = document.createElement("div");
    h.className = "grp"; h.textContent = p.area;
    list.appendChild(h); lastArea = p.area;
  }
  var tags = [];
  p.visits.forEach(function(v){
    tags.push('<span class="tag ok">✓ ' + esc(v.date) + " · " + esc(v.by) +
              (v.src ? " · по отчёту" : "") + "</span>");
  });
  p.reports.forEach(function(r, i){
    tags.push('<span class="tag rep" data-rep="' + esc(p.op) + '" data-i="' + i +
              '">📄 отчёт ' + esc(r.date) + "</span>");
  });
  p.flags.forEach(function(f){ tags.push('<span class="tag">' + esc(f) + "</span>"); });
  if (p.st) tags.push('<span class="tag">ст. товаровед</span>');
  if (p.approx) tags.push('<span class="tag warn">коорд. прибл.</span>');

  var b = document.createElement("button");
  b.className = "item";
  b.setAttribute("data-op", p.op);
  b.innerHTML =
    '<span class="op' + (p.visits.length ? " v" : "") + '" style="background:' +
      colorOf(p) + '">' + esc(p.op) + "</span>" +
    '<span><span class="name">' + esc(p.name) + "</span><br>" +
    '<span class="addr">' + esc(p.addr) + "</span>" +
    (p.obs ? '<span class="obs">❗ ' + esc(p.obs) + "</span>" : "") +
    (tags.length ? '<span class="note">' + tags.join("") + "</span>" : "") +
    "</span>";
  b.onclick = function(){
    document.querySelectorAll(".item").forEach(function(e){ e.classList.remove("on"); });
    b.classList.add("on");
    if (!map.hasLayer(p._m)) return;
    map.flyTo([p.lat,p.lon], 17, {duration:0.6});
    p._m.openPopup();
  };
  list.appendChild(b);
});

// ─── панель отчёта об объезде ───
var rp = document.getElementById("rp");
var rpTitle = document.getElementById("rpTitle");
var rpMeta = document.getElementById("rpMeta");
var rpTabs = document.getElementById("rpTabs");
var rpBody = document.getElementById("rpBody");

// Панель лежит внутри контейнера карты — гасим прокрутку и клики,
// иначе колесо мыши зумит карту вместо прокрутки отчёта.
L.DomEvent.disableScrollPropagation(rp);
L.DomEvent.disableClickPropagation(rp);

function byOp(op){
  for (var i = 0; i < POINTS.length; i++) if (POINTS[i].op === op) return POINTS[i];
  return null;
}

function openReport(op, i, view){
  var p = byOp(op);
  if (!p || !p.reports.length) return;
  i = Math.max(0, Math.min(i | 0, p.reports.length - 1));
  view = view || "brief";                       // по умолчанию — краткая справка
  var r = p.reports[i];
  rpTitle.textContent = p.op + (p.name ? " «" + p.name + "»" : "");
  rpMeta.textContent = "Объезд " + r.date + (r.author ? " · " + r.author : "") +
                       " · " + r.file;

  rpTabs.innerHTML = "";
  [["brief", "Кратко"], ["full", "Полный текст"]].forEach(function(v){
    var b = document.createElement("button");
    b.textContent = v[1];
    if (view === v[0]) b.className = "on";
    b.onclick = function(){ openReport(op, i, v[0]); };
    rpTabs.appendChild(b);
  });
  if (p.reports.length > 1){
    var sep = document.createElement("span");
    sep.style.cssText = "align-self:center;color:#9aa5b1;margin:0 2px";
    sep.textContent = "|";
    rpTabs.appendChild(sep);
    p.reports.forEach(function(rr, j){
      var b = document.createElement("button");
      b.textContent = rr.date;
      if (j === i) b.className = "on";
      b.onclick = function(){ openReport(op, j, view); };
      rpTabs.appendChild(b);
    });
  }

  rpBody.className = "rp-body" + (view === "brief" ? " brief" : "");
  rpBody.innerHTML = view === "brief" ? r.brief : r.html;
  rpBody.scrollTop = 0;
  rp.hidden = false;
}

function closeReport(){ rp.hidden = true; }

document.getElementById("rpClose").onclick = closeReport;
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeReport();
});
// Перехват в фазе погружения: тег отчёта лежит внутри кнопки списка,
// иначе сработал бы её собственный обработчик.
document.addEventListener("click", function(e){
  var t = e.target && e.target.closest ? e.target.closest(".tag.rep") : null;
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  openReport(t.getAttribute("data-rep"), parseInt(t.getAttribute("data-i"), 10));
}, true);

// ─── фильтры ───
function applyFilter(){
  var gOn = {}, dOn = {};
  document.querySelectorAll("input[data-g]").forEach(function(i){ gOn[i.dataset.g] = i.checked; });
  document.querySelectorAll("input[data-d]").forEach(function(i){ dOn[i.dataset.d] = i.checked; });
  var onlyV = document.getElementById("onlyVisited").checked;

  var shown = 0;
  POINTS.forEach(function(p){
    var vis = gOn[p.g] && dOn[p.d] && (!onlyV || p.visits.length > 0);
    if (vis){ shown++; if (!map.hasLayer(p._m)) p._m.addTo(map); }
    else if (map.hasLayer(p._m)) map.removeLayer(p._m);
    var btn = document.querySelector('.item[data-op="' + p.op + '"]');
    if (btn) btn.style.display = vis ? "" : "none";
  });

  document.querySelectorAll(".ghdr").forEach(function(h){
    h.style.display = gOn[h.getAttribute("data-g")] ? "" : "none";
  });
  document.querySelectorAll(".grp").forEach(function(h){
    var any = false, n = h.nextElementSibling;
    while (n && !n.classList.contains("grp") && !n.classList.contains("ghdr")){
      if (n.style.display !== "none") any = true;
      n = n.nextElementSibling;
    }
    h.style.display = any ? "" : "none";
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}
document.querySelectorAll("#side input[type=checkbox]").forEach(function(i){
  i.addEventListener("change", applyFilter);
});

// ─── счётчик ───
function done(a){ return a.filter(function(p){ return p.visits.length; }).length; }
var byGroup = META.groups.map(function(g){
  var a = POINTS.filter(function(p){ return p.g === g.name; });
  return esc(g.name) + " " + done(a) + "/" + a.length;
}).join(" · ");
document.getElementById("count").innerHTML =
  "✓ Объезд пройден: " + done(POINTS) + " из " + POINTS.length +
  " <span>· " + byGroup + "</span>";

applyFilter();
map.fitBounds(L.latLngBounds(POINTS.map(function(p){ return [p.lat,p.lon]; })), {padding:[45,45]});
</script>
</body>
</html>
